o": "ok", "palabras": 4155, "frases": 216, "lineas_de_muestra": 0, "smells": 3, "por_severidad": {"rojo": 0, "ambar": 1, "info": 2}}, "texto": "# 0.4 · Los atajos: por qué fallan los detectores y los que prometen disfrazar\n\n## Un 87 % en la pantalla\n\nUna profesora corrige por la noche. Pega el trabajo de un alumno en uno de esos programas que dicen detectar texto de máquina, y la pantalla le devuelve un número: **87 % de probabilidad de IA**. Barra roja.\n\nAhora tiene que decidir algo, y ninguna de las opciones es cómoda. Si acusa y se equivoca, el daño a esa persona no se arregla con una disculpa. Si no dice nada y acertaba, se le cuela.\n\nLo que no sabe —porque el programa no se lo cuenta— es qué ha medido ese 87 %. No ha medido quién escribió el trabajo. Ha medido **cuánto se parece a lo que se espera de un texto**, que es una pregunta distinta, y hay gente a la que eso le sale alto sin haber tocado una máquina en su vida.\n\n*(La profesora es inventada. Los programas existen, el número que devuelven tiene esa forma, y todo lo que viene después está medido.)*\n\n## Dónde estás\n\nDel capítulo anterior sales sabiendo por qué los textos automáticos se parecen entre sí: la máquina le da a cada uno lo más probable, y lo más probable es lo mismo para todos.\n\nCon eso encima, el atajo se piensa solo. Si el problema es la previsibilidad, **habrá quien la mida y quien la disfrace** — y en efecto hay un mercado de las dos cosas. Este capítulo cierra esa puerta antes de que el curso siga, porque quien confíe en cualquiera de los dos no va a necesitar nada de lo que viene después.\n\n- **De aquí sales sabiendo** qué mide de verdad un detector, por qué falla siempre contra la misma gente, qué le pasa a un texto cuando lo pasas por un programa que promete disfrazarlo, y con qué se sustituyen los dos.\n- **Y sale también el vocabulario del resto del curso**: qué es un olor de prosa y por qué es una señal para mirar y no una falta que corregir.\n\nCon esto se cierra el módulo de marco. Lo que viene después es el catálogo: se lee ya con otras herramientas.\n\n## Lo que vas a leer aquí\n\n1. Qué mide un detector cuando dice «87 % de IA»\n2. El experimento que deja al detector sin defensa\n3. A quién le hace daño este fallo\n4. El otro atajo: los que prometen disfrazar el texto\n5. Y quién mide a los que miden\n6. Lo que se mira en su lugar: los olores de prosa\n7. Señal para mirar, no falta que corregir\n8. Confusiones habituales\n9. Preguntas frecuentes\n\n---\n\n## 1 · Qué mide un detector cuando dice «87 % de IA»\n\nPara ver dónde empieza el malentendido hay que mirar cómo funciona un detector por dentro.\n\nUn modelo de lenguaje, mientras escribe, va calculando qué palabra es más probable después de la anterior. Los detectores comerciales usan eso mismo pero al revés: le dan tu texto a un modelo y le preguntan, palabra por palabra, **cuánto le sorprende lo que va leyendo**. Si el modelo tenía esa misma palabra en la cabeza, el texto le resulta poco sorprendente. Si le salta a cada rato con algo que no esperaba, mucho.\n\nPoca sorpresa, dice el programa, es señal de máquina. Y tiene su lógica: una máquina elige lo más probable porque es literalmente lo que sabe hacer.\n\n**El problema es todo lo demás que también sale poco sorprendente.**\n\nUn texto escrito con vocabulario sencillo sale poco sorprendente. Uno escrito en un idioma que no es el tuyo, y en el que tiras del vocabulario que dominas, sale poco sorprendente. Un informe con la jerga de su sector, un manual de instrucciones, una carta administrativa: los tres salen poco sorprendentes, y a los tres los escribió una persona.\n\nAsí que hay dos frases aquí y no dicen lo mismo. La que el programa te enseña, «87 % de probabilidad de IA», habla de quién escribió. La que el programa puede sostener, «este texto es de los previsibles», habla solo de cómo suena.\n\n### Un aviso para lo que escribes tú\n\nSi escribes claro, con frases que se entienden a la primera y sin vocabulario de lucimiento, estás en el grupo que estos programas marcan más. Escribes previsible en el sentido estadístico. Escribir plano es otra cosa.\n\nSale a cuenta saberlo antes de que alguien te pase un texto tuyo por uno de estos y te pida explicaciones.\n\n---\n\n## 2 · El experimento que deja al detector sin defensa\n\nTodo lo anterior se podría discutir. Lo que viene, no: alguien se molestó en medirlo.\n\nEn julio de 2023, un equipo de la Universidad de Stanford juntó dos montones de ensayos. En uno, noventa y un trabajos de estudiantes que se preparaban el TOEFL, el examen de inglés para quien no lo tiene como lengua materna. En el otro, ochenta y ocho de estudiantes estadounidenses de octavo curso. Todos escritos por personas, sin excepción. Los pasaron por siete detectores comerciales distintos.\n\nLos ensayos de los estudiantes estadounidenses salieron bien parados. Los de los otros, no.\n\n> De media, los siete programas marcaron como escrito por una máquina el **61,3 %** de los ensayos del TOEFL. La misma media sobre los ensayos de los estudiantes nativos fue del **5,19 %**.\n\nLos dos números son de personas escribiendo. La diferencia entre ellos no la explica nada que tenga que ver con quién escribió: la explica el idioma en el que lo hizo.\n\nDel mismo experimento salen dos cifras más, y te interesan para cuando alguien defienda estos programas. Los siete detectores coincidieron en marcar el 19,8 % de los ensayos del TOEFL, y el 97,8 % de esos ensayos fue marcado por al menos uno de los siete. O sea que casi todos aquellos estudiantes habrían tenido un problema con alguien, dependiendo de qué programa usara ese alguien.\n\n### La parte del experimento que no se puede discutir\n\nLos investigadores hicieron algo más. Eso es lo que convierte el estudio en un argumento y no en una estadística.\n\nCogieron los mismos ensayos del TOEFL y le pidieron a un modelo que les subiera el nivel del vocabulario, sin cambiar lo que decían. Los volvieron a pasar por los detectores.\n\nEl 61,3 % bajó al **11,6 %**.\n\nDespués hicieron lo contrario: cogieron los ensayos de los estudiantes estadounidenses y le pidieron al modelo que simplificara el vocabulario, como si los hubiera escrito alguien con menos soltura en el idioma.\n\nEl 5,19 % subió al **56,65 %**.\n\nLos cuatro números juntos dicen una sola cosa: **el mismo ensayo, con lo mismo dentro y escrito por la misma persona, cambia de veredicto cuando le cambian el nivel del vocabulario**. Lo que se tocó fueron las palabras. La autoría no se movió en ningún momento del experimento, y el veredicto sí.\n\n*(El estudio salió en* Patterns *, de la editorial Cell Press, en julio de 2023, y su versión previa está en el repositorio arXiv. Sus límites, en las preguntas frecuentes: importan.)*\n\n---\n\n## 3 · A quién le hace daño este fallo\n\nHasta aquí esto parece un fallo técnico, de los que reparten el daño al azar. Este lo reparte siempre en la misma dirección.\n\nUn programa que castiga el vocabulario sencillo marca de más a cuatro clases de persona. A quien escribe en un idioma que aprendió de adulto. A quien no fue a la universidad. A quien tiene un vocabulario más corto porque su vida ha sido otra. Y a quien escribe claro a propósito porque le enseñaron a escribir para que le entiendan.\n\nY no marca a quien escribe con un vocabulario amplio, giros infrecuentes y frases largas. Justo el perfil que estos programas dan por humano por defecto.\n\nEsto sale del aula y llega a tu trabajo por tres puertas distintas.\n\n**Si formas a alguien**, el día que uno de estos marque un trabajo vas a tener que decidir con un número que no significa lo que parece, y decidir rápido. **Si diriges contenido**, el día que marque el texto de un colaborador externo vas a estar a punto de acusar a un proveedor con el que llevas años. **Y si escribes tú**, el día que marque algo tuyo te toca defenderte.\n\nEse último caso tiene una consecuencia incómoda que merece un párrafo propio: **no hay manera de demostrar que un texto lo escribiste tú**. Quien acusa enseña un número. Quien se defiende no tiene nada equivalente que enseñar. Un borrador anterior ayuda, un historial de versiones ayuda, un correo con la idea a medias ayuda — pero ninguna de las tres cosas prueba nada, y ya estás en la posición de tener que justificarte.\n\nPor eso te interesa tener las cifras del apartado anterior a mano. Con el estudio delante puedes decir que ese número sube y baja según lo cultas que sean las palabras, y que por sí solo no señala a nadie. Es una conversación distinta de la de discutir sobre tecnología.\n\n**Un profesor con uno de estos abierto no está comprobando quién escribió el trabajo. Está comprobando quién escribe como se espera que escriba alguien con estudios.** Y le va a saltar más veces con los alumnos que ya lo tenían más difícil.\n\nPor eso la escena del principio no se resuelve mirando el número: con ese 87 % en la pantalla no hay información suficiente para acusar a nadie, y el programa no lo dice.\n\n**Lo que sí se puede hacer está dos párrafos más arriba, mirado del derecho.** Lo que a ti te serviría para defenderte —el borrador anterior, el historial de versiones, el correo con la idea a medias— es también lo que puedes pedir cuando el trabajo lo corriges tú. **Preguntar por el proceso en vez de por el veredicto** deja la conversación en un sitio donde hay algo que mirar, y no en uno donde una de las dos partes tiene que demostrar su inocencia.\n\n---\n\n## 4 · El otro atajo: los que prometen disfrazar el texto\n\nEn el otro lado del mismo mercado están los que venden lo contrario. Le pasas un texto de máquina y te lo devuelven reescrito para que el detector no lo marque. Se anuncian con cifras que rozan el pleno: **Undetectable AI**, uno de los más conocidos, promete más de un 99 % de éxito y te devuelve el dinero si el texto sale marcado.\n\nCuando empecé a mirar esto daba por hecho que serían humo, de los que cobran por una plantilla de reescritura. **Funcionan.** Que funcionen es justamente lo que obliga a mirar qué precio tienen.\n\nUn trabajo de enero de 2025 probó diecinueve de estas herramientas y catalogó lo que dejan por el camino: citas inventadas, frases que no significan nada, erratas y concordancias rotas. En su escalón más agresivo, el texto que sale se describe como de nivel escolar. Al compararlo con el original, la versión reescrita ganaba en fluidez poco más de una de cada cuatro veces en el escalón suave, y una de cada treinta y siete en el agresivo.\n\nOtro trabajo, de marzo de 2025, midió lo mismo por otro sitio: cogió seis formas distintas de esquivar detectores y les midió la legibilidad antes y después. La escala va de cero a cien, y un número alto quiere decir que el texto se lee fácil. La más eficaz de las seis **baja diecinueve puntos**, y los textos de partida estaban en cuarenta y nueve: se dejan por el camino dos quintas partes de lo que tenían. Las que dejan el texto casi igual apenas esquivan nada.\n\nLos autores lo resumen en una frase que vale como conclusión de toda esta sección: los métodos que más engañan al detector son los que más estropean el texto, y los que cuidan el texto engañan poco. El objetivo que persiguen estas herramientas y un texto legible tiran en direcciones contrarias.\n\n### Meter faltas a mano, que es el mismo error sin factura\n\nNo hace falta comprar nada para caer en esto. Se ve en redacciones donde alguien decidió que para «sonar humano» hay que meter faltas a propósito: una errata suelta, una coma mal puesta, una concordancia rota.\n\nY no pasa solo en el aula: se ve en departamentos de contenido donde alguien decidió que las notas de prensa salían «demasiado perfectas». Meter faltas a mano es el mismo error que comprar un disfraz, con menos presupuesto. La imperfección que hace humano a un texto es de **ritmo y de forma** —una frase de una palabra, un aparte en mitad de un párrafo, empezar por «Y»—, nunca de corrección. Un texto con faltas no parece humano: parece un texto con faltas. Y como esas faltas son lo primero que corrige cualquiera que revise el texto antes de publicarlo, el disfraz dura hasta la primera lectura atenta.\n\n---\n\n## 5 · Y quién mide a los que miden\n\nQueda una pregunta que se hace poca gente: si los detectores se equivocan, ¿cómo sabemos cuánto se equivocan?\n\nLa respuesta incómoda es que las cifras que circulan suelen publicarlas quienes tienen algo que ganar. El fabricante del detector publica lo bien que detecta. El fabricante del disfraz publica lo bien que esquiva. Y los dos miden con su propio material.\n\nDos ejemplos de lo que pasa cuando miden terceros, con un año de diferencia entre ellos:\n\n| Quién midió | Qué concluyó sobre el detector **Pangram** |\n|---|---|\n| Un trabajo de la Universidad de Chicago *(septiembre de 2025)* | que **resiste** a las herramientas de disfraz |\n| Uno de la Universidad de Notre Dame *(agosto de 2026)* | que, sobre 642 resúmenes académicos disfrazados, **más del 96 % se le escapa** |\n\nDos equipos serios, dos conclusiones opuestas, el mismo programa. Y el mismo patrón aparece dentro de un solo estudio: en el trabajo de las diecinueve herramientas, un texto disfrazado se le escapa al 1,7 % contra un detector y al 71,8 % contra otro.\n\nEso es lo que significa de verdad «depende de quién mida», y tiene la forma de un rango que va de casi nada al todo según qué programa tengas delante y quién haya hecho la prueba.\n\nY con estos números delante, el «funcionan» de hace dos secciones pide matiz. **Funcionan lo bastante como para que exista un mercado que los vende**, y lo bastante poco como para que nadie pueda prometerte nada: contra un programa se cuelan casi siempre, contra otro casi nunca, y no sabes con cuál te van a medir.\n\nY esto toca al capítulo anterior. El dato de que cerca del 35 % de los sitios web nuevos salieran de una máquina venía de clasificar una muestra con uno de estos detectores — el mismo que aquí queda en cuestión. Ese número sigue siendo lo mejor que hay, y arrastra los fallos de la herramienta que lo produjo, que pasa a formar parte del dato.\n\n---\n\n## 6 · Lo que se mira en su lugar: los olores de prosa\n\nSi los dos atajos están cerrados, queda la pregunta que abre el resto del curso: entonces qué se mira.\n\nLa respuesta viene prestada de un oficio vecino. A finales de los noventa, en el mundo del software, Kent Beck empezó a hablar de *code smells* —olores del código—. La idea la recogió y la catalogó Martin Fowler en un libro que sigue usándose. Un olor del código es una pista de que algo puede estar mal montado: una función demasiado larga, un nombre que no dice nada, dos trozos idénticos en sitios distintos.\n\nLo que hace que la idea sea buena es lo que no afirma. **Un olor no es un fallo.** El programa funciona igual. Nadie ha roto ninguna regla. Lo único que dice el olor es *«mira aquí, que a lo mejor hay algo»*. Quien mira decide.\n\nUn **olor de prosa** es exactamente eso trasladado a un texto. Frases todas de la misma longitud. Párrafos que abren igual varias veces seguidas. Un cierre que le explica al lector la moraleja de lo que acaba de leer. Ninguna de esas cosas es una falta: si le pasas el corrector, no sale nada. Y las tres son sitios donde parar a mirar.\n\nY la analogía se traslada por lo que tienen en común los dos oficios, que es lo incómodo. Antes de que un programa se ponga en marcha lo revisa un programa aparte, el compilador, que avisa de los errores que impiden que funcione. Un programa con olores **pasa esa revisión** y funciona; nadie se queja hasta que alguien tiene que tocarlo seis meses después. Un texto con olores se publica y se lee; nadie se queja tampoco, porque no hay nada que señalar. En los dos casos **la herramienta automática da el visto bueno** —el compilador allí, el corrector aquí— y el único que puede darse cuenta es quien escribió.\n\nDe ahí sale la parte que a mucha gente le sorprende de este curso. Al final del camino no hay ningún programa que te diga si lo has hecho bien: hay criterios y práctica.\n\n### Por qué un olor sirve donde un detector no llega\n\nLa diferencia con un detector se dice en una línea: **un olor te dice dónde mirar; un detector te da un veredicto.**\n\nComo te dice dónde mirar, sigues tú. Puedes abrir el texto, ver la frase concreta y decidir que ahí está bien. El detector no te deja hacer eso: te da un número y no te enseña de dónde sale.\n\nHay una segunda diferencia, menos evidente y más útil. Un olor es tuyo: lo miras en tu propio texto, antes de publicarlo, para escribir mejor. Un detector es un instrumento para juzgar el texto de otro. Este curso se dedica al primero de los dos trabajos y no al segundo.\n\n---\n\n## 7 · Señal para mirar, no falta que corregir\n\nDe ese «quien mira decide» sale la idea que gobierna el catálogo entero, y si se entiende mal el resto del curso se convierte en una lista de prohibiciones. Así que merece la pena verla funcionando.\n\nUn ejemplo de los que aparecen a diario: la frase corta y contundente al final de un párrafo. Repetida cinco veces en un post o en una propuesta es un olor claro, porque el texto entero empieza a sonar a consigna. Puesta una sola vez, en el momento en que hacía falta rematar, es de las mejores cosas que se pueden hacer con un párrafo.\n\n*(Este tiene módulo propio, el 2.3, donde se ve con sus ejemplos y sus dos caras. Aquí sirve para lo otro: para enseñar que un olor se cuenta, no se prohíbe.)*\n\n**El mismo recurso, y el veredicto opuesto, según cuántas veces aparezca y dónde.** Eso no se escribe como regla, y por eso lo que este curso da son criterios y no una lista de palabras prohibidas.\n\n### La prueba que separa una señal de una regla\n\nEs de una pregunta: **¿puedo decidir que aquí está bien?**\n\nSi la respuesta es sí, era una señal. Si es no —una falta de ortografía, una concordancia rota—, era una regla: esas ya las cubre el corrector.\n\n**También funciona al revés, y es la mitad que más se olvida: un texto puede no tener ni un olor y estar mal escrito.** Sin repeticiones, sin frases gemelas, sin moralejas de más, y sin nada que decir. El catálogo mira el oficio y no el fondo, así que mide dónde puede estar fallando la escritura y se calla sobre si había algo que contar. Si el texto aporta algo se comprueba con la prueba del 0.1: si lo que has escrito lo podría haber escrito cualquiera, el problema está en otro sitio.\n\nPor eso los siete módulos que vienen se leen de una manera concreta. Cada olor trae lo que lo delata, por qué aparece y qué hacer con él, y ninguno trae una orden. Lo que se aprende con ellos es a **notarlos leyendo**, que es lo que acaba pasando cuando has visto el mismo defecto quince veces en textos distintos.\n\nY de ahí sale la única obligación que impone este curso, que es leer lo que uno escribe con criterio propio. Un olor sin alguien que decida se convierte en la lista de palabras sospechosas con la que abría el 0.2 — la del rotulador amarillo, la que marcaba a quien escribía sencillo, y que es de donde este curso venía huyendo.\n\n---\n\n## 8 · Confusiones habituales\n\n**«Entonces los detectores no sirven para nada.»** Sirven para lo que miden, que es la previsibilidad de un texto. El error está en leer ese resultado como una prueba de autoría. Un número alto significa «este texto es de los previsibles», y eso lo cumplen una máquina, un manual de instrucciones y alguien que escribe claro en su segundo idioma.\n\n**«Si el estudio del 61,3 % es de 2023, estará desfasado.»** Los detectores concretos que se probaron, sí. **El mecanismo, no**: siguen midiendo previsibilidad, y mientras lo hagan seguirán castigando el vocabulario sencillo. Para que esto cambie hace falta que midan otra cosa, y no que midan mejor lo mismo.\n\n**«Yo no acuso a nadie, lo uso solo para orientarme.»** Es el uso menos malo y aun así tiene un coste que casi no se ve: la sospecha cambia cómo lees el resto del trabajo. Con un 87 % en la pantalla, todo lo que venga después se lee buscando confirmarlo.\n\n**«Todo esto va de inglés. En español será distinto.»** Los estudios de este capítulo están hechos en inglés, y es verdad que hay que decirlo. Pero el mecanismo no depende del idioma: mientras un programa mida cuánta sorpresa produce un texto, castigará al vocabulario más sencillo en la lengua que sea. Lo que sí falta son estudios equivalentes en español, y no haberlos no es lo mismo que haberlos y que salgan distinto.\n\n---\n\n## 9 · Preguntas frecuentes\n\n**¿De dónde sale el 61,3 %?** De un trabajo de Weixin Liang, Mert Yuksekgonul, Yining Mao, Eric Wu y James Zou, de la Universidad de Stanford, publicado en la revista *Patterns*, de Cell Press, en julio de 2023.\n\n**¿Y qué límites tiene ese estudio?** Tres, y van dichos porque quien los conozca los va a sacar. Son **noventa y un ensayos**, que es una muestra corta. Son de **una sola lengua materna**, así que «no nativos» ahí significa un grupo concreto y no todo el planeta. Y los siete detectores son **de 2023**: uno de ellos, el de OpenAI, ni siquiera sigue existiendo. Los propios autores piden que se repita con muestras mayores.\n\n**Si un texto mío da positivo, ¿qué hago?** Nada que tenga que ver con el detector. La pregunta útil no es cómo bajar ese número, es si el texto está bien escrito: si dice algo que solo puedas decir tú, si se entiende a la primera, si alguien querría seguir leyendo. Si la respuesta a las tres es sí, el número da igual.\n\n**¿Y si me lo exige el cliente o la institución?** Entonces es un problema distinto, y es de negociación, no de escritura. Lo que este capítulo te da para esa conversación son los cuatro números del apartado 2: el mismo ensayo, con lo mismo dentro, cambia de veredicto cuando le cambian el nivel del vocabulario. Con eso delante, poca gente sostiene que ese número sea una prueba.\n\n**¿Los olores de prosa no son otra lista de palabras prohibidas?** Es la confusión más fácil de tener, y la respuesta está en la prueba del apartado 7: si puedes decidir que en tu texto está bien, era una señal. Ninguna de las siete familias del catálogo se puede aplicar sin leer.\n\n---\n\n## Lo que te llevas y lo que viene\n\n**Hoy, con algo que hayas escrito tú:** coge el último texto que hayas publicado y busca **una** frase corta y contundente al final de un párrafo. Si hay una, mírala y decide si estaba ganada. Si hay cinco, ya sabes lo que ha pasado. No corrijas nada todavía — solo mira si sabrías defender cada una.\n\nEse gesto, hecho con criterio y sin corregir a lo loco, es el curso entero en pequeño.\n\n**Y con esto se acaba el marco.** Sabes por qué el valor se ha movido, dónde se reconoce lo genérico en un texto, por qué todos los textos automáticos acaban pareciéndose y por qué los dos atajos que prometen resolverlo no resuelven nada.\n\nLo que empieza en el 1.1 es el trabajo de verdad: **siete familias de olores**, una por módulo, cada una con lo que la delata, por qué aparece y qué hacer con ella. La primera va del ritmo —de lo que le pasa a un texto cuando todas sus frases miden lo mismo—, y es la que más se nota leyendo en alto.", "detectores": [{"codigo": "D11", "nombre": "calibre", "ficha": "08-reglas-del-vault/D11-calibre.md", "familia": {"slug": "08-reglas-del-vault", "nombre": "reglas del vault", "color": "#4a5a6a"}, "severidad": "info", "ocurrencias": [{"linea": 1, "regla": "calibre de la base — 4155 palabras (recuento informativo, sin objetivo configurado por curso)", "fragmento": "4155 palabras", "sin_marca": "documento"}], "total": 1}, {"codigo": "D13", "nombre": "tono", "ficha": "03-voz-prestada/D13-tono.md", "familia": {"slug": "03-voz-prestada", "nombre": "voz prestada", "color": "#6b4fa8"}, "severidad": "info", "ocurrencias": [{"linea": 1, "regla": "tono — 3.1 % de las frases en negativo (7 de 229); listón 4.0 % = p90 del corpus (mediana 1,5 %)", "fragmento": "un capítulo sobre límites o excepciones sube legítimamente; el veredicto lo pone quien lee", "sin_marca": "documento"}], "t nto, una pasada que se queda a medias, y de pronto está otra vez en primer plano.\n\nTu cabeza hace exactamente eso con la prosa. Un texto donde todas las frases miden lo mismo se convierte en ruido de fondo a los tres párrafos, y quien lee llega al final sin acordarse de nada. No porque el texto sea malo. Porque su cabeza dejó de registrarlo igual que dejó de oír el limpiaparabrisas.\n\nEste es el primer olor del catálogo, y viene con su hermano de al lado. Los dos van de lo mismo a dos escalas distintas.\n\n## Dónde estás\n\nDel módulo anterior sales con el vocabulario montado: un olor es una señal para ir a mirar; el texto compila; quien decide eres tú.\n\nAquí empieza el catálogo. Empieza por el ritmo porque es la familia que más se nota en voz alta y la que menos se ve leyendo por encima.\n\n- **De aquí sales sabiendo** reconocer dos defectos hermanos —uno en las frases, otro en los párrafos—, la regla que los gobierna a los dos, y cómo medirlos en un texto tuyo en diez minutos y sin saber estadística.\n- **En 1.2 y 1.3** vienen los otros cuatro olores de esta familia. Los dos primeros son de frases que se pasan o se quedan cortas; los dos últimos, de cómo empiezan.\n\n## Lo que vas a leer aquí\n\n1. Por qué tu cabeza deja de leer lo que se repite\n2. El metrónomo: todas las frases de la misma medida\n3. Cómo se mide, sin saber de números\n4. Párrafos de fotocopia: el mismo defecto a escala de página\n5. Asimetría deliberada, la regla que gobierna la familia entera\n6. Qué hacer el lunes con un texto tuyo\n7. Confusiones habituales\n8. Preguntas frecuentes\n\n---\n\n## 1 · Por qué tu cabeza deja de leer lo que se repite\n\nHay una cosa que hace tu cerebro todo el rato y de la que no te enteras: descartar lo que no cambia. El peso del reloj en la muñeca, el zumbido del aire acondicionado, la presión del asiento. Todo eso llega a tus sentidos y tu cabeza lo aparta porque no aporta información nueva.\n\nCon el texto pasa igual, y de ahí que el ritmo tenga tanto peso. Cuando una frase mide lo mismo que la anterior, y la siguiente también, y la siguiente, tu atención deja de tener a qué agarrarse. Sigues moviendo los ojos. Ya no estás leyendo.\n\nLo que rompe eso es el cambio de tamaño. Una frase larga que se enrosca y desarrolla, seguida de una corta que la remata. Un párrafo de siete líneas que abre un asunto complicado y luego uno de dos que lo cierra. Ese vaivén es lo que mantiene despierto a quien lee. Es también lo primero que desaparece cuando el texto lo produce algo que no tiene oído.\n\nY aquí está el porqué de fondo, el que explica por qué este olor aparece tanto. **Una persona varía la longitud de sus frases sin pensarlo, porque las ideas no le pesan igual.** La que necesita desarrollo pide sitio. El remate se resuelve en cuatro palabras. Nadie decide eso conscientemente: sale del oído, de haber leído mucho, de haber hablado en voz alta.\n\nUna máquina no tiene ese motivo. Produce la continuación más probable palabra a palabra, y la longitud media de una frase en español escrito es la que es. Sin nada que la empuje a salirse, se queda ahí. Eso pasa siempre que nadie tiene una razón para variar. Una máquina no la tiene.\n\nY hay una segunda mitad de ese porqué que se ve poco. Cuando una persona escribe no está solo eligiendo palabras: está administrando la atención de otra persona a lo largo de un rato. Sabe, aunque nunca lo formule, que quien lee se va a cansar, que hay un punto donde va a mirar el móvil, y que después de un tramo difícil hace falta una tregua. Esa gestión del cansancio ajeno es lo que produce las frases cortas donde tocan, y es también lo que hace que un buen texto acelere justo antes del final.\n\nUn modelo escribe frase a frase mirando lo que ya lleva escrito. No tiene a nadie delante a quien cuidar, ni idea de cuánto rato lleva esa persona leyendo. Así que cuando falta ritmo, lo que falta antes es el motivo que lo produce: alguien pendiente de si el de enfrente sigue ahí.\n\nDe ahí sale una consecuencia que a mí me costó ver, y que cambia cómo se corrige. El metrónomo no es un problema de frases malas. Todas pueden ser correctas, claras y bien puntuadas. **El defecto no está en ninguna frase: está en la relación entre ellas.** Por eso no lo caza un corrector, y por eso hay que mirarlo con otra herramienta.\n\n*(Esa es la única vez en todo el capítulo que voy a contraponer dos cosas así. Es un molde que gasta rápido, y lo verás en el módulo 6.)*\n\n---\n\n## 2 · El metrónomo: todas las frases de la misma medida\n\nAquí está el olor, con su nombre. **Metrónomo: las frases de un pasaje miden todas aproximadamente lo mismo.** Ni una corta que golpee, ni una larga que respire. Leído en alto suena a péndulo.\n\nUn ejemplo, escrito mal a propósito:\n\n<!-- lint-prosa: muestra -->\n> La reunión empezó a las nueve en punto. El equipo revisó los objetivos del trimestre. Cada responsable presentó sus cifras. La discusión duró algo más de una hora. Las decisiones quedaron recogidas en el acta. El acta se envió a todos los asistentes. Nadie planteó objeciones en las siguientes horas. El plan quedó aprobado por consenso general. La siguiente reunión se fijó para el martes. Los temas pendientes pasaron a esa convocatoria.\n<!-- lint-prosa: fin -->\n\nDiez frases, y ninguna baja de cinco palabras ni pasa de ocho. Todas con el mismo esqueleto: sujeto, verbo, complemento. Ninguna está mal escrita. Y a la cuarta ya no estás leyendo, estás pasando la vista.\n\nAhora el mismo contenido con oído:\n\n<!-- lint-prosa: muestra -->\n> La reunión empezó puntual, que ya es raro. Cada responsable llevaba sus cifras, y durante la primera hora aquello fue lo que suele ser: números, matices, alguien que pregunta por una columna que no cuadra. Se aprobó todo. Lo interesante llegó después, cuando el acta salió por correo y nadie contestó — ni para objetar ni para confirmar—, y el plan quedó aprobado por el silencio de doce personas que probablemente no lo habían leído.\n<!-- lint-prosa: fin -->\n\nCuatro frases en vez de diez. Cuéntalas y te salen ocho palabras, veintisiete, tres, y treinta y seis que se enroscan hasta el final. Dice lo mismo y además dice algo que la primera no decía.\n\nFíjate en «Se aprobó todo». Tres palabras solas entre dos frases largas. Eso es lo que un modelo no suele escribir: no tiene motivo para frenar ahí.\n\n### La variante que además se engancha\n\nHay una forma del metrónomo que se reconoce en cuanto se la nombra, y que sale sobre todo en textos largos escritos de un tirón. Cada frase arranca con la última palabra de la anterior:\n\n<!-- lint-prosa: muestra -->\n> El rumbo se corrige con dolor y coste. El coste lo paga siempre el equipo siguiente. El equipo siguiente hereda tus decisiones sin contexto. El contexto se pierde en cuanto cambia la gente.\n<!-- lint-prosa: fin -->\n\nLeído en alto suena a cadena de montaje. Y tiene un efecto secundario bastante peor que el ruido: como cada frase se agarra a la anterior, el texto avanza sin decidir nunca hacia dónde va. Va donde le lleve la última palabra que escribió.\n\nAhí tienes el ritmo plano y, encima, el encadenado. Ese segundo no tiene ficha propia en el catálogo: es la forma que toma este olor cuando se escribe de un tirón. Y es lo normal, porque los defectos de prosa vienen en grupo mucho más a menudo que solos. La buena noticia es que al corregir uno se cae el otro. Los dos salen de escribir sin levantar la vista de la frase que tienes delante.\n\n### Dónde aparece en tu trabajo\n\nEste olor no se reparte igual por todos los textos. Hay tres sitios donde suele estar.\n\n**Las descripciones de proceso.** «Primero se recoge el requisito. Después se valida con el cliente. Luego se traslada al equipo técnico.» Un proceso es una secuencia de pasos equivalentes, así que la tentación de darles a todos la misma forma es enorme. Y es justo donde peor sienta: el lector no sabe cuál de los siete pasos es el que se rompe siempre.\n\n**Las listas convertidas en prosa.** Alguien tenía una lista de viñetas, le dijeron que quedaba mejor en párrafo, y las viñetas se quedaron dentro con la misma longitud que tenían. Cambió la forma. Nadie tocó ni una frase.\n\n**Los resúmenes ejecutivos.** Por definición van comprimidos, y comprimir suele significar recortar todas las frases a la misma medida. Un resumen donde todo pesa igual es un resumen donde nada destaca.\n\nHay una excepción real, y te la digo antes de que la encuentres tú. **Un pasaje corto no tiene ritmo que juzgar.** Este olor necesita un tramo largo para significar algo, y en la primera de las preguntas del final te cuento por qué no hay un número redondo que darte. Cuando llegues al módulo 8 verás por qué eso es una regla y no una excusa.\n\n---\n\n## 3 · Cómo se mide, sin saber de números\n\nA estas alturas siempre aparece la misma objeción, y es razonable: *«vale, pero \"todas parecidas\" ¿cuánto es?»*.\n\nSe puede contar, y el instrumento ya lo tienes del capítulo `0.3`. Allí montamos la mancha de puntos: cien respuestas repartidas por un papel, cerca las parecidas y lejos las que no, y el tamaño de la mancha te decía cuánto se separaban unas de otras. **Es exactamente lo mismo, ahora con frases en vez de ideas.**\n\nCoge un texto tuyo. Cuenta las palabras de cada frase y apunta los números en una línea, como puntos sobre una regla. Si tus frases miden 8, 9, 8, 10, 9, 8, los puntos se apiñan: mancha pequeña, metrónomo. Si miden 4, 23, 11, 6, 31, 9, están repartidos por toda la regla: mancha grande, ritmo.\n\nEso es todo el concepto. No hace falta ninguna fórmula para verlo, y de hecho el dibujo enseña más que cualquier número, porque también te dice **dónde** están apiñados. A veces el texto entero respira y hay un tramo de dos páginas donde todos los puntos se juntan. Suele ser el tramo técnico.\n\n### El número, si lo quieres\n\nSi prefieres una cifra al dibujo, hay una cuenta corta que se hace con la calculadora del móvil. Primero, la media: sumas las longitudes y las divides entre el número de frases. Eso es lo que mide una frase tuya normalmente.\n\nDespués vas frase por frase y anotas **a qué distancia está de esa media**, siempre en positivo. Ojo con esto, que es donde se tuerce la cuenta: da igual que la frase se pase o se quede corta, lo que apuntas es la distancia, nunca la resta con su signo. Si apuntas unas en negativo y otras en positivo se anulan entre ellas, te sale cero, y cero te va a salir con cualquier texto del mundo.\n\nSaca el promedio de esas distancias y divídelo entre la media que calculaste al principio.\n\nEse cociente es un número pequeño, normalmente entre cero y uno. Cuanto más bajo, más apiñados están los puntos.\n\n**Ese número no significa nada hasta que sepas cuál es el tuyo**, y es lo que enseña este curso. Llamamos umbral a la raya a partir de la cual decides que un texto está demasiado apiñado. Un texto jurídico y una newsletter no tienen por qué tener la misma, y una traída de fuera te va a marcar de más o de menos.\n\nLo que sí sirve es calibrarlo contra tu propio material: sacarle el número a unos cuantos textos tuyos que sepas que están bien escritos, y ver por dónde te salen. Ese es el principio entero, y es media tarde de trabajo. El módulo 8 lo hace paso a paso, y ahí verás cuántos textos hacen falta de verdad, cómo se eligen sin engañarte a ti mismo, y qué hacer cuando los números no separan nada. Cada uno de esos tres pasos tiene su trampa, y equivocarse en cualquiera de ellos te deja con una vara que no mide.\n\n### La medida que probé y tuve que tirar\n\nAntes de que montes la tuya, te cuento un camino sin salida que recorrí entero, porque el error que tiene debajo lo vas a poder cometer con cualquier medida que te inventes.\n\nEl promedio de un texto completo tiene un agujero que se ve enseguida: puedes tener un artículo con buen ritmo de principio a fin y ocho frases clavadas en mitad de la sección técnica. El número global sale bien, y quien lee se cae justo ahí. Así que lo lógico es medir por tramos. Coges seis frases seguidas, les sacas el número, avanzas una frase y lo vuelves a sacar, y así hasta el final. Donde el número baje, ahí está el tramo plano.\n\nLo monté. Y marcaba todos los textos que le echaba, sin una sola excepción, incluidos los que yo sabía perfectamente que estaban bien escritos.\n\nEl motivo tardé en verlo y es pura aritmética. En un texto de doscientas frases hay casi doscientos tramos de seis, y entre doscientos tramos siempre existe alguno donde las seis midan parecido. Por azar, sin que eso diga nada del texto. No estaba midiendo el ritmo: estaba midiendo cuántas oportunidades le daba de fallar.\n\nGuárdate esto, que se te va a repetir en cualquier medición que montes: **cuantas más ventanas mires, más seguro es que alguna dé positivo.** Si una comprobación tuya señala absolutamente todo lo que le pasas, la comprobación está rota aunque el concepto que hay debajo sea bueno. Aquí el concepto lo era, y me sigue rondando; lo que no encontré fue la forma de contarlo sin que el azar decidiera por mí.\n\nDe momento basta con esto: **el número existe, se saca en diez minutos, y el tuyo no tiene por qué parecerse al de nadie.**\n\n---\n\n## 4 · Párrafos de fotocopia: el mismo defecto a escala de página\n\nSube un nivel y vuelve a mirar. En vez de las frases dentro del párrafo, ahora miras los párrafos dentro de la página.\n\n**Párrafos de fotocopia: todos los bloques ocupan lo mismo en pantalla.** Cuatro o cinco líneas, uno detrás de otro, como ladrillos en una pared.\n\nLa forma de verlo es distinta de la anterior, y más rápida. Entorna los ojos y mira la página sin leerla, como si fuera un dibujo. Una página escrita por alguien que piensa mientras escribe tiene bloques desiguales: uno gordo, dos finos, uno de una sola línea. Una página de fotocopia es una cuadrícula.\n\nPrueba a hacerlo ahora mismo con este capítulo. Verás que no es uniforme. Está hecho a propósito.\n\n### Las dos causas, y una es mecánica\n\nEn las frases, el metrónomo salía de no tener oído. En los párrafos hay además una causa mecánica. Es de las que dan rabia cuando las descubres.\n\nMuchas herramientas de escritura, plantillas y guías de estilo internas recomiendan «párrafos de tres a cinco líneas» como norma de legibilidad. La intención es buena y el origen también: un muro de texto de veinte líneas espanta. Pero convertir eso en regla fija produce exactamente el defecto que este capítulo describe. **La legibilidad sale de darle a cada idea el tamaño que pide**, y eso rara vez coincide con darles a todas el mismo.\n\nHay un segundo motivo, más humano. Cuando escribes con prisa y sin releer el conjunto, cada párrafo lo escribes mirando solo ese párrafo. Le das la extensión que te sale por defecto, que es siempre parecida, y nunca pones ese párrafo al lado de sus vecinos. El defecto solo existe en la relación, así que trabajando párrafo a párrafo es literalmente invisible.\n\nEso conecta con algo que ya sabes del `0.3`: hay problemas que no se ven desde dentro. Allí era un problema de grupo que ninguno de sus miembros podía detectar. Aquí es un problema de página que no se ve mirando un párrafo.\n\n### Qué cuenta como párrafo, y por qué eso decide el resultado\n\nSi te pones a contar bloques hay una decisión previa que parece administrativa y que manda sobre todo lo demás: qué es un párrafo y qué no.\n\nUna tabla ocupa sitio en la página y no es prosa. Una lista de viñetas tampoco, porque son líneas que el ojo recorre de otra manera. Y lo mismo con lo que pegas de fuera: una captura de pantalla, una cita larga, el recorte de una tabla de precios. Ocupan media página sin que los haya escrito tu oído.\n\nEsto me costó meses de medir mal, y el fallo era exactamente ese. El contador que usaba metía los bloques de código en el recuento como si fueran párrafos más. Un bloque de código es largo y tiene una forma que no se parece en nada a la de un párrafo, así que al entrar en la cuenta disparaba la variedad y el resultado salía sano — con la prosa de alrededor perfectamente cuadriculada debajo. El código estaba tapando el defecto.\n\nMe venía marcando un puñado de textos al mes, y yo lo daba por normal. El día que saqué el código, esa lista se dobló largo. Y la segunda parte de la historia enseña más que la primera: no todos eran defectos. Al quitar el código, la medida entera cambió de escala, y la raya que yo tenía puesta se quedó en un sitio que ya no significaba lo mismo. Hubo que rehacerla.\n\nAsí que cuando montes tu comprobación, decide primero qué estás contando, y sé estricto: prosa, y solo la que escribiste tú con el oído puesto. Las tablas, las viñetas, las citas y las capturas se quedan fuera, y lo mismo el código si escribes documentación técnica. Todos tienen un ritmo propio que no es el tuyo y te van a maquillar el resultado. Y si algún día cambias esa decisión, tu listón deja de valer: hay que volver a medirlo.\n\n### La forma que más se repite\n\nUn texto de veinte párrafos donde cada uno desarrolla un punto de una lista mental:\n\n<!-- lint-prosa: muestra -->\n> El de la introducción, cinco líneas. El del primer argumento, cinco líneas. El del segundo, cinco. El del contraejemplo, cinco. El del cierre, cinco.\n<!-- lint-prosa: fin -->\n\nLee esa lista otra vez y date cuenta de lo que implica: **el contraejemplo ocupa lo mismo que la introducción.** Un contraejemplo suele necesitar más sitio, porque hay que montarlo y desmontarlo. Si ocupa lo mismo, o se ha quedado corto o la introducción se ha estirado.\n\nAhí está la señal útil de este olor. La uniformidad de los bloques delata que **el reparto de espacio no lo decidió el contenido**. Alguien —o algo— le dio a cada idea la misma cantidad de sitio sin preguntarse cuánta necesitaba.\n\n### Un caso, para que se vea de qué tamaño es el problema\n\nUna escena de las que se repiten. Alguien de marketing prepara la ficha de un producto nuevo y tiene delante las fichas de los seis productos anteriores, que dejó hechas otra persona hace un año. Las abre para copiar el formato, porque para eso están.\n\nLas seis tienen la misma forma: párrafo de presentación, párrafo de características, párrafo de casos, párrafo de precio. Cuatro bloques del mismo tamaño, seis veces.\n\nEl producto nuevo tiene un problema: su gracia está en una sola cosa, y es una cosa que hay que explicar despacio porque nadie la ha visto antes. En un reparto libre, ese punto se llevaría media página y el resto iría comprimido.\n\nEn el molde heredado se lleva un párrafo de cuatro líneas, igual que el precio.\n\nNadie ha hecho nada mal. La plantilla existía por buenos motivos, se usó como se usa una plantilla, y el resultado es una ficha correcta donde lo único interesante del producto pasa desapercibido. **Ese es el daño real de este olor**, y por eso no es cosmético: el reparto de espacio es una forma de decirle al lector qué importa, y una cuadrícula le dice que no importa nada en particular.\n\nSi tú preparas materiales de formación, tienes la versión de tu oficio. Seis capítulos con la misma estructura y el mismo peso, cuando sabes perfectamente que el tercero es el que se atraganta siempre y el quinto se entiende solo.\n\nY si tú publicas en redes, la tuya es la plantilla de la que no te bajas: gancho, tres puntos, pregunta final. Semana tras semana, el mismo reparto para una idea que un día da para media línea y otro día pedía el post entero.\n\n### Frases largas y párrafos largos no son lo mismo\n\nSe confunden a menudo, y te interesa separar la frase larga del párrafo largo: el arreglo de la una no sirve para el otro.\n\nUn párrafo puede ser largo y tener buen ritmo por dentro: siete líneas con frases de cuatro, veinte, ocho y treinta palabras. Y un párrafo puede ser corto y ser un metrónomo en miniatura, con sus tres frases idénticas.\n\nY a la inversa: frases bien, página mal. Un texto puede tener las frases muy variadas y aun así ser una cuadrícula de bloques, porque el autor cortaba por longitud sin mirar dónde acababa la idea.\n\nSon dos escalas y se miden por separado. La regla que viene ahora gobierna las dos. Y es una sola.\n\n---\n\n## 5 · Asimetría deliberada, la regla que gobierna la familia entera\n\nLos dos olores de este capítulo son la misma cosa a dos escalas, y los cuatro que vienen en `1.2` y `1.3` también salen de aquí. Debajo hay una sola regla. Tenla clara antes de seguir, porque a partir de ahora se nombra y no se vuelve a explicar.\n\n**La asimetría deliberada: en un texto humano, el tamaño de cada frase y de cada párrafo lo decide el trabajo que tienen que hacer.**\n\nVuelve un momento a «Se aprobó todo», la frase de tres palabras del acta. Ahí tienes la regla entera en miniatura. Mide tres palabras porque su trabajo era frenar en seco entre dos frases largas, y para eso no hacen falta más. Con once palabras bien puestas diría lo mismo y no frenaría nada.\n\nLo que la regla mira es el origen del tamaño. Por eso no hay ningún consejo del tipo «escribe frases de menos de veinte palabras»: lo que importa es que la de treinta esté ahí porque hacía falta, y la de cuatro también.\n\nY de ahí sale la pregunta que resuelve los casos dudosos. Cuando mires una frase larga o un párrafo gordo y no sepas si sobra, no te preguntes si es largo. Pregúntate: **¿es largo porque tenía que serlo?** Si la respuesta es que sí, se queda aunque el contador se queje. Si la respuesta es que salió así, ahí tienes trabajo.\n\nLa palabra que más pesa en esa regla es «deliberada». Un texto puede tener variedad de longitudes por accidente —por ejemplo, porque se ha escrito a trozos en momentos distintos— y seguir sin funcionar, porque la variedad no está donde hace falta. La corta tiene que caer donde el texto cierra una idea.\n\nEsto se nota especialmente cuando alguien intenta arreglar un metrónomo a mano y sin criterio. Parte algunas frases al azar, junta otras dos, y el contador mejora. El texto no. Has fabricado variedad sin fabricar sentido. El lector lo nota aunque no sepa nombrarlo.\n\n---\n\n## 6 · Qué hacer el lunes con un texto tuyo\n\nTres cosas, en orden de lo que más rinde a lo que menos.\n\n**Léelo en alto.** Es gratis, tarda lo que tarde el texto, y caza el metrónomo mejor que cualquier medición. Tu voz no puede mantener una cadencia uniforme sin que te des cuenta: a la quinta frase igual te oyes a ti mismo haciendo de metrónomo. Si tienes que leerlo delante de alguien, mejor todavía.\n\n**Entorna los ojos y mira la página**, como hiciste en la sección 4. Cinco segundos y sin leer: es lo más barato de esta lista, y lo único que se hace sin entender una sola palabra.\n\n**Y si quieres el número, cuéntalo a mano una vez.** Coge diez frases seguidas de un texto tuyo, cuenta las palabras de cada una y escribe los diez números en fila. Míralos. Con diez frases no estás diagnosticando nada, y eso ya lo sabes: en una muestra corta el parecido puede ser casualidad. No es para eso. Es para que te entre por los ojos qué aspecto tiene tu propio reparto, y ese calibre te lo llevas puesto al resto de tus textos sin volver a contar nada.\n\nSobre corregir, un aviso que ahorra tiempo. **No arregles el ritmo primero.** Si el texto tiene además problemas de fondo —le falta algo que decir, o el argumento no se sostiene—, arreglar el ritmo es maquillar. El ritmo se toca en la última pasada, cuando el contenido ya está decidido, porque es lo único que se puede ajustar sin tocar lo que el texto dice.\n\nY cuando lo toques, empieza por meter **una** frase corta en el sitio donde el pasaje remata. Una sola. Es asombroso lo que cambia un tramo de diez frases parejas cuando la séptima mide cuatro palabras.\n\nPara los párrafos el gesto es otro, y también se resuelve con una sola pregunta. Cuando veas tres bloques seguidos que ocupan lo mismo, no te preguntes cuál partir. Pregúntate **cuál de los tres se estiró para cuadrar**: suele haber uno. Es el que tenía poco que decir y al que le añadiste una frase de más para que no quedara raro al lado de sus vecinos. Quitarle esa frase arregla dos cosas de golpe, porque el bloque recupera su tamaño real y de paso el texto pierde peso muerto.\n\nY al revés. Cuando des con el bloque que se quedó corto teniendo mucho que contar, no lo hinches. Míralo despacio: lo que suele pasar ahí es que había dos ideas dentro y solo escribiste una.\n\n---\n\n## 7 · Confusiones habituales\n\n**«Entonces hay que escribir frases cortas.»** El consejo popular de las frases cortas produce su propio defecto, que tiene ficha en `1.2` y se llama la ametralladora. Un texto de puras frases cortas es tan metrónomo como uno de puras frases largas: lo que falta en los dos es el cambio. La medida que importa aquí es la variedad, y la brevedad solo entra en ella como uno de los tamaños posibles.\n\n**«Mi texto es técnico, ahí no se puede variar.»** Sí se puede, y de hecho es donde más falta hace. Un manual con todas las frases iguales es un manual que nadie termina de leer. Lo que sí cambia en un texto técnico es dónde pones las cortas: normalmente en las advertencias y en los avisos de consecuencia, que es justo donde quieres que el lector frene.\n\n**«En redes todo son párrafos de una línea. ¿Entonces todo lo que publico es una fotocopia?»** No. Cuando el medio te fija el bloque —y las redes te lo fijan, porque un párrafo de ocho líneas en el móvil no lo lee nadie—, la cadencia de bloques deja de ser una decisión tuya, y por eso deja de decir nada de ti. Lo que sigue siendo tuyo son las frases de dentro. Ahí sí puedes tener metrónomo, y ahí se nota más que en ningún sitio: en un texto de doce frases, que la novena mida tres palabras cambia la publicación entera. Lo que sí te delata en redes es la otra mitad de este capítulo, el molde que repites semana tras semana. Mismo gancho, mismos tres puntos, misma pregunta final. Esa cadencia no te la impone el medio: la pones tú.\n\n**«Esto lo arreglo pidiéndole al modelo que varíe la longitud.»** A medias. Te explico por qué. Se lo puedes pedir y va a variar las longitudes, pero las va a variar **a ciegas**, porque no sabe qué idea de las tuyas pesa más. Sale un texto con puntos repartidos y con las cortas en sitios que no rematan nada. El contador mejora y el oído sigue notándolo. Volvemos a lo de siempre: la variedad tiene que ser deliberada. La decisión es tuya.\n\n**«Yo escribo todo a mano, a mí esto no me pasa.»** El metrónomo es muy anterior a las máquinas y no tiene nada de exclusivo suyo. Lo produce cualquier cosa que te apague el oído mientras escribes: la prisa, escribir sobre algo que dominas tanto que sale solo, rellenar una plantilla heredada, o llevar cuatro horas seguidas delante del mismo texto. Con una máquina pasa mucho más a menudo. A ti te pasa en los tramos donde ibas en piloto automático, y por eso la prueba de la sección 6 te dice además **dónde** los tenías.\n\n**«Si nadie lo nota, ¿qué más da?»** Se nota, solo que no se sabe nombrar. Lo que llega al lector no es «este texto tiene un cociente bajo»: es que ha llegado al final sin quedarse con nada, o que lo ha dejado a la mitad sin saber por qué. El síntoma que oyes de la gente es «me costaba seguir» o «se me hacía largo», y muy a menudo debajo está esto.\n\n---\n\n## 8 · Preguntas frecuentes\n\n**¿Cuántas frases hacen falta para que esto se pueda juzgar?** Bastantes más de las que hacen falta para que uno se lo crea. Con cinco o seis frases, que midan parecido no significa nada: puede ser casualidad. El ritmo es una propiedad de un tramo largo, y por eso las herramientas que miden esto se callan cuando la muestra es corta. Si alguien te dice que tu párrafo de cuatro frases tiene metrónomo, esa persona está midiendo mal.\n\n**¿Vale esto para textos en otros idiomas?** La mecánica sí; los números no. La longitud media de frase cambia bastante entre idiomas, y un umbral calibrado sobre textos en español no dice nada sobre uno en inglés. Es el mismo principio de la sección 3: el umbral se mide sobre el material propio, y «propio» incluye el idioma 0": 8.4, "min": 0.0, "max": 11.2, "piezas": 45}, "instruccion": {"mediana": 0.4, "p10": 0.0, "p90": 2.4, "min": 0.0, "max": 5.1, "piezas": 45}, "remate": {"mediana": 8.7, "p10": 5.6, "p90": 12.6, "min": 3.4, "max": 13.6, "piezas": 45}, "transicion": {"mediana": 1.0, "p10": 0.0, "p90": 2.3, "min": 0.0, "max": 3.2, "piezas": 45}}}, "marcas_degradadas": {"documento": 2}, "avisos": [{"detector": "muestra", "regla": "12 lineas marcadas como muestra y excluidas del analisis. Son prosa citada, no escrita — compruebalo si no lo son.", "contexto": "<!-- lint-prosa: muestra -->"}]}}, {"nombre": "HUMWRI-0.1-el-valor-se-desplaza-generada.json", "datos": {"version_informe": "1.0", "version_ruleset": "120f14e31a9d96a7", "version_productor": "ca8290be11d7", "generado": "2026-09-04T00:40:35", "pieza": {"fichero": "HUMWRI-0.1-el-valor-se-desplaza.md", "ruta": "Desarrollos\\HUMWRI - Escritura humana en la era de la IA\\temario\\HUMWRI-0.1-el-valor-se-desplaza.md", "tipo": "base", "curso": "HUMWRI - Escritura humana en la era de la IA", "codigo_curso": "HUMWRI", "submodulo": "0.1", "etiqueta": "generada"}, "resumen": {"puntuacion": 84, "banda": "Listo para publicar", "banda_tono": "ok", "palabras": 3956, "frases": 214, "lineas_de_muestra": 1, "smells": 15, "por_severidad": {"rojo": 0, "ambar": 11, "info": 4}}, "texto": "# 0.1 · El valor se desplaza: qué abarata la IA y qué no\n\n## Con qué idea llegas\n\nA un curso sobre escribir en la era de la IA se llega con una pregunta en la\ncabeza. Rara vez se formula en voz alta, pero está: **¿esto me va a dejar sin\ntrabajo?**\n\nY con una de dos respuestas ya en la cabeza.\n\nEstán los que han probado la herramienta, han visto salir un texto correcto en\nnueve segundos y han hecho la cuenta. Si escribe eso solo, lo que yo hago vale\nmenos. Esa gente llega con prisa y con un punto de rabia.\n\nY están los que la probaron, leyeron lo que salía y decidieron que no era para\ntanto. Suena a folleto, se nota a un kilómetro, y además se inventa cosas. Esos\nllegan tranquilos, y es la tranquilidad la que preocupa.\n\nLas dos posturas miran el mismo texto y ven cosas distintas, porque las dos están\nmirando **la calidad de lo que sale**. Y esa no es la pregunta que decide nada.\n\nLa pregunta que decide es otra: **qué parte de tu trabajo se ha vuelto barata, y\nqué parte no.** Porque el valor no desaparece cuando algo se abarata; se mueve.\nEste capítulo va de a dónde se ha movido, con los números encima de la mesa.\n\n## Lo mismo ya pasó con la fotografía de estudio\n\nAntes de los números, una escena que ordena todo lo que viene.\n\nHasta finales de los noventa, para tener una foto decente de un producto hacía\nfalta alguien con un estudio. Iluminación, película, revelado, y el oficio de\nsaber dónde poner los focos. Ese oficio se pagaba, y se pagaba bien, porque el\ncuello de botella estaba ahí: **conseguir una imagen técnicamente correcta era\ndifícil.**\n\nLlegó lo digital y ese cuello de botella desapareció. Hoy cualquiera saca una foto\nnítida, bien expuesta y enfocada con el teléfono que lleva en el bolsillo.\n\nLo que no ocurrió es lo que todo el mundo predijo. Los fotógrafos no\ndesaparecieron: cambió por qué se les paga. Ya no por conseguir la imagen\ncorrecta, que ahora es gratis, sino por saber **qué merece la pena fotografiar**,\ndesde dónde, y con qué intención. El oficio se movió de la ejecución a la\ndecisión.\n\nY con la escritura está pasando exactamente lo mismo, con una diferencia\nincómoda: **el texto correcto se parece mucho más al texto bueno que una foto\ncorrecta a una buena foto.** En una imagen mal compuesta la diferencia se ve al\ninstante. En un texto plano pero impecable, no — y por eso se cuela en sitios\ndonde la foto no se habría colado nunca.\n\nEse parecido engañoso es la razón de ser de este curso.\n\n## Dónde estás\n\nEstás en el primer capítulo del curso, y este módulo es el marco: por qué el texto\nque produce una máquina sale correcto y plano al mismo tiempo, y qué se puede\nhacer al respecto.\n\n- **De aquí sales sabiendo** qué se ha abaratado de verdad, qué no, y por qué eso\n  cambia dónde está tu valor.\n- **En 0.2** verás qué delata a un texto escrito en automático — y la respuesta\n  sorprende, porque no está en las palabras.\n- **En 0.3**, por qué todos esos textos se parecen entre sí.\n- **En 0.4**, por qué los atajos para disimularlo no funcionan.\n\nA partir del módulo 1 empieza el catálogo: cuarenta patrones concretos, con sus\nejemplos, y cómo se corrige cada uno.\n\n## Lo que vas a leer aquí\n\n0. Lo mismo ya pasó con la fotografía de estudio\n1. Lo que la máquina *puede* hacer y lo que *hace*, que no es lo mismo\n2. Escribir es justo lo que más ha subido\n3. Delegar o trabajar con ella: el dato que se dio la vuelta\n4. Lo que queda cuando quitas lo que la máquina hace\n5. Por qué todo esto sube el precio de tener voz\n6. Confusiones habituales\n7. Preguntas frecuentes\n\n---\n\n## 1 · Lo que puede hacer y lo que hace\n\nHay una distancia entre lo que una tecnología es capaz de hacer y lo que\nrealmente está haciendo. Buena parte del ruido de los últimos años cabe ahí\ndentro.\n\nAnthropic publica desde hace tiempo un informe sobre el uso real de su modelo en\nel trabajo. Cruzan dos cosas: por un lado, qué tareas de cada ocupación son\n**teóricamente** abordables con un modelo de lenguaje; por otro, en cuáles se está\nusando **de verdad**, mirando las conversaciones reales.\n\nEn las ocupaciones de informática y matemáticas, el resultado es este:\n\n| | |\n|---|---|\n| tareas teóricamente abordables | **94 %** |\n| tareas donde se observa uso real | **33 %** |\n\nSesenta y un puntos de diferencia. En una de las profesiones que más y antes ha\nadoptado estas herramientas.\n\nY el patrón se repite en el conjunto: el **97 %** de las tareas observadas a lo\nlargo de los informes anteriores cae en categorías clasificadas como\nteóricamente factibles. La capacidad está. El uso, muy por detrás.\n\n### Por qué esa distancia importa para ti\n\nPorque la conversación pública ocurre en la columna de la izquierda y tu trabajo\nocurre en la de la derecha.\n\nCuando alguien dice «la IA ya escribe artículos», está describiendo la capacidad.\nCuando tú abres el documento el lunes por la mañana, estás en el uso real: qué\ntareas concretas has pasado a la herramienta, cuáles has probado y has vuelto a\nhacer a mano, y cuáles ni se te ha ocurrido intentar.\n\nHay un matiz honesto que el propio informe se encarga de señalar, y merece la pena\ndecirlo aquí porque cambia cómo se leen todos estos números. Las tasas de éxito\nobservadas están **contaminadas por el criterio humano**: la gente elige qué\ntareas lleva a la herramienta. Si esperas que algo falle, no lo intentas. Así que\nel éxito que se mide es el éxito de las tareas que alguien pensó que iban a\nfuncionar, no el de todas las tareas posibles.\n\nDicho de otro modo: una parte de esa capacidad aparente es en realidad **buen ojo\nde quien la usa**. Y ese ojo es tuyo, no suyo.\n\n---\n\n## 2 · Escribir es justo lo que más ha subido\n\nAquí es donde esto deja de ser una conversación general sobre tecnología y pasa a\nser una conversación sobre tu mesa.\n\nEntre agosto y noviembre de 2025, la proporción de uso dedicada a tareas de\nescritura **subió**, y el repunte se concentra en dos cosas muy concretas:\n**copyedición** —revisar y pulir un texto que ya existe— y la escritura y el\nrefinado de textos de ficción.\n\nEse dato tiene dos lecturas y las dos importan.\n\nLa primera es la incómoda: **la fase de pulido es la que más se está delegando.**\nSi tu trabajo incluye recibir un borrador y dejarlo presentable, esa parte tiene\ncompetencia nueva.\n\nLa segunda apenas se cuenta: **subió después de haber estado bajando.**\nEl informe lo dice expresamente — el repunte de escritura y diseño revirtió una\ncaída sostenida en los informes anteriores. No es una línea que sube sin parar\ndesde 2022; es un dato que se movió, y que se puede volver a mover.\n\n### El uso se está ensanchando, no concentrando\n\nAntes de ir al dato más reciente, uno intermedio que desmonta una intuición muy\nextendida.\n\nEl informe de marzo de 2026 mide un trimestre distinto y encuentra dos cosas. La\nprimera es previsible: **el 36 % del uso es programación**, que sigue siendo con\ndiferencia la actividad dominante. La segunda no lo es tanto. Las tareas\neducativas subieron del **9,3 % al 12,4 %** y las científicas del **6,3 % al\n7,2 %**, y las diez tareas más frecuentes pasaron a ocupar **una porción menor**\ndel total que tres meses antes.\n\nTraducido: la gente está llevando a estas herramientas **cosas más variadas**, no\nmás de lo mismo. El uso se ensancha.\n\nEso importa para quien escribe por un motivo concreto. Cuando una herramienta se\nusa para pocas cosas, sus defectos son fáciles de acotar: sabes dónde falla porque\nsolo hace tres tareas. Cuando se ensancha, sus defectos **se reparten por sitios\ndonde nadie los está mirando** — un correo interno, un material de formación, la\ndescripción de un producto. Y ahí es donde llegan sin revisar.\n\n### El dato más reciente, y por qué es el que hay que mirar\n\nEl informe de junio de 2026 —con datos de abril a junio— mide una cosa distinta y\nmás útil para nosotros: **qué produce la herramienta**, no en qué ocupación se usa.\n\n| Lo que sale | Proporción de las conversaciones |\n|---|---|\n| explicaciones | **17 %** |\n| documentos e informes | **15 %** |\n\nUno de cada seis usos termina en un documento. Es la segunda categoría de todo lo\nque produce.\n\nEse mismo informe trae un segundo hallazgo que reaparece en todo el curso: **la salida está sistemáticamente por encima de\nla entrada en nivel de comprensión**. Categoría tras categoría, lo que devuelve la\nherramienta exige alrededor de **un año más de educación** para entenderse que lo\nque pidió la persona. Donde más se separa es en lo visual: **2,6 años** en la\ncreación de gráficos y **1,9** en diseño de juegos.\n\nPiénsalo un segundo, porque es contraintuitivo. Le pides algo con tus palabras, y\nte devuelve algo escrito por encima del nivel con el que se lo pediste. La\nherramienta **sube el registro por defecto**.\n\nEse reflejo es el origen de media docena de los defectos que catalogaremos en los\nmódulos 1 a 7. Cuando en el módulo 3 veamos el verbo enterrado —<!--m-->«realizar\nuna configuración»<!--/m--> en lugar de «configurar»—, estaremos viendo este mismo\nreflejo con otra ropa.\n\n---\n\n## 3 · Delegar o trabajar con ella\n\nCuando alguien usa una de estas herramientas, hace una de dos cosas.\n\nO **delega**: le encarga la tarea entera y se queda con lo que salga. O\n**colabora**: va y viene, corrige, pide otra versión, aprende algo por el camino y\ndecide él. El informe llama a lo primero uso *automatizado* y a lo segundo uso\n*aumentado*, y los mide por separado.\n\nDurante 2025 la delegación fue ganando terreno. Las conversaciones donde alguien\nda una orden y recoge el resultado sin más pasaron del 27 % en enero al 39 % en\nagosto. La lectura de entonces era la que uno esperaría: la gente confía cada vez\nmás, así que delega cada vez más.\n\nY en noviembre de 2025 el dato se dio la vuelta.\n\n| | |\n|---|---|\n| uso colaborativo | **52 %** *(sube 5 puntos)* |\n| uso delegado | **45 %** *(baja 4 puntos)* |\n| órdenes de delegación total | **32 %** *(bajaban desde el 39 %)* |\n\n*(Datos de noviembre de 2025, publicados en el informe de enero de 2026. Los cito\ncon su fecha porque son la foto de un momento, no el estado permanente de nada.)*\n\nLa colaboración volvió a ser más frecuente que la delegación. Y el informe apunta\nuna explicación tentativa, en sus propias palabras cautelosas: los cambios de\nproducto de ese periodo —la posibilidad de crear ficheros, la memoria entre\nconversaciones, las herramientas de personalización— **pudieron** haber empujado el\nuso hacia lo colaborativo.\n\n### Lo que eso significa para quien escribe\n\nQue la forma de uso que está creciendo es precisamente **la que te necesita\ndelante**.\n\nDelegar es fácil de imaginar y fácil de temer: la herramienta hace, tú recoges.\nColaborar es otra cosa. Colaborar es saber qué pedir, reconocer cuándo lo que ha\nsalido no sirve, y saber por qué no sirve. Eso último es exactamente lo que enseña\neste curso.\n\nY aquí conviene un aviso de honestidad. Esto no es una buena noticia envuelta para\ntranquilizarte. Es un dato de un trimestre concreto que puede volver a moverse, y\nque ya se movió una vez en la dirección contraria. Lo que sí sostiene es una\nlección más estable: **la delegación y la colaboración no son grados de lo mismo.\nSon dos usos distintos, y solo uno de los dos te deja aprender algo.**\n\n---\n\n## 4 · Lo que queda cuando quitas lo que la máquina hace\n\nEste es el apartado que contesta la pregunta con la que llegabas, y la respuesta\nno es una: son dos, y opuestas.\n\nEl informe hace un ejercicio interesante. Toma las tareas que la herramienta cubre\nhoy en cada ocupación, las quita, y mira **qué queda**.\n\nEl promedio dice algo incómodo. Las tareas que la herramienta cubre requieren, de\nmedia, **14,4 años de educación**; las tareas de la economía en su conjunto,\n**13,2**. La máquina se está llevando la parte de arriba. Así que el efecto de\nprimer orden, en el grueso de las ocupaciones, es una **descualificación**: si le\nquitas a alguien las tareas que la herramienta hace, le queda lo menos exigente.\n\nPero el promedio esconde justo lo que hay que ver, y el informe lo enseña con dos\noficios concretos.\n\n**Al agente de viajes** le quitas la planificación compleja de un itinerario. Le\nqueda emitir billetes y cobrar. Sale perdiendo: se ha llevado lo difícil.\n\n**Al gestor de fincas** le quitas la contabilidad y el papeleo. Le quedan las\nnegociaciones de contratos y el trato con propietarios e inquilinos. Sale ganando:\nse ha llevado lo tedioso.\n\nMismo movimiento, resultados opuestos. Y la diferencia no está en la ocupación:\nestá en **dónde tenía cada uno su parte difícil**.\n\n### Cómo se aplica esto a tu caso\n\nLa pregunta útil no es «¿me va a sustituir?». Es esta:\n\n> **De lo que yo hago, ¿qué parte era genérica y qué parte solo la puedo poner\n> yo?**\n\nSi en tu trabajo la parte difícil era producir el borrador —redactar un texto\ncorrecto sobre un tema conocido—, tienes competencia, y es barata.\n\nSi la parte difícil era otra cosa —saber qué merece la pena contar, tener criterio\nsobre lo que has visto funcionar, ponerle a un tema una perspectiva que no tiene\nnadie más—, entonces lo que se ha abaratado es la parte que te estorbaba.\n\nConviene decirlo sin adornos, porque un curso que solo tranquiliza no sirve de\nnada: **para mucha gente la respuesta honesta es «un poco de las dos»**. Hay\npartes de tu trabajo que valían dinero y ya no lo valen. Y hay otras que acaban de\nsubir de precio, precisamente porque el resto se ha vuelto abundante.\n\n### El error que se comete al hacer este reparto\n\nCuando alguien se sienta a repartir su trabajo entre «genérico» y «solo mío», casi\nsiempre se equivoca en la misma dirección: **mete en la columna de lo propio cosas\nque en realidad son genéricas, y las mete de buena fe.**\n\nPasa así. Uno mira un párrafo suyo, reconoce su forma de escribir, y concluye que\neso solo lo podía escribir él. Pero reconocer tu estilo y aportar algo son cosas\ndistintas. Un párrafo puede sonar a ti de arriba abajo y no contener ni un dato,\nni una decisión, ni una postura que no estuviera ya en la documentación del tema.\n\nLa prueba que separa una cosa de otra es incómoda y rápida: **quita tu nombre del\ntexto y pregúntate si alguien podría notar que falta**. Si lo único que se pierde\nes el tono, era genérico con tu voz encima.\n\nY al revés, el error simétrico: hay quien mete en la columna de lo genérico cosas\nque solo tiene él, porque le parecen obvias. El dato de cuántas veces has visto\nfallar algo, el motivo por el que dejaste de hacer las cosas de cierta manera, lo\nque te contestó un cliente. **Lo obvio para ti no es obvio fuera de tu cabeza**, y\nesa es la materia prima que a un modelo le falta por definición.\n\nUn aviso más, y este es de método. Todo lo anterior es un ejercicio hipotético, y\nel informe lo dice expresamente: describe qué pasaría **si** las tareas asistidas\ndesaparecieran de las responsabilidades de alguien. No es una predicción de\nempleo. Lo traigo aquí porque ordena la pregunta, no porque adivine el futuro.\n\n---\n\n## 5 · Por qué esto sube el precio de tener voz\n\nHasta aquí, datos. Ahora la tesis del curso, que sale de ellos.\n\nCuando algo se vuelve abundante, deja de distinguir. Y lo que se ha vuelto\nabundante es **el texto correcto**: sin faltas, con las ideas donde tocan, con la\nestructura esperable. Eso ya no separa a nadie de nadie, porque cualquiera con una\nsuscripción lo produce en segundos.\n\nLo que sigue siendo escaso es lo que no se puede producir así:\n\n**El criterio.** Saber por cuál de las cinco opciones empezar, y por qué. La lista\nde opciones está en la documentación; lo que no está es alguien que se moje.\n\n**La perspectiva.** Haber visto algo suficientes veces como para saber qué se\nrepite, y contarlo desde ahí.\n\n**El detalle que solo tiene quien estuvo.** La cifra exacta, el día de la semana,\nlo que dijo el cliente. Un modelo puede escribir «una empresa mediana del sector\nindustrial»; no puede escribir lo que te contestaron aquel martes.\n\n**La postura, con su matiz.** Decir «yo iría por aquí, aunque si tu caso es este\notro, mejor lo contrario». Eso exige haber decidido antes, y haberte equivocado\nalguna vez.\n\nLas cuatro tienen algo en común: **ninguna se puede sacar de un promedio de lo ya\nescrito**, que es de donde sale lo que produce un modelo.\n\n### Correcto frente a bueno, con las dos columnas al lado\n\nLa distinción se ve mejor puesta en paralelo, porque casi todo el mundo que dice\n«mi texto está bien» se refiere a la columna izquierda.\n\n| Un texto correcto | Un texto que además vale |\n|---|---|\n| no tiene faltas | dice algo que quien lo lee no sabía |\n| tiene las ideas ordenadas | tiene una idea que su autor defiende |\n| usa el vocabulario del tema | usa el vocabulario de alguien que ha estado ahí |\n| cubre lo que había que cubrir | decide qué dejar fuera, y se nota la decisión |\n| se lee sin esfuerzo | se recuerda al día siguiente |\n\nLa columna de la izquierda se ha vuelto gratuita. La de la derecha, no — y sube de\nprecio precisamente porque la otra se abarató.\n\nHay un matiz que evita leer esto al revés: **la columna izquierda sigue siendo\nobligatoria**. Un texto con criterio y con faltas no vale más que uno correcto y\nplano; vale menos, porque nadie llega hasta el criterio. Lo que ha cambiado es que\nla izquierda ya no distingue a nadie: es el suelo, no el techo.\n\nY de ahí sale el problema práctico que ocupa el resto del curso. Cuando un texto\nsale correcto y plano a la vez, lo que le falta no son palabras: le faltan esas\ncuatro cosas. El corrector ortográfico no lo ve, porque busca faltas y aquí no\nhay ninguna. Hace falta otra manera de mirar, y eso es lo que vamos a construir.\n\n---\n\n## 6 · Confusiones habituales\n\n**«Entonces basta con no usarla.»** No es lo que dicen los datos. La forma de uso\nque crece es la colaborativa, y quien colabora bien saca mejor resultado que quien\nno la usa — y bastante mejor que quien delega a ciegas. El curso no va de\nevitarla: va de saber qué le sale mal, que es distinto.\n\n**«Si el texto de la máquina se nota, ya está resuelto.»** Se nota si sabes\nmirar. Mucha gente no sabe, y eso incluye a buena parte de las personas\nque aprueban tus textos. Además, lo que delata a un texto automático no es lo que\ncasi todo el mundo cree — y eso es justo lo que veremos en 0.2.\n\n**«Esto es un problema de calidad del modelo, y se arreglará solo.»** Puede que\nmejore. Pero varios de los defectos que catalogaremos no vienen de que el modelo\nescriba mal: vienen de que escribe **la media**. Y la media de lo ya escrito es\njusto lo que no distingue a nadie.\n\n**«Mi caso es distinto porque yo escribo poco.»** Uno de cada seis usos de estas\nherramientas produce un documento o un informe. Si escribes correos largos,\npropuestas, materiales de formación o publicaciones, estás dentro de esa\nestadística aunque no te dediques a escribir.\n\n---\n\n## 7 · Preguntas frecuentes\n\n**¿De dónde salen todos estos números?**\nDe los informes públicos de uso de Anthropic, que cruzan las conversaciones reales\ncon una clasificación de tareas por ocupación. Cada dato de este capítulo tiene su\nfuente anotada, y los que llevan fecha se citan con ella a propósito: describen un\ntrimestre concreto, no una ley.\n\n**¿Sirven para otras herramientas además de esa?**\nLos números son de un producto concreto y hay que leerlos así. Lo que sí viaja\n—porque no depende del producto— es la mecánica de fondo: lo genérico se abarata,\ny el valor se mueve a lo que no lo es.\n\n**Escribo en español, y la investigación está casi siempre en inglés. ¿Aplica?**\nEn parte. La mecánica sí. Los umbrales concretos, no siempre — y ese es uno de los\nhilos del curso: veremos un caso en el módulo 6 donde un número perfectamente\nválido, medido sobre textos españoles reales, no servía para nuestro material.\n\n**Si el valor está en el criterio, ¿por qué un curso sobre defectos del texto?**\nPorque el criterio se entrena reconociendo. Es más fácil decir qué es un texto con\nvoz cuando has visto cuarenta formas concretas de perderla.\n\n**Yo reviso textos de otros. ¿Esto me sirve o es para quien escribe?**\nTe sirve más a ti. Quien escribe tiene una sola oportunidad de equivocarse por\ntexto; quien revisa las ve todas, y necesita poder nombrar qué falla para que la\ncorrección se sostenga. «Esto no me convence» no se puede defender en una reunión.\n«Aquí hay cuatro párrafos seguidos cerrando en sentencia» sí.\n\n**¿Y si mi organización me pide justo el texto genérico?**\nPasa, y no siempre se puede cambiar. Dos cosas ayudan. Una: hacerlo rápido y sin\nculpa, porque para eso la herramienta es buena y pelear ahí es perder el tiempo.\nOtra: saber distinguir los documentos donde eso da igual de aquellos donde te\njuegas algo — una propuesta, un material que va a firmar tu nombre, una publicación\nque te va a representar. En esos, el texto genérico te cuesta dinero aunque nadie\nte lo diga.\n\n---\n\n## Lo que te llevas y lo que viene\n\n**Hoy, en tu mesa:** coge el último texto que hayas escrito con ayuda de una de\nestas herramientas y reparte sus párrafos en dos montones. En uno, lo que podría\nhaber escrito cualquiera con acceso al mismo tema. En el otro, lo que solo podías\nescribir tú — porque lo viste, porque lo decidiste, o porque tienes una postura\nsobre ello.\n\nCuenta los dos montones. Esa proporción es tu punto de partida, y es un número que\npuedes volver a medir dentro de tres meses.\n\n**Y el límite de lo que acabas de aprender.** Sabes que el texto genérico se ha\nabaratado y que tu valor está en lo que no lo es. Lo que todavía no sabes es\n**reconocer lo genérico cuando lo tienes delante** — sobre todo si lo has escrito\ntú, o si lo has revisado y te ha parecido bien.\n\nY ahí hay una trampa. Se suele creer que un texto automático se reconoce\npor las palabras: por ciertos adjetivos, por ciertas muletillas, por un vocabulario\nque suena a folleto. La investigación dice que esa pista es la menos fiable de\ntodas, y que hay otra que funciona mucho mejor.\n\nEso es 0.2.\n", "detectores": [{"codigo": "D31", "nombre": "meta anuncio", "ficha": "02-enfasis-de-carton/D31-meta-anuncio.md", "familia": {"slug": "02-enfasis-de-carton", "nombre": "enfasis de carton", "color": "#b8860b"}, "severidad": "ambar", "ocurrencias": [{"linea": 128, "regla": "meta-anuncio — «Hay un matiz honesto que» presenta lo bueno en vez de darlo. Empieza por la afirmación; no narres cómo das la clase (lista-negra §502)", "fragmento": "Hay un mat

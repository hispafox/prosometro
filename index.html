<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prosómetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f8f8f5;
    --ink:#23262c;
    --muted:#767c86;
    --line:#e2e1db;
    --rojo:#c43a2f;      /* bolígrafo del corrector */
    --rojo-suave:#f7e4e1;
    --verde:#2f7d5a;
    --verde-suave:#e3efe8;
    --ambar:#c79016;
    --ambar-suave:#f6ecd6;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}

  header h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:700;
    font-size:2rem;
    letter-spacing:-.01em;
  }
  header p.sub{color:var(--muted);margin-top:4px;font-size:.92rem}

  nav{display:flex;gap:6px;margin:26px 0 20px;border-bottom:1px solid var(--line)}
  nav button{
    appearance:none;border:none;background:none;cursor:pointer;
    font:inherit;font-weight:500;color:var(--muted);
    padding:8px 12px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  nav button.on{color:var(--ink);border-bottom-color:var(--rojo)}
  nav button:focus-visible{outline:2px solid var(--rojo);outline-offset:2px;border-radius:4px}

  section{display:none}
  section.on{display:block}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:18px;margin-bottom:16px;
  }
  h2{font-family:'Fraunces',Georgia,serif;font-size:1.15rem;font-weight:600;margin-bottom:10px}
  h2 small{font-family:'Inter';font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}

  /* ---- semáforo ---- */
  .score-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .score-num{
    font-family:'Fraunces',Georgia,serif;font-size:3.4rem;font-weight:700;line-height:1;
  }
  .score-num span{font-size:1.1rem;color:var(--muted);font-weight:400}
  .score-detail{flex:1;min-width:200px;font-size:.9rem;color:var(--muted)}
  .pill{
    display:inline-block;border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:600;
  }
  .pill.warn{background:var(--ambar-suave);color:#8a6410}
  .pill.ok{background:var(--verde-suave);color:var(--verde)}
  .pill.bad{background:var(--rojo-suave);color:var(--rojo)}

  /* ---- texto marcado ---- */
  .prosa{
    font-family:'Fraunces',Georgia,serif;font-size:1.02rem;line-height:1.75;
    white-space:pre-wrap;
    /* Un capítulo son 5.000 palabras: sin tope, la página se hace infinita y las
       tarjetas de abajo quedan a diez pantallas de distancia. */
    max-height:60vh;overflow-y:auto;padding-right:8px;
  }
  .prosa::after{content:"";display:block;height:4px}
  .prosa mark{
    background:var(--rojo-suave);color:inherit;border-bottom:2px solid var(--rojo);
    border-radius:2px;padding:0 2px;cursor:help;position:relative;
  }
  /* El capítulo renderizado: se lee como un capítulo, no como un fichero fuente. */
  .prosa.md{white-space:normal}
  .prosa.md p{margin:0 0 .9em}
  .prosa.md h3,.prosa.md h4,.prosa.md h5,.prosa.md h6{
    font-family:'Fraunces',Georgia,serif;line-height:1.3;margin:1.4em 0 .5em;
  }
  .prosa.md h3{font-size:1.25rem}
  .prosa.md h4{font-size:1.08rem}
  .prosa.md h5,.prosa.md h6{font-size:.98rem}
  .prosa.md ul,.prosa.md ol{margin:0 0 .9em 1.3em}
  .prosa.md li{margin-bottom:.3em}
  .prosa.md blockquote{
    border-left:3px solid var(--line);padding-left:14px;margin:0 0 .9em;color:var(--muted);
  }
  .prosa.md code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;
    background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px;
  }
  .prosa.md pre{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    padding:12px;overflow-x:auto;margin:0 0 .9em;white-space:pre;
  }
  .prosa.md table{margin:0 0 1em;font-size:.86rem}
  .prosa.md hr{border:none;border-top:1px solid var(--line);margin:1.4em 0}
  .prosa.md .enlace{color:var(--rojo)}
  .leyenda{margin-top:12px;font-size:.8rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
  .leyenda i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;font-style:normal}

  /* ---- detectores ---- */
  .det{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:.88rem}
  .det .cod{font-weight:600;white-space:nowrap}
  .det .barra{height:8px;background:var(--paper);border-radius:4px;overflow:hidden}
  .det .barra div{height:100%;background:var(--rojo);border-radius:4px}
  .det .n{color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---- detectores, desplegables ---- */
  .det-item{border-left:3px solid var(--line);padding-left:12px;margin-bottom:8px}
  .det-item summary{cursor:pointer;list-style:none;padding:3px 0}
  .det-item summary::-webkit-details-marker{display:none}
  .det-item summary::before{
    content:"▸";color:var(--muted);font-size:.75rem;margin-right:8px;display:inline-block;
  }
  .det-item[open] summary::before{content:"▾"}
  .det-item summary .det{
    display:inline-grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;
    width:calc(100% - 22px);vertical-align:middle;
  }
  .det-item .barra{height:8px;background:var(--paper);border-radius:4px;overflow:hidden;display:block}
  .det-item .barra span{height:100%;border-radius:4px;display:block}
  ul.hallazgos{list-style:none;font-size:.85rem;margin:8px 0 4px 22px}
  ul.hallazgos li{padding:6px 0;border-bottom:1px solid var(--line)}
  ul.hallazgos li:last-child{border-bottom:none}
  ul.hallazgos .regla{display:block;color:var(--ink)}
  ul.hallazgos .cita{
    display:block;font-family:'Fraunces',Georgia,serif;color:var(--muted);margin-top:3px;
  }
  ul.hallazgos .motivo{display:block;font-size:.76rem;color:var(--muted);margin-top:3px}
  .det-item .axis-note{margin:2px 0 6px 22px}

  /* ---- charts ---- */
  svg{display:block;width:100%;height:auto}
  .axis-note{font-size:.78rem;color:var(--muted);margin-top:8px}

  /* ---- arranques: la tira de parrafos y las barras con umbral ---- */
  .tira{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0 14px}
  .tira i{width:11px;height:11px;border-radius:2px;font-style:normal;display:block}
  .tira i.con{box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .det.arranques{grid-template-columns:minmax(0,1fr) minmax(90px,1.1fr) auto}
  .det.arranques .cod{
    font-family:'Fraunces',Georgia,serif;font-weight:400;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .det.arranques .barra{position:relative;overflow:visible}
  .det.arranques .barra > div{border-radius:4px}
  .liston{position:absolute;top:-3px;width:1px;height:14px}
  .liston.ambar{background:var(--ambar)}
  .liston.rojo{background:var(--rojo)}
  .det.arranques .n.r{color:var(--rojo);font-weight:600}
  .det.arranques .n.a{color:var(--ambar)}

  /* ---- clases de frase ---- */
  .stack{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:6px 0 12px}
  .stack div{height:100%}
  .clase-leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;font-size:.83rem}
  .clase-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;font-style:normal}
  .clase-leg .tuyo{color:var(--muted);font-size:.78rem}

  /* ---- gauge anclaje ---- */
  .gauge-row{display:flex;gap:20px;flex-wrap:wrap}
  .gauge{flex:1;min-width:180px}
  .gauge .lbl{font-size:.85rem;color:var(--muted);margin-bottom:6px}
  .gauge .track{height:10px;background:var(--paper);border-radius:5px;position:relative}
  .gauge .fill{height:100%;border-radius:5px;background:var(--rojo)}
  .gauge .fill.ok{background:var(--verde)}
  .gauge .marca{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
  .gauge .val{font-size:.85rem;margin-top:6px}
  .gauge .val b{font-variant-numeric:tabular-nums}

  /* ---- comparación ---- */
  .cmp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;margin-bottom:6px}
  .cmp-grid .box{border:1px solid var(--line);border-radius:8px;padding:12px 6px}
  .cmp-grid .num{font-family:'Fraunces',Georgia,serif;font-size:1.7rem;font-weight:700}
  .cmp-grid .num.ok{color:var(--verde)}
  .cmp-grid .num.bad{color:var(--rojo)}
  .cmp-grid .num.amb{color:var(--ambar)}
  .cmp-grid .t{font-size:.78rem;color:var(--muted)}
  .cmp-grid .ap{font-size:.72rem;opacity:.75}
  .cmp-fila{display:flex;align-items:center;gap:8px;width:100%}
  .cmp-fila .cod{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmp-fila .n{font-variant-numeric:tabular-nums;font-size:.85rem;white-space:nowrap}
  .cmp-fila .mov{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
  .cmp-fila .mov.v{color:var(--verde)}
  .cmp-fila .mov.r{color:var(--rojo)}
  .cmp-fila .mov.a{color:var(--ambar)}
  .sev{font-size:.68rem;border:1px solid;border-radius:10px;padding:1px 7px;white-space:nowrap}
  .hallazgos .rot{display:inline-block;font-size:.66rem;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:9px;
    padding:0 6px;margin-right:6px}
  .hallazgos li.ida{opacity:.62}
  .hallazgos li.ida .cita{text-decoration:line-through}
  .carril{position:relative;margin:0 0 10px}
  .carril .et{position:absolute;top:-2px;left:2px;font-size:.68rem;color:var(--muted);
    background:var(--bg);padding:0 4px;border-radius:3px}
  .carril svg{display:block;width:100%;border-bottom:1px solid var(--line)}
  .histo{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;
    height:96px;margin:14px 0 2px}
  .histo .tramo{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .histo .par{display:flex;gap:3px;align-items:flex-end;height:100%}
  .histo .par i{flex:1;min-height:1px;border-radius:2px 2px 0 0}
  .histo .ex{font-size:.68rem;color:var(--muted);text-align:center;padding-top:4px}
  .nota-cmp{display:flex;align-items:center;justify-content:center;gap:22px;margin:2px 0 14px}
  .nota-cmp .pn{font-family:'Fraunces',Georgia,serif;font-size:2.6rem;font-weight:700;line-height:1}
  .nota-cmp .pe{font-size:.75rem;color:var(--muted);text-align:center}
  .nota-cmp .salto{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;font-weight:700}
  .nota-cmp .salto.ok{color:var(--verde)}
  .nota-cmp .salto.bad{color:var(--rojo)}
  .nota-cmp .salto.amb{color:var(--ambar)}
  ul.lista{list-style:none;font-size:.88rem}
  ul.lista li{padding:7px 0;border-bottom:1px solid var(--line)}
  ul.lista li:last-child{border-bottom:none}
  ul.lista .tag{font-weight:600;margin-right:8px}
  ul.lista .tag.r{color:var(--rojo)}
  ul.lista .tag.v{color:var(--verde)}
  ul.lista .tag.a{color:var(--ambar)}

  /* ---- corpus ---- */
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th{text-align:left;font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  td .mini-pill{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  th.c,td.c{text-align:center}
  .det .n .en{display:block;font-size:.66rem;color:var(--muted);font-weight:400}
  td .fase{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:9px;
    padding:0 6px;margin-left:4px;white-space:nowrap}
  td .nota-t{font-family:'Fraunces',Georgia,serif;font-size:1.05rem}
  td .nota-t.ok{color:var(--verde)}
  td .nota-t.warn{color:var(--ambar)}
  td .nota-t.bad{color:var(--rojo)}

  footer{margin-top:34px;font-size:.78rem;color:var(--muted);text-align:center}

  /* ---- carga (lo único que no estaba en la maqueta) ---- */
  #zona{
    border:2px dashed var(--line);border-radius:12px;background:var(--card);
    padding:38px 20px;text-align:center;
  }
  #zona.sobre{border-color:var(--rojo);background:var(--rojo-suave)}
  #zona h2{margin-bottom:6px}
  #zona p{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  .btn{
    appearance:none;font:inherit;font-weight:600;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;background:var(--paper);
    color:var(--ink);padding:9px 18px;
  }
  .btn{display:inline-block}
  .btn:hover{border-color:var(--muted)}
  /* Fuera de la vista, pero NO `display:none`: un input oculto del todo no siempre
     abre el diálogo, y el botón se quedaba muerto. */
  .oculto{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
  .barra-sup{
    display:none;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-top:18px;font-size:.85rem;
  }
  .barra-sup.on{display:flex}
  .barra-sup select{font:inherit;font-size:.85rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);max-width:100%}
  .barra-sup .meta{color:var(--muted)}
  .aviso{
    border-left:3px solid var(--ambar);background:var(--ambar-suave);
    padding:10px 14px;border-radius:0 8px 8px 0;font-size:.86rem;margin-bottom:16px;
  }
  .aviso.error{border-left-color:var(--rojo);background:var(--rojo-suave)}
  .nada{color:var(--muted);font-size:.88rem;font-style:italic}
  .ps{
    float:right;font-family:'Inter',system-ui,sans-serif;font-weight:500;
    font-size:.68rem;letter-spacing:.04em;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-top:2px;
  }
  a.ps:hover{color:var(--rojo);border-color:var(--rojo)}
  .card.resaltada{border-color:var(--rojo);box-shadow:0 0 0 3px var(--rojo-suave)}
  .ficha .demo{
    background:var(--paper);border:1px dashed var(--line);border-radius:8px;
    padding:14px;margin:10px 0 14px;
  }
  .ficha .demo .et{
    font-size:.7rem;color:var(--muted);letter-spacing:.04em;
    text-transform:uppercase;margin-bottom:8px;
  }
  .ficha dl{font-size:.88rem;margin-top:4px}
  .ficha dt{font-weight:600;margin-top:10px}
  .ficha dd{color:var(--muted);margin-left:0}
  .ficha .falta{color:var(--rojo)}
  .ficha h4.sub{
    font-family:'Fraunces',Georgia,serif;font-size:.95rem;font-weight:600;
    margin:14px 0 6px;
  }
  table.clases{font-size:.86rem;margin-bottom:4px}
  table.clases td{vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid var(--line)}
  table.clases td:first-child{white-space:nowrap;width:1%}
  .ficha .cita-clase{
    font-family:'Fraunces',Georgia,serif;color:var(--ink);opacity:.75;
    display:inline-block;margin-top:4px;
  }
  .ficha .ruta{font-size:.76rem;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
  .ficha dt.resaltada{background:var(--ambar-suave);border-radius:4px;padding:2px 6px;margin-left:-6px}
  .badge{
    display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;border-radius:4px;padding:1px 7px;margin-left:8px;
    vertical-align:1px;border:1px solid;
  }
  .badge.documento{color:#4a5a6a;border-color:#4a5a6ab0;background:#4a5a6a12}
  .badge.parrafo{color:#2f6f9f;border-color:#2f6f9fb0;background:#2f6f9f12}
  .badge.frase{color:#2e7d5b;border-color:#2e7d5bb0;background:#2e7d5b12}
  .badge.expresion{color:#8a5a1b;border-color:#8a5a1bb0;background:#8a5a1b12}
  .umbral{
    display:inline-block;font-size:.76rem;color:var(--muted);margin-top:3px;
    font-variant-numeric:tabular-nums;
  }
  .pastilla{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;
            vertical-align:0;font-style:normal}
  .prosa mark{cursor:pointer}
  .enlace-det{color:inherit;text-decoration:none;border-bottom:1px dotted var(--line)}
  .enlace-det:hover{color:var(--rojo);border-bottom-color:var(--rojo)}
  .fam-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:12px}
  .fam-leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;font-style:normal}

  @media (max-width:520px){
    header h1{font-size:1.6rem}
    .score-num{font-size:2.6rem}
    .cmp-grid{grid-template-columns:1fr 1fr 1fr;gap:6px}
    nav button{padding:8px 8px 10px;font-size:.9rem}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Prosómetro</h1>
  <p class="sub">Panel de análisis determinista de prosa · ecosistema lint_prosa + HUMWRI</p>
</header>

<div id="zona">
  <h2>Carga un informe</h2>
  <p>Suelta aquí uno o varios <code>.json</code>, o púlsalo para elegirlos.<br>
     Todo pasa en tu navegador: no se sube nada a ninguna parte.</p>
  <label class="btn" for="fichero">Cargar informe</label>
  <input type="file" id="fichero" accept=".json,application/json" multiple class="oculto">
</div>

<div class="barra-sup" id="barra">
  <select id="selector" aria-label="Informe que se está viendo"></select>
  <span class="meta" id="meta"></span>
  <label class="btn" for="fichero" style="padding:5px 12px;font-size:.82rem">Cargar otro</label>
</div>

<div id="errores"></div>

<nav role="tablist" id="tabs" style="display:none">
  <button class="on" data-tab="texto" role="tab">Texto</button>
  <button data-tab="cmp" role="tab">Comparación</button>
  <button data-tab="corpus" role="tab">Corpus</button>
  <button data-tab="guia" role="tab">Guía</button>
</nav>

<section id="texto" class="on"></section>
<section id="cmp"></section>
<section id="corpus"></section>
<section id="guia"></section>

<footer id="pie"></footer>

</div>

<script>
"use strict";

/* ===========================================================================
   El visor es TONTO a proposito. No calcula ni una cifra: pinta lo que trae el
   JSON. Los nombres de detector, las familias y sus colores viajan dentro del
   informe — si el visor llevara catalogo propio, se desincronizaria en silencio
   con el ruleset del linter y nadie lo notaria hasta que un panel mintiera.

   Y lo que el informe no traiga se pinta como «No incluido», nunca con ceros de
   relleno: una tarjeta a cero no se distingue de un texto sin defectos.
   =========================================================================== */

var informes = [];   // [{nombre, datos}]
var activo = 0;

var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* Cada tarjeta lleva SU CODIGO, en el DOM y a la vista. Son los trece elementos del
   panel — PST-nn en Texto, PSC-nn en Comparacion, PSP-nn en Corpus — y existen para
   poder senalar uno por su nombre en vez de describirlo: «arregla PST-04» en lugar de
   «lo del ritmo, la linea de puntos esa». */
function card(codigo, titulo, sub, cuerpo) {
  return '<div class="card" id="' + codigo + '"><h2>' + esc(titulo) +
         (sub ? ' <small>' + esc(sub) + '</small>' : '') +
         chapa(codigo) + '</h2>' + cuerpo + '</div>';
}

/* El codigo lleva a su ficha de la Guia: pulsar «PST-04» abre la explicacion de esa
   tarjeta, con un ejemplo de como se ve y de donde sale cada cifra. */
function chapa(codigo) {
  return '<a class="ps" href="#ficha-' + codigo + '" title="Qué es ' + codigo +
         '" onclick="irAGuia(\'' + codigo + '\');return false">' + codigo + '</a>';
}

function irAGuia(codigo) {

function noIncluido(codigo, titulo, motivo) {

function avisar(texto, esError) {
  $("errores").insertAdjacentHTML("beforeend",
    '<div class="aviso' + (esError ? ' error' : '') + '">' + texto + '</div>');
}

/* ---------- carga ---------------------------------------------------------
   Un HTML abierto con doble clic no puede hacer fetch() de un JSON vecino: lo
   bloquea la politica de origenes. FileReader si esta permitido, y por eso la
   carga va por selector y por arrastre. */

function validar(datos, nombre) {
  if (datos === null || typeof datos !== "object" || Array.isArray(datos)) {
    return "«" + nombre + "» no es un informe: el JSON no contiene un objeto.";
  }
  if (!datos.resumen) {
    return "«" + nombre + "» no incluye <b>resumen</b>; probablemente es de una versión anterior del linter, o no es un informe del Prosómetro.";
  }
  var tiene = ["detectores", "ritmo", "anclaje", "arranques", "clases_frase"].some(function (k) {
    return datos[k];
  });
  if (!tiene) {
    return "«" + nombre + "» trae resumen pero ninguna sección de análisis: no hay nada que pintar.";
  }
  return null;
}

function cargar(ficheros) {
  $("errores").innerHTML = "";
  var pendientes = ficheros.length;
  if (!pendientes) return;

  Array.prototype.forEach.call(ficheros, function (f) {
    var lector = new FileReader();
    lector.onload = function () {
      var datos;
      try {
        datos = JSON.parse(lector.result);
      } catch (e) {
        avisar("«" + esc(f.name) + "» no es un JSON válido: " + esc(e.message), true);
        if (--pendientes === 0) pintar();
        return;
      }
      var problema = validar(datos, esc(f.name));
      if (problema) {
        avisar(problema, true);
      } else {
        informes.push({ nombre: f.name, datos: datos });
        activo = informes.length - 1;
      }
      if (--pendientes === 0) pintar();
    };
    lector.onerror = function () {
      avisar("No se pudo leer «" + esc(f.name) + "».", true);
      if (--pendientes === 0) pintar();
    };
    lector.readAsText(f, "utf-8");
  });
}

$("fichero").onchange = function (e) { cargar(e.target.files); e.target.value = ""; };

/* ---- el Markdown, renderizado (PST-02) -------------------------------------
   ⛔ SE RENDERIZA DESPUÉS DE MARCAR, y ese orden no es un detalle: los offsets son
   posiciones de carácter sobre el texto CRUDO. Si se renderizara primero, los `**`
   desaparecerían, todas las posiciones se correrían y las marcas acabarían señalando
   frases inocentes.

   Así que el texto llega aquí ya escapado y con sus <mark> dentro, y este renderizador
   solo añade etiquetas alrededor. La red de seguridad está abajo: si al renderizar se
   perdiera una marca, se descarta el resultado y se vuelve a texto plano — antes sin
   formato que con una marca descolocada.

   Sin librerías: el visor se abre sin conexión y no carga nada de la red. */

function _enLinea(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(¡¿—-])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="enlace">$1</span>');
}

function renderizarMarkdown(html) {
  var lineas = html.split("\n");
  var fuera = [], parrafo = [], lista = null, cita = [], tabla = [], codigo = false;

  function cerrarParrafo() {
    if (parrafo.length) { fuera.push("<p>" + _enLinea(parrafo.join(" ")) + "</p>"); parrafo = []; }
  }
  function cerrarLista() {
    if (lista) { fuera.push("<" + lista.tipo + ">" + lista.items.join("") + "</" + lista.tipo + ">"); lista = null; }
  }
  function cerrarCita() {
    if (cita.length) { fuera.push("<blockquote>" + _enLinea(cita.join(" ")) + "</blockquote>"); cita = []; }
  }
  function cerrarTabla() {
    if (!tabla.length) return;
    var filas = tabla.filter(function (f) { return !/^\s*\|?[\s:|-]+\|?\s*$/.test(f); });
    var html = "<table>";
    filas.forEach(function (f, i) {
      var celdas = f.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|");
      var et = i === 0 ? "th" : "td";
      html += "<tr>" + celdas.map(function (c) {
        return "<" + et + ">" + _enLinea(c.trim()) + "</" + et + ">";
      }).join("") + "</tr>";
    });
    tabla = [];
    fuera.push(html + "</table>");
  }
  function cerrarTodo() { cerrarParrafo(); cerrarLista(); cerrarCita(); cerrarTabla(); }

  lineas.forEach(function (linea) {
    if (/^\s*```/.test(linea)) {
      cerrarTodo();
      codigo = !codigo;
      fuera.push(codigo ? "<pre>" : "</pre>");
      return;
    }
    if (codigo) { fuera.push(linea); return; }

    if (!linea.trim()) { cerrarTodo(); return; }

    var titulo = linea.match(/^(#{1,6})\s+(.*)$/);
    if (titulo) {
      cerrarTodo();
      var nivel = Math.min(6, titulo[1].length + 2);   // # -> h3, para no competir con la tarjeta
      fuera.push("<h" + nivel + ">" + _enLinea(titulo[2]) + "</h" + nivel + ">");
      return;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(linea)) { cerrarTodo(); fuera.push("<hr>"); return; }

    if (/^\s*\|/.test(linea)) { cerrarParrafo(); cerrarLista(); cerrarCita(); tabla.push(linea); return; }
    cerrarTabla();

    var vineta = linea.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/);
    if (vineta) {
      cerrarParrafo(); cerrarCita();
      var tipo = /\d/.test(vineta[1]) ? "ol" : "ul";
      if (!lista || lista.tipo !== tipo) { cerrarLista(); lista = {tipo: tipo, items: []}; }
      lista.items.push("<li>" + _enLinea(vineta[2]) + "</li>");
      return;
    }
    cerrarLista();

    var esCita = linea.match(/^\s*&gt;\s?(.*)$/);
    if (esCita) { cerrarParrafo(); cita.push(esCita[1]); return; }
    cerrarCita();

    parrafo.push(linea.trim());
  });
  cerrarTodo();
  if (codigo) fuera.push("</pre>");
  return fuera.join("\n");
}

/* La red de seguridad: si al renderizar se pierde una marca, se tira el resultado. */
function renderizarSeguro(html) {
  var antes = (html.match(/<mark/g) || []).length;
  var salida;
  try { salida = renderizarMarkdown(html); } catch (e) { return null; }
  var despues = (salida.match(/<mark/g) || []).length;
  return antes === despues ? salida : null;
}

/* ---------- vista TEXTO -------------------------------------------------- */

function vistaResumen(d) {
  var r = d.resumen;
  var linea = [];
  if (d.pieza) {
    // «Submódulo 2.4 de HUMWRI», como rotula el panel. Los dos datos vienen del JSON:
    // el visor no descompone nombres de fichero.
    if (d.pieza.submodulo && d.pieza.codigo_curso) {
      linea.push("Submódulo <b>" + esc(d.pieza.submodulo) + "</b> de " + esc(d.pieza.codigo_curso));
    } else if (d.pieza.fichero) {
      linea.push("<b>" + esc(d.pieza.fichero) + "</b>");
    }
    if (d.pieza.etiqueta) linea.push("foto «" + esc(d.pieza.etiqueta) + "»");
  }
  if (r.palabras != null) linea.push(r.palabras.toLocaleString("es") + " palabras");
  if (r.frases != null) linea.push(r.frases + " frases");

  // La puntuacion la TRAE el JSON; el visor no la calcula. Un informe viejo que no la
  // incluya sigue viendose: se ensena el recuento de smells en su sitio.
  var num = "";
  if (r.puntuacion != null) {
    num = '<div class="score-num">' + esc(r.puntuacion) + '<span>/100</span></div>';
  } else {
    num = '<div class="score-num">' + (r.smells != null ? r.smells : 0) +
          '<span> smells</span></div>';
  }

  var banda = "";
  if (r.banda) {
    banda = '<span class="pill ' + esc(r.banda_tono || "warn") + '">' + esc(r.banda) + '</span>';
  } else if (r.por_severidad) {
    var s = r.por_severidad;
    banda = '<span class="pill ' + (s.rojo ? "bad" : s.ambar ? "warn" : "ok") + '">' +
            s.rojo + ' rojo · ' + s.ambar + ' ámbar · ' + s.info + ' info</span>';
  }

  // Debajo del numero, de donde sale: una nota sin su cuenta es un veredicto sin motivo.
  if (r.puntuacion != null && r.smells != null) {
    linea.push(r.smells + (r.smells === 1 ? " smell" : " smells"));
  }
  // El perfil contra el que se comparo, con su fecha: un informe viejo tiene que poder
  // decir con que vara se juzgo, aunque la vara haya cambiado desde entonces.
  if (d.fingerprint) {
    linea.push('perfil de <b>' + d.fingerprint.piezas + ' bases firmadas</b> (' +
               esc(d.fingerprint.calculado) + ')');
  }

  return '<div class="card" id="PST-01">' + chapa("PST-01") +
         '<div class="score-row">' + num +
         '<div class="score-detail">' + banda +
         '<p style="margin-top:8px">' + linea.join(" · ") + '</p>' +
         '</div></div></div>';
}

/* El ambito no viaja en el informe —es del detector, no del hallazgo—, asi que se
   busca en el catalogo que el visor ya lleva dentro. */
function ambitoDe(codigo) {
  for (var i = 0; i < CATALOGO.familias.length; i++) {
    var ds = CATALOGO.familias[i].detectores;
    for (var j = 0; j < ds.length; j++) {
      if (ds[j].codigo === codigo) return ds[j].ambito;
    }
  }
  return null;
}

function colorDe(bloque) {
  return (bloque.familia && bloque.familia.color) || "#767c86";
}

function vistaTexto(d) {
  if (!d.texto) {
    // Degradacion completa: sin el texto no hay marcas, pero si la cita de cada
    // ocurrencia. Se ensena la lista, no una tarjeta vacia.
    if (!d.detectores || !d.detectores.length) return noIncluido("PST-02", "Fragmento con marcas", "el informe no trae el texto");
    var filas = d.detectores.map(function (b) {
      var citas = b.ocurrencias.map(function (o) {
        return '<li><span class="tag" style="color:' + colorDe(b) + '">' + esc(b.codigo) +
               '</span>' + esc(o.fragmento || "") + '</li>';
      }).join("");
      return citas;
    }).join("");
    return card("PST-02", "Fragmentos marcados", "el informe no trae el texto completo",
                '<ul class="lista">' + filas + '</ul>');
  }

  // Rangos, con la validacion que exige el contrato: si lo que hay en esa
  // posicion no es EXACTAMENTE el fragmento citado, la marca NO se pinta.
  var rangos = [], degradadas = 0;
  (d.detectores || []).forEach(function (b) {
    b.ocurrencias.forEach(function (o) {
      if (o.inicio == null || o.fin == null) return;
      if (d.texto.slice(o.inicio, o.fin) !== o.fragmento) { degradadas++; return; }
      rangos.push({ ini: o.inicio, fin: o.fin, bloque: b, oc: o });
    });
  });
  rangos.sort(function (a, b) { return a.ini - b.ini || b.fin - a.fin; });

  var html = "", cursor = 0, solapadas = 0, familias = {};
  for (var i = 0; i < rangos.length; i++) {
    var r = rangos[i];
    if (r.ini < cursor) { solapadas++; continue; }   // empieza dentro de otra marca
    // Varios hallazgos sobre el MISMO trozo: una marca, todos los motivos.
    var motivos = [r];
    while (i + 1 < rangos.length && rangos[i + 1].ini === r.ini && rangos[i + 1].fin === r.fin) {
      motivos.push(rangos[++i]);
    }
    var fam = r.bloque.familia;
    if (fam) familias[fam.slug] = fam;
    var titulo = motivos.map(function (m) {
      return m.bloque.codigo + (m.bloque.nombre ? " · " + m.bloque.nombre : "") +
             (m.bloque.familia ? " (" + m.bloque.familia.nombre + ")" : " (sin clasificar)") +
             "\n" + m.oc.regla;
    }).join("\n\n");
    var color = colorDe(r.bloque);
    html += esc(d.texto.slice(cursor, r.ini));
    html += '<mark style="background:' + color + '22;border-bottom-color:' + color +
            '" title="' + esc(titulo) + '\n\n(pulsa para ver qué es ' + r.bloque.codigo + ')"' +
            ' onclick="irADetector(\'' + r.bloque.codigo + '\')">' +
            esc(d.texto.slice(r.ini, r.fin)) + '</mark>';
    cursor = r.fin;
  }
  html += esc(d.texto.slice(cursor));

  var leyenda = Object.keys(familias).sort().map(function (k) {
    var f = familias[k];
    return '<span><i style="background:' + f.color + '44;border-bottom:2px solid ' + f.color +
           '"></i>' + esc(f.nombre) + '</span>';
  }).join("");

  var pie = "";
  var sinMarca = d.marcas_degradadas || {};
  var totalSin = Object.keys(sinMarca).reduce(function (a, k) { return a + sinMarca[k]; }, 0);
  if (totalSin || degradadas || solapadas) {
    var partes = [];
    if (sinMarca.documento) partes.push(sinMarca.documento + " miden el documento entero y no señalan un trozo");
    if (sinMarca.no_localizado) partes.push(sinMarca.no_localizado + " no se localizaron en el texto");
    if (sinMarca.ambiguo) partes.push(sinMarca.ambiguo + " aparecen varias veces sin forma de desempatar");
    if (degradadas) partes.push(degradadas + " no coincidían con su fragmento al comprobarlas aquí");
    if (solapadas) partes.push(solapadas + " se solapan con otra marca");
    pie = '<p class="axis-note">Sin subrayar: ' + esc(partes.join(" · ")) +
          '. Ante la duda no se marca — una marca en el sitio equivocado señalaría una frase inocente.</p>';
  }

  var renderizado = renderizarSeguro(html);
  var cuerpo = renderizado
    ? '<div class="prosa md">' + renderizado + '</div>'
    : '<p class="prosa">' + html + '</p>';
  if (!renderizado) {
    pie += '<p class="axis-note">El formato no se ha podido aplicar sin mover alguna marca, ' +
           'así que el texto va en crudo: antes sin formato que con una marca descolocada.</p>';
  }
  return card("PST-02", "Fragmento con marcas", "pasa el ratón por las marcas",
              cuerpo +
              '<div class="fam-leg">' + leyenda + '</div>' + pie);
}

function vistaDetectores(d) {
  if (!d.detectores || !d.detectores.length) {
    return card("PST-03", "Detectores disparados", "lint_prosa.py", '<p class="nada">Ninguno. El capítulo pasa limpio.</p>');
  }
  var max = d.detectores[0].total;
  /* Cada detector se despliega y dice QUE encontro. Va colapsado a proposito: un
     capitulo con treinta hallazgos convertiria la tarjeta en una lista infinita, y lo
     que se busca de un vistazo es cuanto pesa cada tipo, no el detalle de cada uno.
     Con <details> lo hace el navegador: cero JavaScript y funciona sin conexion. */
  var filas = d.detectores.map(function (b) {
    var color = colorDe(b);
    var pct = Math.round(100 * b.total / max);
    var cabecera =
      '<span class="cod">' + esc(b.codigo) + (b.nombre ? ' · ' + esc(b.nombre) : '') + '</span>' +
      '<span class="barra"><span style="width:' + pct + '%;background:' + color + '"></span></span>' +
      '<span class="n">' + b.total + '</span>';

    var detalle = b.ocurrencias.map(function (o) {
      var donde = "";
      if (o.sin_marca === "documento") {
        donde = '<span class="motivo">mide el capítulo entero: no señala ninguna frase</span>';
      } else if (o.sin_marca) {
        donde = '<span class="motivo">no se pudo subrayar (' + esc(o.sin_marca) + ')</span>';
      } else if (o.linea) {
        donde = '<span class="motivo">línea ' + o.linea + '</span>';
      }
      return '<li><span class="regla">' + esc(o.regla || "") + '</span>' +
             (o.fragmento && o.sin_marca !== "documento"
               ? '<span class="cita">«' + esc(o.fragmento) + '»</span>' : '') +
             donde + '</li>';
    }).join("");

    return '<details class="det-item" style="border-left-color:' + color + '">' +
           '<summary><span class="det">' + cabecera + '</span></summary>' +
           '<ul class="hallazgos">' + detalle + '</ul>' +
           '<p class="axis-note"><a href="#det-' + b.codigo + '" class="enlace-det" ' +
           'onclick="irADetector(\'' + b.codigo + '\');return false">Qué es ' + esc(b.codigo) +
           '</a>' + (b.familia ? ' · familia <b>' + esc(b.familia.nombre) + '</b>' : '') +
           ' ' + badgeAmbito(ambitoDe(b.codigo)) + '</p></details>';
  }).join("");
  return card("PST-03", "Detectores disparados", "pulsa uno para ver qué encontró", filas);
}

function vistaRitmo(d) {
  if (!d.ritmo) return noIncluido("PST-04", "Perfil de ritmo");
  var L = d.ritmo.longitudes;
  var max = Math.max.apply(null, L), W = 700, H = 120;
  var ancho = W / L.length;
  var barras = L.map(function (v, i) {
    var h = Math.max(2, Math.round(H * v / max));
    return '<rect x="' + (i * ancho).toFixed(2) + '" y="' + (H - h) + '" width="' +
           Math.max(1, ancho - 1).toFixed(2) + '" height="' + h + '" fill="#e8a89f"><title>' +
           v + ' palabras</title></rect>';
  }).join("");

  /* ⛔ EL UMBRAL 0,50 NO SE PUEDE DIBUJAR AQUI, y conviene saber por que: el eje son
     palabras por frase, y ese numero no es una cantidad de palabras — es una proporcion
     sacada de TODAS las barras a la vez. No le corresponde ninguna altura.

     Lo que si se dibuja, y enseña lo mismo: la MEDIA de las frases y la banda hasta
     donde llegan las normales. Si casi todas caben dentro, el texto es un metronomo;
     si se salen a menudo, hay variedad. Es el ejemplo de los dos capitulos, pintado. */
  var media = L.reduce(function (a, b) { return a + b; }, 0) / L.length;
  var desv = Math.sqrt(L.reduce(function (a, v) {
    return a + (v - media) * (v - media);
  }, 0) / L.length);
  var alturaDe = function (v) { return H - Math.max(0, Math.min(H, H * v / max)); };
  var pasa = d.ritmo.medido && d.ritmo.cv != null && d.ritmo.cv >= d.ritmo.umbral_cv;
  var tono = pasa ? "#2f7d5a" : "#c43a2f";
  var yAlta = alturaDe(media + desv), yBaja = alturaDe(Math.max(0, media - desv));
  var referencia =
    '<rect x="0" y="' + yAlta.toFixed(1) + '" width="' + W + '" height="' +
      Math.max(1, yBaja - yAlta).toFixed(1) + '" fill="' + tono + '" opacity=".07"/>' +
    '<line x1="0" y1="' + alturaDe(media).toFixed(1) + '" x2="' + W + '" y2="' +
      alturaDe(media).toFixed(1) + '" stroke="' + tono + '" stroke-width="1.5" ' +
      'stroke-dasharray="6 4" opacity=".75"><title>media: ' + media.toFixed(1) +
      ' palabras por frase</title></line>';
  var pieBanda = ' La raya es tu <b>media</b>, ' + media.toFixed(0) + ' palabras por frase, y ' +
    'la banda llega hasta donde caen las frases normales (' +
    Math.max(0, media - desv).toFixed(0) + '–' + (media + desv).toFixed(0) + '). ' +
    'Cuantas más barras se salgan de ahí, más varía el texto.';
  var nota;
  if (!d.ritmo.medido) {
    nota = 'Muestra insuficiente: ' + L.length + ' frases, y el umbral pide ' +
           d.ritmo.minimo_frases + '. Por debajo, la variación es ruido.';
  } else {
    var cv = d.ritmo.cv;
    nota = 'Coeficiente de variación: <b>' + cv.toFixed(2).replace(".", ",") + '</b> · umbral <b>' +
           d.ritmo.umbral_cv.toFixed(2).replace(".", ",") + '</b> — ' +
           (cv < d.ritmo.umbral_cv
             ? 'el texto es demasiado uniforme: faltan frases cortas que hagan de valle.'
             : 'alterna largas y cortas, dentro de lo que pide la voz del vault.');
    // La vara del autor, al lado del dato. Es lo que convierte un número en un juicio.
    var fp = d.fingerprint && d.fingerprint.ritmo_cv;
    if (fp) {
      nota += ' <b>Tú escribes en ' + String(fp.mediana).replace(".", ",") + '</b> (banda ' +
              String(fp.p10).replace(".", ",") + '–' + String(fp.p90).replace(".", ",") +
              ', ' + fp.piezas + ' bases firmadas)' +
              (cv < fp.p10 ? ' — este texto se queda por debajo de tu banda.' : '.');
    }
  }
  return card("PST-04", "Perfil de ritmo", "longitud de cada frase, en palabras",
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:120px">' +
    referencia + barras + '</svg>' +
    '<p class="axis-note">' + nota + (d.ritmo.medido ? pieBanda : "") + '</p>');
}

var ETIQUETA_ANCLA = {
  cifras: "Números y cifras concretas",
  casos_declarados: "Casos declarados",
  escenas: "Escenas pasadas",
  nombres_propios: "Nombres propios y herramientas"
};

function vistaAnclaje(d) {
  if (!d.anclaje) return noIncluido("PST-06", "Densidad de anclaje");
  var a = d.anclaje, porMil = a.por_mil_por_categoria;
  var maxBarra = Math.max(a.umbral_por_mil, a.por_mil);
  var fpAnclaje = (d.fingerprint && d.fingerprint.anclaje_por_mil) || {};
  var gauges = Object.keys(porMil).map(function (k) {
    var v = porMil[k];
    // La escala de cada barra la manda el mayor de los dos: el dato o la vara. Si no,
    // una marca fuera de rango se saldría del carril y no se vería.
    var tope = Math.max(v, (fpAnclaje[k] || {}).mediana || 0, 1) * 1.15;
    var pct = Math.min(100, Math.round(100 * v / tope));
    var marca = "";
    var fp = fpAnclaje[k];
    if (fp) {
      var pos = Math.min(100, Math.round(100 * fp.mediana / tope));
      marca = '<div class="marca" style="left:' + pos + '%" title="tu mediana: ' +
              String(fp.mediana).replace(".", ",") + ' por mil"></div>';
    }
    var alcanza = fp && v >= fp.mediana;
    return '<div class="gauge"><div class="lbl">' + esc(ETIQUETA_ANCLA[k] || k) + '</div>' +
           '<div class="track"><div class="fill' + (alcanza ? ' ok' : '') +
           '" style="width:' + pct + '%"></div>' + marca + '</div>' +
           '<div class="val"><b>' + String(v).replace(".", ",") + '</b> por mil · ' +
           a.por_categoria[k] + ' en total' +
           (fp ? ' · tú: <b>' + String(fp.mediana).replace(".", ",") + '</b>' + (alcanza ? ' ✓' : '') : '') +
           '</div></div>';
  }).join("");
  var ok = a.por_mil >= a.umbral_por_mil;
  var nota = 'Total: <b>' + String(a.por_mil).replace(".", ",") + '</b> anclas por mil palabras · ' +
    'umbral <b>' + a.umbral_por_mil + '</b> ' + (ok ? '✓' : '— por debajo') + '. ' +
    'El umbral es <b>global</b>: no hay objetivo calibrado por categoría, y no se inventa uno.' +
    (a.medido ? '' : ' Muestra insuficiente: el detector pide ' + a.minimo_palabras + ' palabras.');
  return card("PST-06", "Densidad de anclaje", "por cada mil palabras · el umbral es del total, no de cada barra",
              '<div class="gauge-row">' + gauges + '</div><p class="axis-note">' + nota + '</p>');
}

function rangoArranques(d, a) {
  var fp = d.fingerprint && d.fingerprint.arranque_dominante_pct;
  if (!fp || !a.nexos.length) return "";
  var mayor = a.nexos[0].porcentaje;
  return ' En tus bases firmadas el nexo que más abre se queda en <b>' +
         String(fp.mediana).replace(".", ",") + ' %</b> (hasta ' +
         String(fp.p90).replace(".", ",") + ' %), y aquí va en <b>' +
         String(mayor).replace(".", ",") + ' %</b>' +
         (mayor > fp.p90 ? ': por encima de tu rango.' : ', dentro de rango.');
}

function vistaArranques(d) {
  if (!d.arranques) return noIncluido("PST-07", "Arranques repetidos");
  var a = d.arranques;
  if (!a.nexos.length) {
    return card("PST-07", "Arranques repetidos", "primera palabra de cada párrafo",
      '<p class="nada">Ningún nexo de discurso abre párrafo. Los artículos y preposiciones no ' +
      'cuentan: son gramática, no tic.</p>');
  }

  /* Tres cosas, y cada una responde a una pregunta distinta:
       la TIRA   ->  ¿dónde están? seis «y» seguidos no son seis repartidos
       la BARRA  ->  ¿es grave? con el umbral dibujado encima
       la LISTA  ->  ¿con qué palabras? el arranque de verdad, no el nexo suelto     */

  var COLORES = ["#c43a2f", "#c79016", "#6b4fa8", "#2f6f9f", "#2e7d5a", "#8a6d3b"];
  var color = {};
  a.nexos.forEach(function (n, i) { color[n.nexo] = COLORES[i % COLORES.length]; });

  // --- la tira: un cuadradito por párrafo, en orden
  var deQuien = {};
  a.nexos.forEach(function (n) {
    n.apariciones.forEach(function (x) { deQuien[x.parrafo] = n; });
  });
  var tira = "";
  for (var i = 0; i < a.parrafos; i++) {
    var n = deQuien[i];
    tira += '<i class="p' + (n ? ' con' : '') + '" style="background:' +
            (n ? color[n.nexo] : "var(--line)") + '" title="' +
            (n ? esc(n.apariciones.filter(function (x) { return x.parrafo === i; })[0].arranque)
               : "párrafo " + (i + 1)) + '"></i>';
  }

  // --- las barras, con el umbral dibujado
  var tope = Math.max(a.umbral_rojo * 1.35, a.nexos[0].porcentaje * 1.15);
  var filas = a.nexos.map(function (n) {
    var clase = n.porcentaje >= a.umbral_rojo ? "r" : n.porcentaje >= a.umbral_ambar ? "a" : "v";
    return '<div class="cod">«' + esc(n.apariciones[0].arranque) + '»</div>' +
           '<div class="barra"><div style="width:' + Math.min(100, 100 * n.porcentaje / tope) +
             '%;background:' + color[n.nexo] + '"></div>' +
             '<span class="liston ambar" style="left:' + (100 * a.umbral_ambar / tope) + '%"></span>' +
             '<span class="liston rojo" style="left:' + (100 * a.umbral_rojo / tope) + '%"></span>' +
           '</div>' +
           '<div class="n ' + clase + '">×' + n.veces + ' · ' +
             String(n.porcentaje).replace(".", ",") + ' %</div>';
  }).join("");

  var pie = 'Cada cuadradito es un párrafo, en el orden del capítulo: los de color abren con un ' +
    'nexo. <b>Las dos rayas de las barras son los umbrales</b> — ámbar al ' + a.umbral_ambar +
    ' %, rojo al ' + a.umbral_rojo + ' % de los ' + a.parrafos + ' párrafos.' +
    rangoArranques(d, a) +
    (a.medido ? '' : ' Muestra insuficiente: el detector pide ' + a.minimo_parrafos + ' párrafos.');

  return card("PST-07", "Arranques repetidos", "con qué abre cada párrafo, y dónde",
    '<div class="tira">' + tira + '</div>' +
    '<div class="det arranques">' + filas + '</div>' +
    '<p class="axis-note">' + pie + '</p>');
}

var CLASES = [
  ["remate",      "Remate enfático", "#c43a2f"],
  ["afirmacion",  "Afirmación",      "#23262c"],
  ["evidencia",   "Evidencia / dato", "#2f7d5a"],
  ["ejemplo",     "Ejemplo",         "#4a6fa8"],
  ["transicion",  "Transición",      "#c79016"],
  ["instruccion", "Instrucción",     "#6b4fa8"],
  ["ambigua",     "Ambigua",         "#b9bcc2"]
];

function vistaClases(d) {
  if (!d.clases_frase) return noIncluido("PST-05", "Clases de frase");
  var c = d.clases_frase, pct = c.porcentaje;
  var fp = (d.fingerprint && d.fingerprint.clases_pct) || null;

  var tira = CLASES.map(function (k) {
    var v = pct[k[0]] || 0;
    if (!v) return "";
    return '<div style="width:' + v + '%;background:' + k[2] + '" title="' + esc(k[1]) +
           ': ' + v + ' %"></div>';
  }).join("");

  var leyenda = CLASES.map(function (k) {
    var v = pct[k[0]] || 0;
    var mia = fp && fp[k[0]] ? fp[k[0]].mediana : null;
    return '<span><i style="background:' + k[2] + '"></i>' + esc(k[1]) + ' · <b>' + v + ' %</b>' +
           (mia !== null ? ' <span class="tuyo">tú ' + mia + ' %</span>' : '') + '</span>';
  }).join("");

  // El desequilibrio que ningun detector suelto ve: el remate fuera de TU banda.
  var nota = 'Qué hace cada frase, no qué dice. ' + c.frases + ' frases.';
  if (fp && fp.remate) {
    var r = pct.remate || 0;
    nota += ' El <b>' + r + ' %</b> son remate enfático, y en tus bases firmadas eso se queda ' +
            'en <b>' + fp.remate.mediana + ' %</b> (hasta ' + fp.remate.p90 + ' %)' +
            (r > fp.remate.p90
              ? ' — <b>por encima de tu rango</b>: intensidad máxima sin rango dinámico.'
              : ', dentro de rango.');
  }
  if (pct.ambigua >= 25) {
    nota += ' <b>' + pct.ambigua + ' % sin clasificar</b>: el clasificador solo se moja cuando ' +
            'la señal es clara, y aquí no lo ha estado.';
  }
  return card("PST-05", "Clases de frase", "clasificador conservador · 6 clases + ambigua",
              '<div class="stack">' + tira + '</div>' +
              '<div class="clase-leg">' + leyenda + '</div>' +
              '<p class="axis-note">' + nota + '</p>');
}

function pintarTexto(d) {
  $("texto").innerHTML =
    vistaResumen(d) + vistaTexto(d) + vistaDetectores(d) + vistaRitmo(d) +
    vistaClases(d) + vistaAnclaje(d) + vistaArranques(d);
}

/* ---------- vista COMPARACIÓN ------------------------------------------- */

/* El orden del pipeline, que NO es el de carga ni el de la fecha: una foto
   reconstruida desde git se mide hoy y es la ANTERIOR. Manda la etiqueta. */
var ORDEN_FASE = { generada: 0, revisada: 1, firmado: 2 };

function antesYDespues(x, y) {
  var ox = ORDEN_FASE[(x.pieza || {}).etiqueta], oy = ORDEN_FASE[(y.pieza || {}).etiqueta];
  if (ox !== undefined && oy !== undefined && ox !== oy) return ox < oy ? [x, y] : [y, x];
  return (x.generado || "") <= (y.generado || "") ? [x, y] : [y, x];
}

function pintarComparacion() {
  var sec = $("cmp");
  if (informes.length < 2) {
    sec.innerHTML = card("PSC-01", "Antes y después", "",
      '<p class="nada">Hace falta cargar <b>dos informes</b> del mismo capítulo para compararlos: ' +
      'la foto de cuando se generó la base y la de antes de firmarla.</p>');
    return;
  }
  // La pareja: el ultimo cargado y el mas reciente del MISMO fichero.
  var y = informes[informes.length - 1].datos;
  var x = informes[informes.length - 2].datos;
  for (var i = informes.length - 2; i >= 0; i--) {
    if (informes[i].datos.pieza && y.pieza &&
        informes[i].datos.pieza.fichero === y.pieza.fichero) { x = informes[i].datos; break; }
  }
  var par = antesYDespues(x, y), a = par[0], b = par[1];

  var cuenta = function (d) {
    var m = {};
    (d.detectores || []).forEach(function (x) { m[x.codigo] = x; });
    return m;
  };
  var A = cuenta(a), B = cuenta(b);
  var codigos = Object.keys(A).concat(Object.keys(B)).filter(function (v, i, s) { return s.indexOf(v) === i; });

  var det = { res: 0, per: 0, nue: 0 }, ap = { res: 0, per: 0, nue: 0 }, filas = "";
  var sev = { rojo: 0, ambar: 0, info: 0 };   // los que PERSISTEN, por severidad

  /* Un fragmento identifica a una ocurrencia mejor que su linea: al corregir el texto
     se mueve, y la linea 128 de una foto no es la de la otra. */
  var clave = function (o) { return (o.fragmento || o.regla || "").trim(); };

  codigos.sort().forEach(function (c) {
    var na = A[c] ? (A[c].total || 0) : 0, nb = B[c] ? (B[c].total || 0) : 0;
    var etq = A[c] || B[c];
    var color = colorDe(etq);
    var nombre = esc(c + (etq.nombre ? " · " + etq.nombre : ""));

    var signo, estado, clase;
    if (nb === 0) { det.res++; ap.res += na; signo = "✓"; clase = "v"; estado = "resuelto"; }
    else if (na === 0) { det.nue++; ap.nue += nb; signo = "+"; clase = "r"; estado = "nuevo"; }
    else {
      det.per++; ap.per += nb; signo = "→"; clase = "a";
      estado = nb < na ? "baja" : nb > na ? "sube" : "igual";
      if (sev[etq.severidad] !== undefined) sev[etq.severidad]++;
    }

    /* Que cambio de verdad: las ocurrencias de la foto anterior que ya no aparecen, y
       las de la posterior. Se casan por fragmento, asi que un retoque de la frase la
       cuenta como distinta — por eso se rotula "ya no está tal cual". */
    var oa = (A[c] || {}).ocurrencias || [], ob = (B[c] || {}).ocurrencias || [];
    var vivas = {}; ob.forEach(function (o) { vivas[clave(o)] = true; });
    var idas = oa.filter(function (o) { return !vivas[clave(o)]; });

    /* Un detector de documento no tiene una frase que quitar: lo que cambia es la
       MEDIDA (3956 palabras -> 4143). Ahi el rotulo es antes/ahora, no ya-no-esta. */
    var pinta = function (lista, rotulo, mustio) {
      return lista.map(function (o) {
        var rot = o.sin_marca === "documento" ? (mustio ? "antes" : "ahora") : rotulo;
        return '<li' + (mustio ? ' class="ida"' : '') + '>' +
          '<span class="rot">' + rot + '</span>' +
          '<span class="regla">' + esc(o.regla || "") + '</span>' +
          (o.fragmento && o.sin_marca !== "documento"
            ? '<span class="cita">«' + esc(o.fragmento) + '»</span>' : '') +
          (o.sin_marca === "documento"
            ? '<span class="motivo">mide el capítulo entero: no señala ninguna frase</span>'
            : o.linea ? '<span class="motivo">línea ' + o.linea + '</span>' : '') +
        '</li>';
      }).join("");
    };

    var detalle = pinta(idas, "ya no está tal cual", true) +
                  pinta(ob, nb && na ? "sigue" : "aparece ahora", false);

    filas +=
      '<details class="det-item" style="border-left-color:' + color + '">' +
      '<summary><span class="det cmp-fila">' +
        '<span class="tag ' + clase + '">' + signo + '</span>' +
        '<span class="cod">' + nombre + '</span>' +
        pildoraSeveridad(etq.severidad) +
        '<span class="n">' + na + ' → ' + nb + '</span>' +
        '<span class="mov ' + clase + '">' + estado + '</span>' +
      '</span></summary>' +
      (detalle ? '<ul class="hallazgos">' + detalle + '</ul>'
               : '<p class="axis-note">Sin detalle de ocurrencias en el informe.</p>') +
      '<p class="axis-note"><a href="#det-' + c + '" class="enlace-det" ' +
      'onclick="irADetector(\'' + c + '\');return false">Qué es ' + esc(c) + '</a>' +
      (etq.familia ? ' · familia <b>' + esc(etq.familia.nombre) + '</b>' : '') +
      ' ' + badgeAmbito(ambitoDe(c)) + '</p></details>';
  });

  var pa = a.resumen.puntuacion, pb = b.resumen.puntuacion, dif = pb - pa;
  var tono = dif > 0 ? "ok" : dif < 0 ? "bad" : "amb";
  var flecha = dif > 0 ? "▲" : dif < 0 ? "▼" : "=";
  var ea = esc((a.pieza && a.pieza.etiqueta) || "antes");
  var eb = esc((b.pieza && b.pieza.etiqueta) || "después");

  var cab = ea + " → " + eb;
  var caja = function (n, ap, txt, clase) {
    return '<div class="box"><div class="num ' + clase + '">' + n + '</div>' +
           '<div class="t">' + txt + '<br><span class="ap">' + ap + ' apariciones</span></div></div>';
  };
  var html = card("PSC-01", "Antes y después", cab,
    '<div class="nota-cmp">' +
      '<div class="lado"><div class="pn">' + pa + '</div><div class="pe">' + ea + '</div></div>' +
      '<div class="salto ' + tono + '">' + flecha + ' ' + (dif > 0 ? "+" : "") + dif + '</div>' +
      '<div class="lado"><div class="pn">' + pb + '</div><div class="pe">' + eb + '</div></div>' +
    '</div>' +
    '<div class="cmp-grid">' +
      caja(det.res, ap.res, "detectores resueltos", "ok") +
      caja(det.per, ap.per, "persisten", "amb") +
      caja(det.nue, ap.nue, "nuevos", "bad") +
    '</div>' +
    '<p class="axis-note">El número grande cuenta <b>detectores</b>; debajo, las <b>apariciones</b>. ' +
    'Un detector que baja de siete a una sigue contando como uno que persiste, y ahí es donde se ve ' +
    'que casi se arregló. Un detector <b>nuevo</b> tras corregir es lo que más rinde de esta vista: ' +
    'lo que siembra la propia corrección.</p>');

  /* Lo que queda por hacer NO es "3 persisten": son los que traen severidad. Un D11
     de calibre o un D13 de tono son medidas que el linter siempre reporta y que nunca
     se "arreglan"; contarlas junto a un ambar hace parecer pendiente lo que no lo es. */
  var pendientes = sev.rojo + sev.ambar;
  var subPsc3 = pendientes
    ? "queda " + pendientes + (pendientes === 1 ? " aviso real" : " avisos reales") +
      (sev.info ? " · " + sev.info + " informativo" + (sev.info === 1 ? "" : "s") : "")
    : sev.info ? "solo quedan " + sev.info + " informativo" + (sev.info === 1 ? "" : "s")
               : "no queda ninguno";
  html += card("PSC-03", "Detalle por detector", subPsc3 + " · pulsa uno para ver qué cambió",
    filas);

  if (a.ritmo && b.ritmo) {
    var LA = a.ritmo.longitudes, LB = b.ritmo.longitudes;
    var W = 700, H = 54;

    /* ⛔ UNA SOLA ESCALA PARA LAS DOS. Cada curva se escalaba por SU maximo, asi que una
       frase de 45 palabras se dibujaba tan alta como una de 61: el pico crecia un tercio
       y el grafico lo enseñaba plano. En una comparacion, el eje tiene que ser el mismo. */
    var tope = Math.max(Math.max.apply(null, LA), Math.max.apply(null, LB));

    /* ⛔ Y NO SE SUPERPONEN. Son 214 frases contra 210, y al corregir se parten y se funden:
       la frase 100 de una no es la 100 de la otra. Dos carriles enseñan la textura de cada
       una sin insinuar una correspondencia que no existe; el reparto va debajo. */
    var carril = function (L, color, etiqueta) {
      var ancho = W / L.length;
      var media = L.reduce(function (s, v) { return s + v; }, 0) / L.length;
      var barras = L.map(function (v, i) {
        var h = Math.max(1, Math.round(H * v / tope));
        return '<rect x="' + (i * ancho).toFixed(2) + '" y="' + (H - h) + '" width="' +
               Math.max(1, ancho - 1).toFixed(2) + '" height="' + h + '" fill="' + color +
               '"><title>' + v + ' palabras</title></rect>';
      }).join("");
      var ym = (H - H * media / tope).toFixed(1);
      return '<div class="carril"><span class="et">' + esc(etiqueta) + '</span>' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:' + H + 'px">' +
        barras + '<line x1="0" y1="' + ym + '" x2="' + W + '" y2="' + ym + '" stroke="' + color +
        '" stroke-width="1.5" stroke-dasharray="6 4" opacity=".8"><title>media: ' +
        media.toFixed(1) + '</title></line></svg></div>';
    };

    /* El reparto: cuanto pesa cada tramo de longitud. Comparable aunque el numero de
       frases cambie, porque va en porcentaje. */
    var TRAMOS = [[1, 5], [6, 10], [11, 15], [16, 20], [21, 30], [31, 45], [46, 999]];
    var reparto = function (L) {
      return TRAMOS.map(function (r) {
        return L.filter(function (v) { return v >= r[0] && v <= r[1]; }).length * 100 / L.length;
      });
    };
    var ra = reparto(LA), rb = reparto(LB);
    var altoMax = Math.max(Math.max.apply(null, ra), Math.max.apply(null, rb)) || 1;
    var histo = TRAMOS.map(function (r, i) {
      var etq = r[1] === 999 ? r[0] + "+" : r[0] + "–" + r[1];
      return '<div class="tramo">' +
        '<div class="par">' +
          '<i style="height:' + (ra[i] * 100 / altoMax).toFixed(1) + '%;background:#e8a89f" title="' +
            ea + ': ' + ra[i].toFixed(1) + ' %"></i>' +
          '<i style="height:' + (rb[i] * 100 / altoMax).toFixed(1) + '%;background:#2f7d5a" title="' +
            eb + ': ' + rb[i].toFixed(1) + ' %"></i>' +
        '</div><div class="ex">' + etq + '</div></div>';
    }).join("");

    var cva = a.ritmo.cv, cvb = b.ritmo.cv, lis = b.ritmo.umbral_cv;
    var cab = "", pieCv = "";
    if (a.ritmo.medido && b.ritmo.medido && cva != null && cvb != null) {
      var d2 = function (v) { return v.toFixed(2).replace(".", ","); };
      var sube = cvb > cva, igual = cvb === cva;
      var tonoCv = igual ? "amb" : sube ? "ok" : "bad";
      cab = '<div class="nota-cmp">' +
        '<div class="lado"><div class="pn">' + d2(cva) + '</div><div class="pe">' + ea + '</div></div>' +
        '<div class="salto ' + tonoCv + '">' + (igual ? "=" : sube ? "▲" : "▼") + " " +
          (cvb - cva > 0 ? "+" : "") + d2(cvb - cva) + '</div>' +
        '<div class="lado"><div class="pn">' + d2(cvb) + '</div><div class="pe">' + eb + '</div></div>' +
        '</div>';
      pieCv = 'Arriba, el <b>coeficiente de variación</b> de cada foto; el listón es <b>' + d2(lis) +
        '</b> y aquí <b>más es mejor</b>: mide cuánto alternan las frases largas con las cortas. ' +
        (cvb >= lis
          ? 'El texto firmado lo pasa.'
          : 'El texto firmado se queda por debajo: faltan frases cortas que hagan de valle.') +
        ' <b>El listón no se dibuja en los carriles a propósito</b>: el eje son palabras por ' +
        'frase, y el 0,50 sale de todas las barras a la vez, así que no le toca ninguna altura. ';
    }

    html += card("PSC-02", "Ritmo antes y después", "longitud de cada frase, misma escala",
      cab +
      carril(LA, "#e8a89f", ea) + carril(LB, "#2f7d5a", eb) +
      '<p class="axis-note">' + pieCv +
      'Las dos escalas son <b>la misma</b>, así que un pico más alto es una frase más larga de ' +
      'verdad. La raya discontinua de cada carril es su media.</p>' +
      '<div class="histo">' + histo + '</div>' +
      '<p class="axis-note"><b>El reparto por longitud</b>, en porcentaje de frases. Va aquí porque ' +
      'las dos series <b>no se pueden superponer</b>: son ' + LA.length + ' frases contra ' +
      LB.length + ', y al corregir se parten y se funden, así que la frase número tantos de una no ' +
      'es la misma de la otra. El reparto sí se compara. ' +
      '<b style="color:#e8a89f">▬</b> ' + ea + ' · <b style="color:#2f7d5a">▬</b> ' + eb + '</p>');
  }
  sec.innerHTML = html;
}

/* ---------- vista CORPUS ------------------------------------------------- */

function pintarCorpus() {
  /* ⛔ EL COLOR LO TRAE EL JSON, no se recalcula aqui. Esta tabla se inventaba su propia
     regla —verde solo sin ningun ambar— y contradecia a la pestaña Texto sobre el MISMO
     fichero: HUMWRI 0.1 firmado saca 94 y banda «Listo para publicar», y aqui salia
     amarillo. Un panel que se lleva la contraria a si mismo no vale para nada. */
  var ordenadas = informes.slice().sort(function (x, y) {
    var px = x.datos.pieza || {}, py = y.datos.pieza || {};
    var c = String(px.codigo_curso || "").localeCompare(String(py.codigo_curso || ""));
    if (c) return c;
    var s = String(px.submodulo || "").localeCompare(String(py.submodulo || ""), undefined,
                                                     { numeric: true });
    if (s) return s;
    var ox = ORDEN_FASE[px.etiqueta], oy = ORDEN_FASE[py.etiqueta];
    if (ox !== undefined && oy !== undefined) return ox - oy;
    return 0;
  });

  var filas = ordenadas.map(function (inf) {
    var d = inf.datos, r = d.resumen, s = r.por_severidad || {}, pz = d.pieza || {};

    var quien = (pz.submodulo && pz.codigo_curso)
      ? esc(pz.codigo_curso) + " <b>" + esc(pz.submodulo) + "</b>"
      : esc(pz.fichero || inf.nombre);
    var fase = pz.etiqueta ? '<span class="fase">' + esc(pz.etiqueta) + '</span>' : "";

    var tono = r.banda_tono || (s.rojo ? "bad" : s.ambar ? "warn" : "ok");
    var nota = r.puntuacion != null
      ? '<b class="nota-t ' + esc(tono) + '">' + esc(r.puntuacion) + '</b>'
      : "—";
    var banda = r.banda ? '<span class="pill ' + esc(tono) + '">' + esc(r.banda) + '</span>' : "—";

    var avisos = [];
    if (s.rojo) avisos.push('<span style="color:var(--rojo)">' + s.rojo + ' 🔴</span>');
    if (s.ambar) avisos.push('<span style="color:var(--ambar)">' + s.ambar + ' 🟠</span>');
    if (s.info) avisos.push('<span style="color:var(--muted)">' + s.info + ' ℹ️</span>');

    return '<tr title="' + esc(pz.fichero || inf.nombre) + '">' +
      '<td>' + quien + ' ' + fase + '</td>' +
      '<td class="c">' + nota + '</td>' +
      '<td>' + banda + '</td>' +
      '<td class="c">' + (r.palabras != null ? r.palabras.toLocaleString("es") : "—") + '</td>' +
      '<td class="c">' + (avisos.length ? avisos.join(" · ") : "limpio") + '</td></tr>';
  }).join("");

  /* ⛔ UNA FOTO POR CAPITULO, la mas avanzada. Sumar las dos cuenta el mismo texto dos
     veces, y encima sube al ranking lo que YA se corrigio: con el par de HUMWRI 0.1
     cargado, los cuatro primeros eran detectores que no existen en el texto firmado.
     Este fallo no se podia ver hasta que hubo dos fotos del mismo capitulo. */
  var vigente = {};
  ordenadas.forEach(function (inf) {
    var pz = inf.datos.pieza || {};
    var id = (pz.codigo_curso || "") + "|" + (pz.submodulo || "") + "|" +
             (pz.fichero || inf.nombre);
    var previo = vigente[id];
    if (!previo) { vigente[id] = inf; return; }
    var on = ORDEN_FASE[pz.etiqueta], op = ORDEN_FASE[(previo.datos.pieza || {}).etiqueta];
    if (on !== undefined && op !== undefined) { if (on > op) vigente[id] = inf; }
    else if ((inf.datos.generado || "") > (previo.datos.generado || "")) vigente[id] = inf;
  });
  var piezas = Object.keys(vigente).map(function (k) { return vigente[k]; });
  var descartados = informes.length - piezas.length;

  var acumulado = {};
  piezas.forEach(function (inf) {
    (inf.datos.detectores || []).forEach(function (b) {
      if (!acumulado[b.codigo]) acumulado[b.codigo] = { n: 0, piezas: 0, b: b };
      acumulado[b.codigo].n += b.total;
      acumulado[b.codigo].piezas++;
    });
  });

  /* ⛔ Y LOS INFORMATIVOS NO ENTRAN EN EL RANKING. D11 mide el calibre y D13 el tono:
     saltan en TODOS los capitulos porque son medidas, no defectos. En una lista de «lo
     que mas te pasa» copan los primeros puestos y no dicen nada. Van debajo, contados. */
  var esAviso = function (c) { return acumulado[c].b.severidad !== "info"; };
  var codigos = Object.keys(acumulado);
  var orden = codigos.filter(esAviso)
    .sort(function (x, y) { return acumulado[y].n - acumulado[x].n; }).slice(0, 8);
  var infos = codigos.filter(function (c) { return !esAviso(c); })
    .sort(function (x, y) { return acumulado[y].n - acumulado[x].n; });

  var max = orden.length ? acumulado[orden[0]].n : 1;
  var barras = orden.map(function (c) {
    var e = acumulado[c], color = colorDe(e.b);
    return '<div class="cod">' + esc(c + (e.b.nombre ? " · " + e.b.nombre : "")) +
           pildoraSeveridad(e.b.severidad) + '</div>' +
           '<div class="barra"><div style="width:' + Math.round(100 * e.n / max) +
           '%;background:' + color + '"></div></div>' +
           '<div class="n">' + e.n + '<span class="en">en ' + e.piezas +
           (e.piezas === 1 ? " pieza" : " piezas") + '</span></div>';
  }).join("");

  var pieInfo = "";
  if (infos.length) {
    pieInfo = '<p class="axis-note"><b>Fuera del ranking, los informativos</b> — ' +
      infos.map(function (c) {
        return esc(c + (acumulado[c].b.nombre ? " · " + acumulado[c].b.nombre : "")) +
               " (" + acumulado[c].n + ")";
      }).join(" · ") +
      '. Son medidas que el linter reporta en todos los capítulos, así que encabezarían la ' +
      'lista siempre sin decir nada de cómo escribes.</p>';
  }

  var sub = piezas.length + (piezas.length === 1 ? " pieza" : " piezas") +
    (descartados ? " · " + descartados + (descartados === 1 ? " foto anterior descartada"
                                                            : " fotos anteriores descartadas") : "");

  $("corpus").innerHTML =
    card("PSP-02", "Últimos textos analizados", informes.length + (informes.length === 1 ? " informe" : " informes"),
      '<table><thead><tr><th>Pieza</th><th class="c">Nota</th><th>Banda</th>' +
      '<th class="c">Palabras</th><th class="c">Avisos</th></tr></thead><tbody>' +
      filas + '</tbody></table>' +
      '<p class="axis-note"><b>La nota y la banda salen del informe</b>, las mismas que enseña la ' +
      'pestaña Texto: un capítulo sin rojos no baja de 75 por muchos avisos que tenga. La columna ' +
      'de avisos va aparte a propósito, para poder mirar el volumen sin confundirlo con la ' +
      'gravedad. Se ordena por curso, submódulo y fase.</p>' +
      '<p class="axis-note">Solo lo que hay cargado en esta sesión. El visor no recuerda nada entre sesiones.</p>') +
    ((orden.length || infos.length)
      ? card("PSP-03", "Detectores más frecuentes", sub,
          (orden.length
            ? '<div class="det">' + barras + '</div>'
            : '<p class="nada">Ningún aviso con severidad en las piezas cargadas.</p>') +
          '<p class="axis-note">De cada capítulo cuenta <b>una sola foto, la más avanzada</b>. ' +
          'Sumar la generada y la firmada contaría el mismo texto dos veces, y subiría al ranking ' +
          'lo que ya está corregido.</p>' + pieInfo)
      : "");
}

function badgeAmbito(clave) {
  if (!clave) return '';
  // Un detector puede medir en DOS escalas — D13 saca un porcentaje del capítulo y además
  // frases sueltas — y entonces lleva sus dos insignias.
  return clave.split("+").map(function (k) {
    var a = AMBITOS[k];
    if (!a) return '';
    return '<span class="badge ' + k + '" title="' + esc(a[1]) + '">' + esc(a[0]) + '</span>';
  }).join("");
}

function umbralesDe(d) {
  if (!d.umbrales || !d.umbrales.length) return '';
  return '<span class="umbral">' + d.umbrales.map(function (u) {
    return esc(u.nombre.toLowerCase().replace(/_/g, " ")) + ' <b>' + esc(u.valor) + '</b>';
  }).join(" · ") + '</span>';
}

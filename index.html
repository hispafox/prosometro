ar de señales. «Aquí está la clave» es un cartel, y el inciso entre guiones un badén. La frase partida en dos mitades gemelas se parece más a una raya pintada en el suelo, de esas que no obligan a nada y aun así ordenan el tráfico. Ninguna de las tres trae información nueva: las tres dicen cómo hay que tomarse el material que tienen alrededor.\n\nY pasa lo mismo que en el cruce. Cuando el texto va lleno de carteles, el lector sigue los carteles. Cuando los quitas, tiene que leer lo que hay.\n\n## Dónde estás\n\nEl capítulo anterior cerró con una pregunta que dejé aparcada. Sus dos olores llegaban siempre tarde, al final del párrafo, y por eso se podían juzgar con el dedo tapando la última frase: si el párrafo aguanta sin ella, sobraba. Los de hoy llegan antes o por el medio. Ahí ya no hay ninguna última frase que tapar.\n\nUna de las tres formas de hoy anuncia por delante lo que va a venir. Otra no anuncia nada: repite una estructura para que suene bien. Y a la última ni siquiera se la puede llamar frase, porque es un signo de puntuación usado más de la cuenta.\n\nCon esa última te vas a encontrar algo nuevo, y es la razón de que este capítulo cierre el módulo. Hasta ahora todos los olores que has contado se veían dentro de una frase, o de un puñado de párrafos seguidos. El guion largo no. Un guion suelto casi nunca está mal puesto. Lo que canta es cuántos hay en el texto entero.\n\n- **De aquí sales sabiendo** reconocer las tres formas y separarlas de sus parientes buenas, que las tienen y son útiles; y con la idea de que la vara de medir la elige el olor, no tú.\n- **Con esto se cierra la familia del énfasis.** El módulo 3 cambia de asunto: allí se trata el español que suena traducido o que suena a manual, que es otra cosa distinta de subir la voz.\n\n## Lo que vas a leer aquí\n\n1. El cartel puesto antes de la curva\n2. Las formas que no parecen la misma\n3. La frase que se mira al espejo\n4. La raya que respira por ti\n5. Tres olores, tres varas de medir\n6. El aviso que marcó el noventa y tres por ciento de una clase de textos\n7. Cómo se dice lo mismo sin cartel, sin espejo y sin raya\n8. Una publicación, desmontada\n9. Qué hacer el lunes con un texto tuyo\n10. Confusiones habituales\n11. Preguntas frecuentes\n\n---\n\n## 1 · El cartel puesto antes de la curva\n\nEmpiezo por la más fácil de reconocer de las tres. Es también la que más se cuela cuando uno habla en vez de escribir.\n\n<!-- lint-prosa: muestra -->\n> Y **aquí está la clave**: el formulario se envía dos veces.\n>\n> **Y ahora viene lo interesante**, que es lo que pasa cuando el cliente no contesta.\n>\n> **La respuesta corta es** que no compensa. La larga, que depende del volumen.\n>\n> **Spoiler:** ocho de cada diez lo montan mal la primera vez.\n<!-- lint-prosa: fin -->\n\nLas cuatro tienen la misma forma, y ninguna dice nada: presentan la frase siguiente y se apartan. Quítalas y el texto no pierde ni una palabra de información.\n\nA esto lo llamo **meta-anuncio**, y el nombre es literal. La frase no habla del asunto, habla de la explicación del asunto. Narra cómo estás dando la clase en lugar de darla.\n\nEs el gemelo de la coletilla del capítulo anterior, girado. Aquella iba detrás y certificaba que lo dicho importaba. Esta va delante y promete que lo que viene lo va a valer. Las dos le piden al lector que conceda peso, una por adelantado y otra a toro pasado, y ninguna de las dos trae el argumento que lo justificaría.\n\nFíjate en cómo altera el orden de la lectura. Quien te lee llega a esa frase, se prepara, y al girar la esquina se encuentra con el material de siempre. Si lo que venía era bueno, se lo has estropeado avisando; y si era normal, acabas de firmar una promesa que no cumples. Las dos veces sales perdiendo.\n\nHay una segunda cosa, más práctica. El anuncio ocupa el sitio de la primera frase del párrafo, que es el renglón que más gente lee de todos. Ese renglón se lo has dado a un cartel.\n\nAhora, la parte que te va a evitar podar de más. **No todas las frases que empiezan con «aquí» son esto.** Estas cuatro se quedan, y las cuatro son de la misma familia aparente:\n\n<!-- lint-prosa: muestra -->\n> Aquí, en la carpeta de la campaña, está el archivo con los textos aprobados.\n>\n> Ojo con esto: si borras el grupo, se va todo lo que hay dentro.\n>\n> Esto lo vas a necesitar en la sesión cuatro, cuando montemos la evaluación.\n>\n> ¿Y qué pasa si el pedido entra por teléfono en vez de por la web?\n<!-- lint-prosa: fin -->\n\nEl «aquí» de la primera señala un sitio que existe, una carpeta con archivos dentro. El aviso del grupo trae dentro el dato que importa, así que avisa de verdad. Anticipar con destino concreto es un servicio, porque quien lee sabe en qué momento va a necesitar esto. Y la pregunta del final abre de verdad. Detrás viene una respuesta y no otro anuncio.\n\nLa frontera entre las cuatro de arriba y las cuatro de antes está en una pregunta sola: **¿esa frase trae algo dentro, o solo presenta lo que viene detrás?**\n\n## 2 · Las formas que no parecen la misma\n\nCon las tres o cuatro formas más gastadas uno se reconoce enseguida y se queda tranquilo. El problema es que la familia es bastante más ancha, y las formas de la segunda mitad de la lista son las que se cuelan en material serio.\n\nEstán las que anuncian el formato en vez del contenido: «te lo cuento en versión corta y luego en versión larga», «aquí van dos números». Otras anuncian un giro, del tipo «donde está el truco es en la etapa cuarenta» o «y ahora el detalle que descoloca». Y quedan dos que a mí me han costado ver más que ninguna. Las dos suenan a prudencia en vez de a énfasis.\n\nUna es **«hay un matiz que…»**. Suena a honradez y por eso pasa el filtro; hace exactamente lo mismo, anunciar que viene una precisión importante en vez de darla.\n\nLa otra es la coletilla que le pide al lector que le conceda importancia a algo por adelantado: «y hay que traerlo aquí **porque cambia cómo se leen** todos estos números», «**porque aquí es donde**…».\n\nEstas dos no las tengo de ninguna lista. Las tengo de una frase mía, que leí en alto un día mientras preparaba el capítulo de apertura de este mismo curso:\n\n<!-- lint-prosa: muestra -->\n> Hay un matiz honesto que conviene tener en cuenta, porque aquí es donde ocurre esto.\n<!-- lint-prosa: fin -->\n\nTres tics soldados en una línea, y yo no veía ninguno. Ahí no hay una sola palabra de información. Hay un carraspeo largo.\n\nCuando fui a montar el aviso automático para esta familia me encontré con un problema de calibrado que ilustra bien por qué la lista tiene que ser cerrada. Buscando «aquí está» a secas, el aviso saltaba en más de la mitad de mis guiones hablados. Es normal: en cuanto explicas algo señalando, dices «aquí está» a todas horas, y la mayoría de las veces señalando un sitio real. Acotándolo a las cuatro o cinco continuaciones que hacen el tic, «aquí está la clave», «aquí está el problema», «aquí está lo bueno», el aviso se queda en poco más de un tercio de lo que marcaba antes. La misma idea, dos tercios menos de ruido, por una forma que estaba mal recortada.\n\nGuárdate ese efecto para tus propias cuentas, porque se repite: **lo que estropea una cuenta suele ser la forma más corta de la lista**, la que parece inocente y aparece en todas partes.\n\nUn apunte de dónde se acumula esto, que cambia según dónde escribas. Sobre unos novecientos textos míos en castellano, el meta-anuncio aparece en uno de cada veinte textos escritos y en uno de cada cinco guiones hablados. En material para diapositivas casi no sale. En una diapositiva no hay sitio para presentar nada.\n\nQue sea el hablado el que se lleva la peor parte tiene todo el sentido. Cuando hablas sin guion, anunciar lo que viene es una manera de ganar tiempo mientras piensas. Al escribirlo, ese tiempo ya no hace falta y el carraspeo se queda escrito.\n\n## 3 · La frase que se mira al espejo\n\nLa segunda de hoy es más silenciosa y bastante más difícil de quitar, porque cuando aparece suele ser tu mejor frase del párrafo.\n\n<!-- lint-prosa: muestra -->\n> El alumno que pregunta aprende más que el que calla.\n>\n> La objeción que se anticipa cuesta menos que la que se responde.\n>\n> Lo que no dices pesa más que lo que dices.\n<!-- lint-prosa: fin -->\n\nLéelas en alto. Suenan bien, y suenan a verdad. Las tres están construidas igual: dos mitades con la misma forma, unidas por un comparativo. Un artículo, un relativo, un verbo; el mismo artículo, el mismo relativo, otro verbo.\n\nEs prima hermana del molde antitético con el que abrimos el módulo, el de «no es esto, es lo otro». Allí la primera mitad negaba y la segunda afirmaba. Aquí las dos afirman, y por eso se escapa: quien busca la negación no la encuentra, y el gesto es el mismo. Oponer dos ideas en espejo para que el conjunto suene a sentencia.\n\nAhora la frontera, que es la parte útil. **Comparar es otra cosa.** Estas dos se quedan:\n\n<!-- lint-prosa: muestra -->\n> La newsletter del martes se abre más que la del viernes.\n>\n> El vídeo corto se termina más veces que el largo, y por eso lo pongo primero.\n<!-- lint-prosa: fin -->\n\n¿Qué las salva? Que traen información. Comparan dos cosas distintas y de la comparación sale un dato que puedes comprobar, discutir o usar el lunes. El espejo no compara nada: repite una estructura para que el oído la acepte. Si sustituyes las dos mitades por otras cualesquiera, la frase sigue sonando igual de redonda, y esa es la prueba.\n\nHay un detalle de forma que las separa a ojo. El espejo pide que las dos mitades sean **iguales de verdad**: el mismo artículo, el mismo relativo, el mismo verbo o uno de la misma clase. En cuanto una de las dos se sale, deja de sonar a sentencia. «La regla que se mide vale más que el que la escribió» ya no es el molde, es una frase normal con una comparación dentro.\n\nDe la medición de esto me llevé una sorpresa. Es un molde rarísimo: de aquellos novecientos textos, en los cuatrocientos y pico que son capítulos escritos apareció una sola vez. Y ese único hallazgo era real, tal cual, en el capítulo de un curso terminado.\n\nDe ahí le viene el peligro. **Un molde que aparece una vez cada cuatrocientos textos no se puede contar.** No hay racha, no hay frecuencia, no hay nada que medir. Cuando aparece, aparece sola. La única manera de cazarla es leerla despacio.\n\nY de la cuota, que viene del capítulo del balancín y aquí solo hay que recordar hasta dónde llega: esta gasta del mismo presupuesto que el molde antitético, la enumeración de tres y la cápsula corta. Todas suben la voz de la misma manera, así que el hueco es uno para todas.\n\n## 4 · La raya que respira por ti\n\nLa tercera es la que más discusiones me ha traído de todo el catálogo.\n\nEl guion largo es puntuación española de toda la vida, y hace dos trabajos que ningún otro signo hace igual de bien. Esos dos **no se tocan**, y van primero para que no salgas de aquí matando rayas a la primera de cambio. Corta y sigue:\n\n<!-- lint-prosa: muestra -->\n> El resultado no lo esperaba nadie — y era el bueno.\n>\n> Funciona. Casi siempre — o eso me dicen.\n<!-- lint-prosa: fin -->\n\nEso se queda. En mi propia prosa lo uso, y no pienso quitarlo.\n\nLo que huele es otra cosa: el inciso entre **dos** guiones convertido en la manera de respirar. Cada matiz que se te ocurre entra entre rayas en lugar de ocupar su sitio, y la frase acaba siendo tres frases mal cosidas.\n\n<!-- lint-prosa: muestra -->\n> El boletín —que sale los martes— llega a toda la lista. La página de precios —más fácil de cambiar— solo cubre un producto. Y el formulario —que casi nadie mira— es la tercera pata.\n<!-- lint-prosa: fin -->\n\nAhí no hay ninguna frase mal escrita. Hay un párrafo con tres incisos. Al leerlo en alto se oye el mismo balanceo tres veces seguidas.\n\nEsto se mira en dos escalas, y hay que separarlas porque son dos cosas distintas, aunque se arreglen igual.\n\nLa primera es la **frase con dos pares**, cuatro rayas en una sola oración. Esa se marca sin más, porque es siempre el mismo gesto: la frase que se parchea en vez de reorganizarse.\n\n<!-- lint-prosa: muestra -->\n> Borrar el grupo —y esto no te lo pregunta dos veces— arrastra todo lo que hay dentro —incluidos los permisos— sin avisar.\n<!-- lint-prosa: fin -->\n\nLa segunda es la **densidad del texto entero**, y es la escala que no habías visto todavía en este curso. Aquí ninguna frase está mal. Lo que pasa es que el mismo recurso vuelve cada pocas líneas y termina siendo la cadencia de todo lo que escribes.\n\nPara eso hace falta poner las rayas en relación con el tamaño del texto, porque cinco guiones en cien palabras y cinco en cinco mil no se parecen en nada. La cuenta que uso es sencilla y la puedes hacer a mano: cuántos guiones largos hay **por cada mil palabras**. Divides el número de palabras entre mil, cuentas las rayas, y divides. En mi material ya publicado sale alrededor de diez por cada mil, y ese número me sirve de referencia de lo que es normal en mi prosa. El tuyo lo sacas igual, y el corte a partir del cual toca abrir el texto lo montas en el módulo 8, con los tuyos delante.\n\nHay un detalle de esa cuenta que no es capricho. **No basta con la proporción: hace falta también un mínimo de rayas en total.** Si mides un texto de cien palabras con cinco guiones, la proporción se dispara y aun así son cinco guiones. Con las dos condiciones a la vez, un texto corto no puede saltar por accidente.\n\nLa raya larga es de las cosas que más se citan como huella de texto generado, y vas a encontrar publicaciones enteras dedicadas a eso. Ten cuidado con esa conversación, más que con ninguna otra de este curso. Hay gente que lleva toda la vida escribiendo con incisos porque le sale así, y el castigo por escribir con guiones lo pagan ellos. Es un indicio para mirar, nunca una prueba de nada, y menos sobre el trabajo de otro.\n\n## 5 · Tres olores, tres varas de medir\n\nEn el capítulo anterior contabas **rachas**: párrafos seguidos que cerraban corto, porque una cápsula suelta no significa nada y cinco pegadas sí. Hoy no has contado ninguna racha. En cambio has usado tres varas distintas en tres secciones.\n\nEl meta-anuncio se cuenta **por aparición, con una lista cerrada de formas**. Cada una que encuentras es una, y el aviso sirve o no según lo bien recortada que esté la lista.\n\nEl espejo se marca **en cuanto asoma**, sin lista y sin contar nada, porque es tan raro que esperar a que se repita es esperar sentado.\n\nY la raya se mide **sobre el texto completo**, en proporción a su tamaño, con una condición aparte para la frase de cuatro rayas.\n\nLo que decide la vara no eres tú: es cómo se comporta el olor. Un molde que está en la prosa de casi cualquiera solo significa algo cuando se amontona. Uno que aparece una vez cada cuatrocientos textos significa algo la primera vez, porque no va a haber segunda. Y un signo de puntuación que nunca está mal en una frase concreta solo se ve desde arriba, con el texto entero delante.\n\nEsto va a volver, y en grande, en el módulo 8. Ahí verás que **elegir mal la unidad es el error de medición más repetido de todos**, y verás por qué el mismo defecto puede ser una rareza contando frases y una constante contando textos. Hoy quédate con la costumbre: antes de ponerte a contar algo, pregúntate qué estás contando.\n\n## 6 · El aviso que marcó el noventa y tres por ciento de una clase de textos\n\nLa historia de este capítulo empieza con el aviso de la frase con dos pares de guiones, que parecía el más simple de todo el catálogo. Cuatro rayas en una oración. No hay nada que interpretar.\n\nLo pasé sobre todo el material que tenía y miré los resultados por tipo de texto. En los capítulos escritos marcaba uno de cada diez, que era más o menos lo que esperaba. En los guiones hablados, algo menos. Y en los laboratorios, que son los documentos de ejercicios paso a paso, marcaba el noventa y tres por ciento.\n\nCasi todos. De una clase de texto entera.\n\nMi primera reacción fue de manual, y por eso la cuento. Di por hecho que el listón estaba bajo y me puse a subirlo: cinco rayas, seis rayas. Estuve un rato largo probando números y viendo bajar el porcentaje, que es justo la sensación de estar trabajando sin estar arreglando nada. En ningún momento abrí uno de los documentos marcados para ver qué había dentro.\n\nCuando por fin lo abrí, el guion no estaba donde yo creía. Estaba aquí:\n\n<!-- lint-prosa: muestra -->\n> - **Resumen** — qué vas a montar\n> - **Antes de empezar** — lo que necesitas\n> - **Punto de partida** — de dónde sales\n<!-- lint-prosa: fin -->\n\nTres viñetas de una lista, con un guion cada una. Perfectamente normales.\n\nEl programa que partía el texto en frases no sabía que eso eran tres cosas. Las juntaba en una sola frase larguísima con seis rayas dentro, y esa frase inventada saltaba en todos los laboratorios del mundo, porque **todos los laboratorios empiezan con una lista así**. El listón estaba bien. Lo que estaba mal era el trozo de texto que se estaba midiendo. Arreglada la manera de partir, el mismo criterio, sin tocarle una coma, pasó de marcar el noventa y tres por ciento a marcar el uno y pico.\n\nLa regla que uso desde entonces sirve aunque no escribas un programa en tu vida: **cuando una cuenta marca casi todo, el problema casi nunca es el listón.** Un listón mal puesto marca de más, sí, pero marca de más repartido. Cuando lo que marca es casi el cien por cien de algo, lo que estás midiendo no es lo que crees.\n\nY hay una segunda lección, más fina, que es la que me habría ahorrado la tarde. Lo que tenía que haberme puesto en guardia no era el noventa y tres por ciento. Era **la diferencia** entre el noventa y tres de los laboratorios y el diez de los capítulos, con el mismo criterio aplicado a los dos. Cuando un aviso se ceba con un tipo de texto y deja tranquilos a los demás, la explicación cómoda es que ese tipo de texto está peor escrito. La explicación aburrida, y la que suele acertar, es que ese tipo de texto tiene una forma que tu manera de contar no sabe leer.\n\nTradúcelo a lo tuyo. Si un día mides tus textos y te sale que tus fichas de producto están fatal y tus artículos estupendos, antes de reescribir cuarenta fichas mira tres a mano.\n\n## 7 · Cómo se dice lo mismo sin cartel, sin espejo y sin raya\n\nLos tres arreglos son distintos. Ninguno de ellos consiste en borrar y ya está.\n\n**Para el anuncio: empieza por la afirmación.** Es el arreglo más agradecido del curso, porque suele bastar con tachar la frase del cartel y subir la que viene detrás.\n\n<!-- lint-prosa: muestra -->\n> ❌ Y aquí está la clave: el formulario se envía dos veces.\n>\n> ✅ El formulario se envía dos veces, y el aviso al comercial sale duplicado.\n<!-- lint-prosa: fin -->\n\nCuando de verdad quieras avisar de algo, avisa con el contenido dentro. «Ojo con el orden, que aquí se paga caro» es un aviso; «ahora viene lo interesante» no lo es. Y si lo que quieres es que el lector se prepare, la pregunta te lo hace gratis: pregúntale, en vez de anunciarle.\n\n**Para el espejo: afirma una mitad y sigue.** El molde se sostiene porque las dos mitades se sujetan una a otra, así que en cuanto te quedas con una tienes que decir algo de verdad.\n\n<!-- lint-prosa: muestra -->\n> ❌ El alumno que pregunta aprende más que el que calla.\n>\n> ✅ Las preguntas de clase me dicen qué parte de la explicación no ha llegado, y por eso reordeno el material entre una sesión y la siguiente.\n<!-- lint-prosa: fin -->\n\nFíjate en que la de abajo dice algo que la de arriba no decía. Ese suele ser el precio del espejo: la frase bonita se llevaba puesta la información concreta.\n\n**Para el guion: punto y frase aparte, o la coma y el «que».** Los dos hacen ese trabajo mejor que el par de rayas, y no cuestan nada.\n\n<!-- lint-prosa: muestra -->\n> ❌ El boletín —que sale los martes— llega a toda la lista.\n>\n> ✅ El boletín, que sale los martes, llega a toda la lista.\n<!-- lint-prosa: fin -->\n\nY la trampa de siempre, que en este módulo ya te ha salido dos veces. Si al deshacer un inciso te sale una sentencia corta, o si al quitar un anuncio metes una contraposición para compensar, el texto se queda igual de alto y lo único que ha cambiado es el olor. Los cuatro tiran de la misma cuota.\n\n## 8 · Una publicación, desmontada\n\nEste bloque está escrito para el ejemplo, con los tres defectos puestos a propósito. Es una publicación del tipo que se ve cualquier lunes en cualquier red profesional.\n\n<!-- lint-prosa: muestra -->\n> **Spoiler:** llevo tres años haciéndolo mal.\n>\n> Cuando empecé a formar equipos —allá por 2023— pensaba que preparar bien la sesión era llevarlo todo escrito.\n>\n> Y ahora viene lo interesante.\n>\n> El formador que improvisa enseña más que el que recita.\n>\n> Lo entendí en una sesión —de las difíciles— con un grupo —quince personas— que no preguntaba nada.\n>\n> Aquí está la clave: la preparación no es el guion. Es saber qué puedes soltar.\n<!-- lint-prosa: fin -->\n\nSeis líneas, y dentro están los tres olores de hoy más el del capítulo anterior. Dos anuncios, y el «spoiler» de arriba es un tercero. Una frase de espejo entera. Cinco pares de guiones en un texto que no llega a cien palabras. Y en la última línea una cápsula de remate, de las del capítulo anterior.\n\nLo que más me interesa que veas es que **el material de partida es bueno**. Ahí hay una persona que aprendió algo trabajando y que además sabe cuándo lo aprendió. Eso no se puede fabricar. Lo que se ha hecho con ese material es empaquetarlo en cartelería.\n\nAhora la versión trabajada:\n\n<!-- lint-prosa: muestra -->\n> Llevo tres años preparando mal las sesiones, y hasta este invierno no supe por qué.\n>\n> Cuando empecé a formar equipos, en 2023, creía que prepararse era llevarlo todo escrito. Escribía el guion entero, con los ejemplos y hasta las transiciones.\n>\n> Lo entendí con un grupo de quince personas que no preguntaba nada. Me quedaban veinte minutos de guion y ninguna gana de seguir leyéndolo, así que lo cerré y les pregunté qué hacían el lunes con lo que les acababa de contar. Salieron cuatro problemas concretos que no estaban en mi material.\n>\n> Ahora preparo el doble y llevo la mitad escrito. Lo que preparo es la lista de lo que puedo soltar si veo caras raras.\n<!-- lint-prosa: fin -->\n\nLa de abajo es más larga, y a propósito. Ciento veinte palabras frente a setenta y una, un setenta por ciento más. Pasa siempre que se cambian carteles por contenido, y está bien: donde había tres anuncios ahora hay una escena con cuatro problemas dentro.\n\nMira ahora lo que ha desaparecido sin que nadie lo eche de menos. En la versión de arriba había cinco incisos entre guiones, y ninguno de los cinco decía nada que no cupiera en la frase. «De las difíciles» se ha caído entero, y lo que estaba contando ya lo cuenta la escena.\n\nY falta una cosa más: la frase del espejo, la del formador que improvisa. No la he traducido, la he tirado. Cuando fui a escribir qué quería decir exactamente, resultó que era otra cosa, y esa otra cosa es el último párrafo.\n\n## 9 · Qué hacer el lunes con un texto tuyo\n\nMedia hora larga, sin programas, y con un texto tuyo ya publicado. Los tres olores se buscan por separado porque se buscan de tres maneras distintas, que es justo la lección de la sección 5.\n\n**Elige el material según lo que escribas.** Si das formación, el guion de una sesión, y si tienes grabada alguna, mejor esa: el anuncio se te cuela hablando mucho más que escribiendo. Si escribes para una empresa, el último boletín y la nota de producto más reciente. Si publicas en redes, junta en un documento las diez o quince últimas publicaciones y quítales las separaciones, porque tu perfil se lee del tirón y ahí es donde tus manías se ven juntas. Y si lo tuyo son textos cortos de los que salen muchos, fichas o bloques sueltos, junta también cuarenta: ninguna de las tres cosas de hoy se ve en un texto de dos párrafos.\n\n**Los anuncios se buscan con los ojos, al principio de los párrafos.** Lee solo la primera frase de cada uno, saltando el resto. Marca las que no traigan nada dentro y solo presenten lo que viene detrás. Si tienes el texto en un procesador, busca «la clave», «lo interesante», «spoiler», «la respuesta corta», «un matiz» y «aquí está», y mira una por una: las que señalen un sitio de verdad o traigan el aviso dentro se quedan.\n\n**El espejo se busca leyendo en alto, y solo hay una pregunta.** Cuando una frase te suene especialmente redonda, párate y mírala. ¿Tiene dos mitades con la misma forma unidas por un «más que» o un «menos que»? Si además puedes cambiar las dos mitades por otras cualesquiera y sigue sonando igual de bien, es esta. Y como aparece muy de tarde en tarde, con encontrar una en todo el documento ya has hecho el trabajo.\n\n**Las rayas se cuentan, y esta sí es una cuenta.** Mira cuántas palabras tiene el documento, que te lo dice cualquier procesador, y divide entre mil. Cuenta los guiones largos con la función de buscar. Divide lo segundo entre lo primero y ahí tienes tu proporción. No la compares con la mía: apúntala, haz lo mismo con otros tres o cuatro textos tuyos, y mira cuál se sale. Ese es el que hay que abrir. Y en el que se salga, busca además las frases con cuatro rayas, que se ven a simple vista.\n\n**Dónde mirar primero, según lo que hagas.** En formación, el arranque de cada bloque y los minutos de después de un descanso, que es donde uno reengancha anunciando. En material de empresa, la primera línea del boletín y el primer párrafo de la nota de producto, que son los dos sitios donde hay que enganchar en un renglón y se recurre al cartel. En redes, la línea de arriba de la publicación, la que se ve antes de darle a «ver más», que es donde el anuncio se ha vuelto casi una convención. Y si escribes en un hueco fijo, con plantilla ajena, empieza por lo único que es tuyo: los párrafos de dentro.\n\n## 10 · Confusiones habituales\n\n**«Entonces no puedo usar guiones.»** Puedes, y yo los uso. Lo que se mira aquí es el par que abre y cierra un matiz, y solo cuando aparece cada dos por tres. El guion suelto que corta la frase y sigue no entra en esto y no hay que tocarlo.\n\n**«Si no anuncio lo que viene, el lector se pierde.»** Contra lo esperado, pasa lo contrario. Lo que orienta a quien lee son los títulos, el índice y un texto ordenado, y todo eso lo puede escanear de un vistazo. El anuncio dentro del párrafo no orienta a nadie, porque para leerlo ya tiene que estar ahí. Si de verdad te preocupa la orientación, invierte en los títulos, que es donde se decide.\n\n**«Me han dicho que los guiones son de IA.»** Se dice mucho y la fama no se corresponde con las mediciones. En la práctica se ve densidad alta, no la presencia de guiones, y hay quien escribe así desde mucho antes de que existiera nada de esto. Como huella señala poco; como costumbre propia sí que vale mirarla.\n\n**«El espejo es una figura retórica de toda la vida.»** Lo es, y funciona. Lo que la estropea es la repetición, exactamente igual que con el molde antitético del capítulo del balancín. Una frase así en un texto es tu mejor frase. Tres son un tic, y a la tercera el lector ya sabe cómo va a acabar la cuarta.\n\n**«Yo escribo en una plantilla que ya trae los carteles puestos.»** Pasa mucho, sobre todo en boletines y en fichas. Si el cartel lo pone la plantilla, no lo has escrito tú y no vas a poder quitarlo publicación a publicación. Lo que sí puedes es no añadir los tuyos dentro, y pelear la plantilla una vez, que arregla todo lo que venga detrás.\n\n**«Esto lo hago cuando hablo, no cuando escribo.»** Muy probablemente, y por eso te decía antes que empieces por una sesión grabada. Al hablar, anunciar lo que viene es una manera de ganar dos segundos para pensar. El problema aparece cuando esos dos segundos se transcriben, o cuando se escriben directamente en un texto que nadie va a decir en alto.\n\n## 11 · Preguntas frecuentes\n\n**Doy clase y anuncio todo el rato: «ahora viene lo importante». ¿Está mal en el aula?** Ahí funciona mucho mejor que por escrito, porque en una clase tú ves las caras y anuncias cuando notas que se han ido. Lo que no aguanta es que sea tu manera de encadenar cada bloque, porque entonces deja de significar «esto importa» y pasa a significar «voy a seguir hablando». Elige dos momentos de la sesión y gástalo ahí.\n\n**Escribo titulares y asuntos de correo. Ahí anunciar es el oficio.** Es que ahí no es un anuncio: el asunto es lo único que tiene quien decide si abre, así que tiene que decir lo que hay dentro. El olor aparece cuando el cuerpo del correo vuelve a anunciar lo que el asunto ya anunció, y quien lo abre se encuentra dos capas de presentación antes de nada.\n\n**Publico en LinkedIn y la primera línea decide si alguien sigue leyendo. ¿Qué hago?** Lo mismo que en el asunto del correo, y con la misma trampa. La línea de arriba tiene que enganchar, y la manera barata de enganchar es prometer. Cámbiala por lo más concreto que tengas, que suele ser una cifra o una escena. «Spoiler: llevo tres años haciéndolo mal» engancha; «llevo tres años preparando mal las sesiones» engancha igual y ya ha empezado a contar.\n\n**¿Cómo distingo el espejo de una comparación normal cuando dudo?** Tapa las dos mitades y pregúntate qué has aprendido de la frase. Si la respuesta es un dato, era una comparación. Si la respuesta es una sensación de acuerdo, era el molde.\n\n**Traduzco material del inglés y viene lleno de guiones.** Bastante, sí, y con dos motivos que se suman: allí el inciso entre rayas se usa más que aquí, y además el traductor automático los deja tal cual. La cuenta hazla sobre la versión española, que es la única que va a leer alguien. Y ojo con los que vienen sin espacios, que en español se escriben pegados a las palabras y a veces el arreglo automático los deja mal.\n\n**Reviso textos escritos con una máquina. ¿Por dónde entro?** Por los principios de párrafo y por la densidad de rayas, en ese orden. El anuncio es de los tics más constantes que hay ahí, porque presentar lo que viene es una manera segurísima de empezar un párrafo cuando no se sabe qué decir. Los tres de hoy se quitan en una pasada rápida.\n\n**Un cliente me devuelve el texto pidiendo que «enganche más» y lo que me sale son anuncios.** Es la reacción normal, y hay una salida mejor. Cuando alguien pide eso, lo que suele faltar es concreción: un dato con su fecha, o una escena contada por dentro. Prueba a añadir uno de los dos en el primer párrafo antes de tocar el tono, y enséñale las dos versiones.\n\n**¿Y si mi proporción de guiones sale muy por encima de la tuya?** Pues probablemente escribes con más incisos que yo, y eso no tiene nada de malo. La proporción no sirve para compararte conmigo, sirve para compararte contigo: para eso hay que medir varios textos propios y mirar cuál se sale de la fila. Un texto que dobla a los otros tuyos es el que merece que lo abras.\n\n---\n\n## Lo que te llevas y lo que viene\n\n**Coge el último texto que hayas publicado y haz solo la cuenta de las rayas.** Palabras entre mil, guiones contados con la función de buscar, y la división. Cinco minutos, sin corregir nada. Apúntala en algún sitio, porque la vas a volver a necesitar.\n\n**Y para lo próximo que escribas, quítale la primera frase a tres párrafos.** Si alguno se lee igual de bien sin ella, ese párrafo llevaba un cartel delante.\n\nCon esto termina la familia del énfasis. Cuatro capítulos buscando lo mismo por cuatro caminos distintos, y el módulo que viene cambia de asunto por completo.\n\nPorque hay otra manera de que un texto se note escrito por alguien, y va por el camino contrario. No sube la voz en ningún momento y aun así suena ajeno, como una circular del ayuntamiento. Buena parte de eso ocurre dentro del verbo, en un sitio donde todavía no hemos mirado.\n", "detectores": [{"codigo": "D31", "nombre": "meta anuncio", "ficha": "02-enfasis-de-carton/D31-meta-anuncio.md", "familia": {" : 45}, "remate": {"mediana": 8.7, "p10": 5.6, "p90": 12.6, "min": 3.4, "max": 13.6, "piezas": 45}, "transicion": {"mediana": 1.0, "p10": 0.0, "p90": 2.3, "min": 0.0, "max": 3.2, "piezas": 45}}}, "marcas_degradadas": {"documento": 2}, "avisos": [{"detector": "muestra", "regla": "86 lineas marcadas como muestra y excluidas del analisis. Son prosa citada, no escrita — compruebalo si no lo son.", "contexto": "<!-- lint-prosa: muestra -->"}]}}, {"nombre": "HUMWRI-0.2-la-estructura-no-las-palabras-firmado.json", "datos": {"version_informe": "1.0", "version_ruleset": "120f14e31a9d96a7", "version_productor": "ca8290be11d7", "generado": "2026-09-04T17:27:53", "pieza": {"fichero": "HUMWRI-0.2-la-estructura-no-las-palabras.md", "ruta": "Desarrollos\\HUMWRI - Escritura humana en la era de la IA\\temario\\HUMWRI-0.2-la-estructura-no-las-palabras.md", "tipo": "base", "curso": "HUMWRI - Escritura humana en la era de la IA", "codigo_curso": "HUMWRI", "submodulo": "0.2", "etiqueta": "firmado"}, "resumen": {"puntuacion": 92, "banda": "Listo para publicar", "banda_tono": "ok", "palabras": 4314, "frases": 238, "lineas_de_muestra": 15, "smells": 6, "por_severidad": {"rojo": 0, "ambar": 2, "info": 4}}, "texto": "# 0.2 · Lo que de verdad delata a la IA: la estructura, no las palabras\n\n## El rotulador amarillo\n\nImagina a alguien repasando un texto con un rotulador. Va subrayando palabras, y al terminar tiene cinco marcas y una conclusión: esto lo ha escrito una máquina. Lo subrayado es esto:\n\n<!-- lint-prosa: muestra -->\n> «además» · «en resumen» · «robusto» · un guion largo · otro guion largo\n<!-- lint-prosa: fin -->\n\nEl texto lo había escrito una persona. Una persona que escribe así desde antes de que existiera ninguna máquina que escribiera.\n\nLa escena se repite en departamentos enteros, y con buena fe. Esa lista mental de palabras sospechosas la tenemos hecha muchos, y alguna vez la hemos usado para juzgar el trabajo de alguien. El problema es que la lista **no distingue**: marca a quien escribe con un vocabulario más sencillo, a quien aprendió a redactar en un manual corporativo, y a quien sencillamente usa «además» porque le suena bien.\n\nY mientras tanto, la pista que sí funciona estaba en otro sitio, en un plano que el rotulador no toca: **no en qué palabras hay, sino en cómo está montado el texto por dentro.**\n\n## Dónde estás\n\nVienes del capítulo anterior sabiendo que lo genérico se ha abaratado y que tu valor está en lo que no lo es. Y sales de él con un hueco: sabes que tienes que reconocer lo genérico, y todavía no sabes por dónde se reconoce.\n\nEste capítulo cierra ese hueco. Es el que te cambia el sitio donde miras.\n\n- **De aquí sales sabiendo** por qué la búsqueda de palabras sospechosas falla, qué se mira en su lugar, y tres cosas concretas que puedes ver hoy en cualquier texto.\n- **En 0.3** verás por qué todos esos textos se parecen tanto entre sí: los humanos nos dispersamos y las máquinas convergen, y eso está medido con tres pruebas distintas.\n- **En 0.4**, por qué los atajos para disimular todo esto no funcionan: los programas que se venden para detectar texto automático —los **detectores**— y los que prometen disfrazarlo, atacan el síntoma y estropean el texto.\n\nA partir del módulo 1 empieza el catálogo, y todo lo que veas ahí se apoya en la distinción que se monta aquí.\n\n## Lo que vas a leer aquí\n\n1. Por qué la caza de palabras no funciona, y el dato que lo mide\n2. Qué es un rasgo narrativo, dicho sin jerga de literatura\n3. El texto que te explica el significado de lo que acaba de contar\n4. La historia que va por un solo carril y decide sin dudar\n5. El tiempo que avanza siempre en línea recta\n6. El acento propio que tiene cada modelo, y por qué no es una regla\n7. Cómo se mira todo esto sin ser investigador, en ocho minutos\n8. Confusiones habituales\n9. Preguntas frecuentes\n\n---\n\n## 1 · Por qué la caza de palabras no funciona\n\nEmpecemos por el dato: es el que ordena todo lo demás.\n\nUn grupo de investigadores de la Universidad de Maryland y de Google DeepMind montó un experimento grande: **10.272 encargos de escritura**, cada uno escrito por una persona y por cinco modelos distintos. El material reunido son **61.608 relatos**, de unas cinco mil palabras cada uno. Sobre todo ese material midieron **trescientas y pico decisiones de estructura** de cada texto, repartidas en diez dimensiones. Y las pusieron a competir contra el otro plano, el de siempre: **las características de superficie**.\n\nLas de superficie son las del rotulador: qué palabras, qué longitud de frase, qué puntuación. Las de estructura miden **decisiones sobre cómo se cuenta**. De eso va la sección siguiente.\n\nDespués entrenaron un programa para distinguir texto humano de texto de máquina **usando solo las de estructura**, sin dejarle mirar ni una palabra concreta.\n\n> Acertó el **93,2 %** de las veces. Y ese resultado conserva **más del 97 %** de lo que consigue un programa que sí mira el estilo.\n\nLéelo otra vez: tiene dos lecturas y las dos cuentan.\n\n**La primera:** la estructura sola basta. Puedes taparle a alguien todas las palabras del texto, dejarle ver únicamente cómo está construido, y acierta nueve de cada diez veces.\n\n**La segunda, que es la incómoda:** todo el trabajo del rotulador —las listas de palabras sospechosas, los guiones largos, el vocabulario de folleto— aporta **menos de un 3 %** por encima de eso. Años de intuiciones sobre «palabras de IA» valen tres puntos.\n\n*(Datos de un estudio publicado en abril de 2026, todavía en revisión. Vuelve a aparecer en el capítulo 0.3, con otra pregunta y otro grupo de investigación.)*\n\n### De dónde viene la costumbre de buscar palabras\n\nLa caza de vocabulario no se la inventó nadie por pereza. Viene de un sitio razonable: **es lo que funcionaba antes**.\n\nDurante veinte años, la forma de pillar un texto copiado fue buscar cadenas de palabras idénticas. Los programas antiplagio hacen eso, y lo hacen bien, porque copiar deja la huella a la vista: las mismas palabras en el mismo orden. Toda una generación de correctores, profesores y responsables de contenido aprendió a mirar ahí.\n\nEl problema es que un texto automático **no está copiado**. Es original palabra por palabra: esa combinación exacta no existía antes. Así que la herramienta que servía para lo anterior no sirve para esto, y quien la sigue usando cree estar mirando y no está mirando nada.\n\n### Y por qué esto te importa a ti, no al que investiga\n\nPorque cambia lo que haces el lunes cuando te llega un texto.\n\nSi tu método es la lista de palabras, tienes dos problemas a la vez. Vas a marcar como sospechosos textos de compañeros que escriben bien y sencillo. Y vas a dejar pasar textos automáticos a los que alguien ha cambiado cuatro palabras — que es exactamente lo que hace cualquiera en cuanto sospecha que lo están mirando.\n\nCon la estructura no pasa eso. **Cambiar las palabras es de diez segundos; cambiar cómo está montado un texto obliga a rehacerlo entero.** También eso se le puede encargar a la máquina, claro, y entonces lo que devuelve es otro texto, no el tuyo arreglado. Por eso la señal aguanta.\n\n---\n\n## 2 · Qué es un rasgo narrativo, dicho sin jerga\n\n«Rasgo narrativo» suena a clase de literatura, y la reacción normal es pensar que eso va de novelas y no del correo que tienes a medias. Vamos a quitarle la etiqueta: debajo hay algo sencillo.\n\nUn rasgo narrativo es **una decisión sobre cómo se cuenta algo**, no sobre con qué palabras. Por ejemplo: si el texto te dice lo que significa lo que acaba de contar, o te deja sacarlo a ti. Si sigue un solo hilo o se abre en varios. Si va en el orden en que pasaron las cosas o salta. Si el que decide lo tiene fácil o lo tiene difícil.\n\nTodas esas decisiones se toman **antes** de elegir ni una palabra, y todas se notan en cualquier texto que cuente algo: una nota de prensa cuenta algo, un caso de cliente cuenta algo, una propuesta cuenta algo. No hace falta que haya un protagonista con nombre.\n\nLos investigadores agruparon todas esas decisiones en **las diez dimensiones** de antes. No hace falta aprenderse las diez; con ver seis de ellas se entiende dónde está el plano que estamos mirando: quién actúa y qué quiere · qué pasa y en qué orden · qué se hace con el tiempo · desde dónde se mira · qué se dice y qué se calla · cuánto se resuelve al final.\n\nNinguna de esas seis se contesta eligiendo palabras. Se contestan **antes**, cuando decides cómo vas a contarlo — y se notan después, se use el vocabulario que se use.\n\nY aquí llega el dato que convierte todo esto en algo que se puede usar un martes. El estudio midió trescientas y pico de esas decisiones, y encontró que **unas treinta concentran la mayor parte de la señal**. Trescientas no las mira nadie. Treinta se pueden aprender, y de esas treinta hay tres que se ven a simple vista y valen para el trabajo que tú haces.\n\nVan una detrás de otra.\n\n---\n\n## 3 · El texto que explica su propio significado\n\nEste es el más fácil de ver y el que más aparece.\n\nUn texto automático tiende a **contar algo y a continuación decirte lo que significa**. No se fía de que lo pilles. Cierra el párrafo con la moraleja puesta, subrayada, por si acaso.\n\nUn ejemplo inventado, de los que se ven en cualquier caso de cliente:\n\n<!-- lint-prosa: muestra -->\n> El equipo tardó tres semanas en detectar el fallo, y para entonces ya había llegado a catorce clientes. **Esto demuestra la importancia de contar con sistemas de detección temprana en los procesos críticos.**\n<!-- lint-prosa: fin -->\n\nLa frase del caso funciona sola. La que va en negrita te explica lo que la anterior ya había dicho, y fíjate en el efecto: no añade información — **te quita la conclusión de la boca**.\n\nUna persona con oficio suele hacer lo contrario. Cuenta el caso, se calla, y confía en que quien lee llegue. Y si necesita rematar, remata con algo que **abre**, no con algo que cierra:\n\n<!-- lint-prosa: muestra -->\n> El equipo tardó tres semanas en detectar el fallo. Los catorce clientes se enteraron antes que ellos.\n<!-- lint-prosa: fin -->\n\n### Por qué las máquinas explican la moraleja\n\nNo es un capricho: entenderlo te ahorra pelearte con el síntoma.\n\nUn modelo de lenguaje se entrena para producir el texto que un lector calificaría como completo y bien acabado. Y un texto que explica lo que significa **parece** más completo: no deja cabos, no arriesga, no se puede malinterpretar. La moraleja explícita es la forma más barata de parecer que has cerrado bien.\n\nEl coste, claro, lo paga quien lee: se le trata como si no fuera a llegar solo.\n\n### Explica primero y luego cuenta\n\nLo que funciona es **mover las explicaciones de sitio**. Explica antes de contar, no después. Si tu lector necesita saber qué es una migración para entender el caso, díselo al principio; si ya lo sabe, cuenta el caso y calla.\n\nY hay un remate que sustituye bien a la moraleja, porque hace el mismo trabajo sin masticárselo a nadie: **cerrar con el detalle que sobra**. «Contabilidad todavía pregunta por aquellos informes» no explica nada y lo dice todo.\n\n### El error al corregir: quitar todas las frases de cierre\n\nEl texto se queda en una sucesión de hechos sin respirar, como un parte militar.\n\nLa diferencia está en para quién es la frase. Si le explica al lector lo que acaba de leer, sobra. Si te sirve a ti para enlazar con lo que viene, se queda — y entonces hace de bisagra, que es otro oficio.\n\n### Explicar está bien; explicar la moraleja, no\n\nExplicar no es malo. Un capítulo de curso explica todo el rato, y este también.\n\nLa diferencia está en **qué** se explica. Explicar un mecanismo que el lector no conoce es tu trabajo. Explicarle la conclusión de una historia que acabas de contarle, no — eso es sobreexplicar el tema, que es la forma que mide el estudio. Cuando dudes, la pregunta que resuelve es esta: **¿esta frase añade algo que el lector no tenía, o le repite lo que ya había entendido?**\n\n---\n\n## 4 · La historia de un solo carril\n\nCon el segundo hay que alejarse del texto: es cuestión de forma, y se ve mirando el conjunto, no frase a frase.\n\nUn texto automático prefiere **un solo hilo, ordenado y sin ramas**. Empieza, avanza, llega. Todo lo que aparece sirve para lo mismo. No hay una segunda cosa pasando a la vez, no hay nada que se quede sin resolver, no hay un cabo que el autor decidió dejar suelto porque en la vida real quedó suelto.\n\nY tiene un gemelo, que es la parte más interesante del hallazgo: **las decisiones salen fáciles**. Cuando el texto llega al momento en que alguien tiene que elegir, la elección ya viene con su respuesta correcta. Lo que el estudio encontró en los textos humanos es lo contrario: las decisiones se plantean **con las dos manos llenas**, con algo que se gana y algo que se pierde en cada opción.\n\nDetrás de los dos rasgos —el carril y la decisión fácil— está el mismo reflejo: ir a lo seguro. Una segunda historia en marcha puede despistar, un cabo suelto puede parecer un descuido y una decisión sin respuesta buena deja al lector a medias. Un modelo entrenado para gustar esquiva las tres. De ahí sale el carril.\n\nMira estos dos arranques del mismo caso:\n\n<!-- lint-prosa: muestra -->\n> **Uno.** Después de evaluar las alternativas, el equipo decidió migrar a la nueva plataforma. La decisión permitió reducir los tiempos de respuesta y mejorar la experiencia de los usuarios.\n<!-- lint-prosa: fin -->\n\n<!-- lint-prosa: muestra -->\n> **Dos.** El equipo migró sabiendo que iba a perder los informes que llevaban cuatro años usando. Los tiempos de respuesta mejoraron. Contabilidad todavía pregunta por aquellos informes.\n<!-- lint-prosa: fin -->\n\nEl de arriba tiene un carril: se evalúa, se decide, sale bien. El de abajo tiene dos cosas pasando a la vez y una que sigue sin resolverse. **Y el segundo es el que alguien se cree**, porque cualquiera que haya migrado algo sabe que se pierde algo por el camino.\n\n### Y el peligro: inventarse el conflicto\n\nAlguien lee esto, vuelve a su caso de cliente y le añade una dificultad que no ocurrió, o un cabo suelto de adorno que no lleva a ninguna parte.\n\nSe nota enseguida, y encima es lo único de este capítulo que puede meterte en un problema de verdad: un caso de cliente con un obstáculo inventado es un caso falso. **El precio que se cuenta tiene que ser el que se pagó.** Si de verdad no se pagó ninguno, el texto es de un proyecto que salió redondo, y eso también se puede contar — diciéndolo.\n\n### El carril único en una propuesta o en un post\n\nEn un caso de cliente, en una propuesta o en un post, el carril único aparece así: **todo lo que cuentas lleva a la conclusión y nada la complica.** Sale un texto que se lee de un tirón y no se recuerda, porque no ha pasado nada.\n\nLa corrección cuesta poco, y no consiste en inventar drama. Consiste en **contar el precio que sí se pagó**. Lo que se descartó, lo que se rompió por el camino, lo que sigue medio pendiente. Eso ya existe en tu caso real; lo que suele pasar es que se poda al escribir: parece que resta.\n\n---\n\n## 5 · El tiempo que va en línea recta\n\nEl que queda cuesta un poco más de ver. Como casi nadie lo ve, casi nadie se molesta en disimularlo.\n\nLos textos humanos se mueven por el tiempo. Empiezan por el final y luego vuelven. Meten un salto atrás en mitad de una explicación. Cuentan algo de hace dos años porque ilumina lo de esta semana. Dan un rodeo.\n\nLos textos automáticos tiran a la línea recta: primero lo primero, después lo segundo, al final lo último.\n\nEs el mismo mecanismo que los otros dos, por cierto. El orden cronológico es el más seguro: nunca confunde a nadie, nunca obliga al lector a sostener dos momentos a la vez. Y de tanto ir a lo seguro, el texto sale **plano**.\n\nFíjate en el arranque de este mismo capítulo. Empieza con alguien subrayando palabras con un rotulador, que es una escena del final de la historia — el momento en que el método ya ha fallado. Y solo después va al estudio que explica por qué. Ese salto está puesto a propósito: es un ejemplo de lo que estamos mirando.\n\n### Los tres sitios donde cabe un salto\n\nNo hace falta reordenar el texto entero. En la práctica, un salto de tiempo entra bien en tres sitios y en ninguno más:\n\n**Al empezar**, contando el final o el momento peor, y volviendo después. Es lo que hace la apertura de este capítulo.\n\n**En mitad de una explicación**, cuando algo de antes explica lo de ahora: «esto viene de cuando decidimos, hace dos años, no tocar el formato de los informes».\n\n**Al cerrar**, saltando hacia delante para decir en qué quedó la cosa — que es distinto de resumir lo dicho.\n\nUno por texto basta. Dos ya empiezan a estorbar. Al siguiente, la nota de prensa se ha convertido en una película de Nolan.\n\n### La prueba de barajar\n\nCoge un texto tuyo, mira solo el orden en que van sus dos o tres primeros párrafos, y pregúntate si podrías barajarlos.\n\nSi se pueden cambiar de sitio sin que se rompa nada, no tenías estructura temporal: tenías una lista. Y si el texto entero avanza en el orden en que pasaron las cosas de principio a fin, sin un solo salto, es el patrón que estamos mirando. El orden cronológico no está mal. Lo que delata es **elegirlo siempre**, en todos los textos y sin pensarlo.\n\n---\n\n## 6 · Cada modelo tiene acento\n\nCon la sobreexplicación, el carril único y la línea recta se acaba lo que puedes buscar a simple vista en un texto. Lo que viene ahora es un hallazgo de otra clase. Hay que cogerlo con la mano abierta.\n\nEl mismo estudio se hizo una segunda pregunta, más difícil: **quién de los seis** había escrito cada texto — los cinco modelos y la persona. Acertó bastante menos —un **68,4 %**, contra el 93,2 % de la otra pregunta—. Aun así quedó muy por encima de lo que saldría por azar, y al mirar por qué encontró que cada uno tiene sus manías:\n\n| Modelo | Su tic en los relatos del estudio |\n|---|---|\n| **Claude** | la tensión sube muy poco: los acontecimientos se encadenan sin llegar a escalar |\n| **GPT** | abusa de las secuencias oníricas — sueños, visiones, escenas irreales |\n| **Gemini** | describe a las personas por fuera: qué llevaban puesto, qué gesto hicieron |\n\nQue se puedan distinguir entre sí dice algo más gordo que la lista en sí: **estas manías no son ruido, son firma**. Y si un programa puede aprenderlas, tú también puedes cogerle el aire al modelo con el que trabajas todos los días.\n\nEn tu material esos tres tics no vas a verlos: en una nota de prensa no hay sueños ni tensión que escale. Lo que se traslada a tu trabajo es cómo se le encuentra el acento a un modelo, y sale gratis. La próxima vez que te devuelva un texto, antes de darlo por bueno apunta en un documento aparte el tipo de arreglo que le has hecho, en cuatro palabras: «le quité dos moralejas», «le puse el precio que se pagó», «le corté tres remates». Una línea por texto. Con una docena de líneas ya se ve lo que corriges siempre: su acento.\n\n**Y ahora la mano abierta, porque esto se malinterpreta con facilidad.** Son tendencias medidas sobre decenas de miles de textos, no reglas que se cumplan en cada uno. Un texto suelto puede romper el patrón sin que eso signifique nada. Y están atadas a las versiones que se probaron a principios de 2026: la próxima versión de cualquiera de esos modelos puede traer otras manías.\n\nLos tres defectos de antes aguantan mejor ese cambio. Salen de entrenar a un modelo para que guste, y eso va a seguir siendo lo que se busque en la próxima versión y en la siguiente.\n\nSirve para **conocer a tu herramienta**, no para acusar a nadie con un texto en la mano.\n\n---\n\n## 7 · Cómo se mira esto sin ser investigador\n\nLo medido sobre sesenta mil relatos está muy bien, pero tú tienes ocho minutos y un documento abierto delante.\n\n**Empieza por un texto que no sea tuyo.** Coge cualquier cosa que te haya llegado esta semana —una nota de prensa, un artículo del sector, un correo largo— y hazle las tres preguntas por orden: ¿me explica lo que significa lo que acaba de contar? ¿pasa una sola cosa o varias? ¿podría barajar los primeros párrafos?\n\nCon texto ajeno esto sale a la primera, porque no sabes lo que el autor quería decir: solo ves lo que dice. En quince o veinte textos le coges el aire. A partir de ahí lo notas sin buscarlo.\n\n**Con lo tuyo cuesta más, y por un motivo concreto.** Cuando lees tu propio texto no lees lo que está escrito: lees lo que querías escribir. La moraleja de más te parece necesaria porque recuerdas la duda que tenías al ponerla. El carril único te parece claridad: tú sí sabes lo que descartaste por el camino.\n\nContra eso hay dos trucos baratos. **Dejarlo dormir**: un día basta; a veces, una hora. Y **leerlo en alto.** La moraleja explícita, dicha en voz alta, suena a lo que es — a alguien explicándote un chiste que ya habías entendido.\n\n**Y un aviso, porque apetece hacerlo:** no conviertas estas tres preguntas en una lista de comprobación que pasas a todo lo que escribes. Tres preguntas usadas con criterio en el texto que importa valen más que treinta preguntas aplicadas a todo por rutina. Los textos que se juegan algo —una propuesta, algo que firmas, lo que va a representarte— merecen los ocho minutos. El resto de lo que escribes rara vez los pide.\n\n---\n\n## 8 · Confusiones habituales\n\n**«Entonces basta con estructurar distinto y ya está.»** Funcionaría si el objetivo fuera esquivar un programa. Pero cambiar la estructura por fuera —meter un salto temporal decorativo, añadir un cabo suelto que no lleva a nada— produce un texto peor, no uno más humano. Los saltos y los cabos sueltos de un texto humano están ahí porque **la historia los tenía**. El 0.4 entero va de por qué los atajos de este tipo fracasan.\n\n**«Mis textos no cuentan historias, así que esto no aplica.»** Cuentan bastante más de lo que se ve a primera vista. Un caso de cliente es una historia con protagonista y decisión. Una propuesta cuenta cómo se llega de un problema a una solución. Hasta una descripción de producto tiene un antes y un después. Lo que no encaja aquí son los documentos puramente informativos — una tabla de precios, un listado de requisitos—, donde no hay gran cosa que decidir, ni para la máquina ni para ti.\n\n**«Si un programa lo detecta con un 93,2 %, ¿por qué no lo uso y me ahorro el curso?»** Porque ese programa no existe como producto, y los que se venden como tales miden otra cosa. Esa diferencia —qué miden de verdad esos programas y por qué se equivocan con quien escribe sencillo— tiene tres estudios detrás y un capítulo entero.\n\n**«Esto está medido sobre relatos de cinco mil palabras. Yo escribo posts de trescientas.»** Cierto, y va dicho antes de que lo pienses. Las cifras vienen de ahí y no se pueden trasladar a un post como si nada. Lo que sí viaja es **la mecánica**: explicar de más, ir por un solo carril y contar en línea recta son decisiones que se toman igual en trescientas palabras que en cinco mil. La proporción cambia; la señal se reconoce igual.\n\n---\n\n## 9 · Preguntas frecuentes\n\n**¿De dónde sale el 93,2 %?** Lo publicaron en abril de 2026 unos investigadores de la Universidad de Maryland junto con Google DeepMind, y lo midieron sobre 61.608 relatos. Está publicado como preprint —lo que significa que todavía no ha pasado la revisión de otros investigadores—, y por eso se cita con esa advertencia puesta, aquí y en cualquier sitio donde lo repitas.\n\n**¿Esto vale para textos en español?** El estudio es en inglés, y hay que decirlo. Lo que se mide, sin embargo, no depende del idioma: que un texto te explique la moraleja o que vaya en línea recta se ve igual en cualquier lengua. Lo que sí puede cambiar de un idioma a otro son los números concretos, y ese es un tema que reaparece en el módulo 6 con un caso medido.\n\n**Llevo años escribiendo. ¿No hago yo también algunas de estas cosas?** Seguramente sí, y algunas a propósito. Explicar el significado tiene sentido cuando escribes para alguien que empieza; el orden cronológico es el mejor orden para unas instrucciones. Lo que este capítulo te da es un sitio donde mirar. **La pregunta que resuelve: ¿lo has elegido, o te ha salido solo?**\n\nY hay un tercer caso que no es ninguno de los dos: **el formato manda**. Una nota de prensa va en pirámide invertida, un correo comercial va derecho al grano y una ficha de producto no tiene dónde meter un salto de tiempo. Ahí no lo elegiste tú ni te salió solo: lo traías puesto. En esos textos te queda poco margen, y lo poco sirve — el precio real de lo que hay detrás, el detalle que sobra al final. El resto guárdalo para los que sí te dejan sitio.\n\n**¿Y cómo distingo esto de escribir sencillo?** No se cruzan. Un texto sencillo puede tener varios hilos, saltos de tiempo y una decisión sin respuesta buena. Un texto complicadísimo de leer puede ir en línea recta y explicar cada moraleja. La sencillez está en las frases; esto está en el plano de arriba.\n\n---\n\n## Lo que te llevas y lo que viene\n\n**Hoy, con un texto tuyo delante:** coge el último caso de cliente, propuesta o post que hayas escrito y pásale las tres preguntas del apartado anterior. Con texto propio va a costar más, por lo que ya sabes: no lees lo que pusiste, lees lo que querías poner.\n\nY luego haz **una sola cosa** con el resultado: quítale el defecto que más veces te haya salido. Uno nada más, y mira cómo queda el texto — porque los tres a la vez no se corrigen sin reescribirlo entero, y hoy no toca.\n\n**Y el límite de lo que acabas de aprender.** Ahora sabes dónde mirar y tienes algo concreto que buscar. Lo que todavía no sabes es **por qué los textos automáticos se parecen tanto entre sí** — unos a otros, quiero decir, hasta el punto de que se puede dibujar la región donde caen todos.\n\nEso tiene medida propia y tres pruebas distintas. Y trae un hallazgo que descoloca: cuando varias personas buscan ideas cada una por su lado, pero cada una con su modelo, acaban **convergiendo en ideas parecidas**. De eso va el capítulo siguiente: por qué los textos automáticos acaban pareciéndose entre sí, y qué le pasa a quien se apoya siempre en el mismo modelo.\n", "detectores": [{"codigo": "D1", "nombre": "lexico de lista negra", "ficha": "03-voz-prestada/D01-lexico-de-lista-negra.md", "familia": {"slug": "03-voz-prestada", "nombre": "voz prestada", "color": "#6b4fa8"}, "severidad": "ambar", "ocurrencias": [{"linea": 59, "regla": "lista-negra §8 — «superficie»", "fragmento": "Un grupo de investigadores de la Universidad de Maryland y de Google DeepMind montó un experimento grande: **10.272 enca", "inicio": 2740, "fin": 2860}, {"linea": 61, "regla": "lista-negra §8 — «superficie»", "fragmento": "Las de superficie son las del rotulador: qué palabras, qué longitud de frase, qué puntuación. Las de estructura miden **", "inicio": 3257, "fin": 3377}], "total": 2}, {"codigo": "D11", "nombre": "calibre", "ficha": "08-reglas-del-vault/D11-calibre.md", "familia": {"slug": "08-reglas-del-vault", "nombre": "reglas del vault", "color": "#4a5a6a"}, "severidad": "info", "ocurrencias": [{"linea": 1, "regla": "calibre de la base — 4314 palabras (recuento informativo, sin objetivo configurado por curso)", "fragmento": "4314 palabras", "sin_marca": "documento"}], "total": 1}, {"codigo": "D13", "nombre": "tono", "ficha": "03-voz-prestada/D13-tono.md", "familia": {"slug": "03-voz-prestada", "nombre": "voz prestada", "color": "#6b4fa8"}, "severidad": "info", "ocurrencias": [{"linea": 1, "regla": "tono — 3.2 % de las frases en negativo (8 de 248); listón 4.0 % = p90 del corpus (mediana 1,5 %)", "fragmento": "un capítulo sobre límites o excepciones sube legítimamente; el veredicto lo pone quien lee", "sin_marca": "documento"}], "total": 1}, {"codigo": "D39", "nombre": "tesauro compulsivo", "ficha": "06-nieblas/D39-tesauro-compulsivo.md", "familia": {"slug": "06-nieblas", "nombre": "nieblas", "color": "#8a6d3b"}, "severidad":

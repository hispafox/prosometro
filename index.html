, "regla": "1 lineas marcadas como muestra y excluidas del analisis. Son prosa citada, no escrita — compruebalo si no lo son.", "contexto": "<!-- lint-prosa: muestra -->"}]}}, {"nombre": "HUMWRI-0.1-el-valor-se-desplaza-firmado.json", "datos": {"version_informe": "1.0", "version_ruleset": "120f14e31a9d96a7", "version_productor": "ca8290be11d7", "generado": "2026-09-03T01:22:39", "pieza": {"fichero": "HUMWRI-0.1-el-valor-se-desplaza.md", "ruta": "..\\..\\Desarrollos\\HUMWRI - Escritura humana en la era de la IA\\temario\\HUMWRI-0.1-el-valor-se-desplaza.md", "tipo": "base", "curso": "HUMWRI - Escritura humana en la era de la IA", "codigo_curso": "HUMWRI", "submodulo": "0.1", "etiqueta": "firmado"}, "resumen": {"puntuacion": 94, "banda": "Listo para publicar", "banda_tono": "ok", "palabras": 4143, "frases": 210, "lineas_de_muestra": 1, "smells": 3, "por_severidad": {"rojo": 0, "ambar": 1, "info": 2}}, "texto": "# 0.1 · El valor se desplaza: qué abarata la IA y qué no\n\n## Un estudio de fotografía, en 1998\n\nPara tener una foto decente hacía falta alguien con un estudio. Iluminación, película, revelado, y el oficio de saber dónde poner los focos. Ese oficio se pagaba, y se pagaba bien, porque el cuello de botella estaba justo ahí: **conseguir una imagen técnicamente correcta era difícil.**\n\nLlegó lo digital y el cuello de botella desapareció. Hoy cualquiera saca una foto nítida, bien expuesta y enfocada con el teléfono que lleva en el bolsillo.\n\nLo que vino después no fue lo que se predijo. Los fotógrafos no desaparecieron: cambió por qué se les paga. Ya no por conseguir la imagen correcta, que ahora sale gratis, sino por saber **qué fotografiar**, desde dónde y con qué intención. El oficio se movió de la ejecución a la decisión.\n\nCon la escritura está pasando lo mismo. La parte difícil era producir un texto correcto sobre un tema conocido, y esa parte ahora se resuelve mientras te sirves un café.\n\nY antes de seguir, la parte que la analogía se deja fuera: a algunos fotógrafos el cambio se los llevó por delante. Los que se quedaron lo hicieron porque su trabajo estaba en la parte que no se abarató, no porque resistieran.\n\nCuál es esa parte en tu caso lo veremos con dos oficios concretos: a uno la máquina le quita lo difícil y lo deja peor, y al otro le quita lo tedioso y lo deja mejor.\n\n### La diferencia que casi nadie ve a la primera\n\nUna foto mal compuesta se reconoce al instante, aunque esté perfectamente expuesta. Cualquiera la ve y dice «no es esta».\n\nUn texto plano pero impecable, no. Se lee bien, no tiene faltas, dice cosas ciertas y ordenadas — y se cuela en sitios donde la foto no se habría colado nunca: en una propuesta, en un material de formación, en la publicación que lleva tu nombre.\n\nEse parecido engañoso es el problema de fondo. Y el primer paso para deshacerlo es saber **qué parte de tu trabajo se ha vuelto barata y qué parte no**, porque el valor no desaparece cuando algo se abarata. Se mueve.\n\nDe eso trata este capítulo: de rastrear a dónde ha ido, con las cifras delante.\n\n## Dónde estás\n\nEstás en el primer capítulo del curso, y este módulo es el marco: por qué el texto que produce una máquina sale correcto y plano al mismo tiempo, y qué se puede hacer al respecto.\n\n- **De aquí sales sabiendo** qué se ha abaratado de verdad, qué no, y por qué eso cambia dónde está tu valor.\n- **En 0.2** verás qué delata a un texto escrito en automático: está en cómo se sostiene por dentro, y se reconoce con la práctica.\n- **En 0.3**, por qué todos esos textos se parecen entre sí.\n- **En 0.4**, por qué los atajos para disimularlo no funcionan.\n\nA partir del módulo 1 empieza el catálogo: más de cuarenta patrones concretos, con sus ejemplos, y cómo se corrige cada uno.\n\n## Lo que vas a leer aquí\n\n1. Lo que la máquina *puede* hacer y lo que *hace*, que no es lo mismo\n2. Escribir subió, y venía de estar bajando\n3. Delegar la tarea o trabajar con la herramienta: el dato que se dio la vuelta\n4. Lo que queda cuando quitas lo que la máquina hace\n5. Por qué la escasez sube el precio de tener voz\n6. Confusiones habituales\n7. Preguntas frecuentes\n\n---\n\n## 1 · Lo que la máquina puede hacer y lo que hace\n\nLo que una tecnología es capaz de hacer y lo que de verdad está haciendo son dos cosas distintas, y buena parte del ruido de los últimos años sale de confundirlas.\n\nAnthropic publica desde hace tiempo un informe sobre el uso real de su modelo en el trabajo. Cruzan dos cosas: por un lado, qué tareas de cada ocupación son **teóricamente** abordables con un modelo de lenguaje; por otro, en cuáles se está usando **de verdad**, mirando las conversaciones reales.\n\nEn las ocupaciones de informática y matemáticas, el resultado es este:\n\n| | |\n|---|---|\n| tareas teóricamente abordables | **94 %** |\n| tareas donde se observa uso real | **33 %** |\n\nSesenta y un puntos de diferencia, en una profesión que adoptó estas herramientas pronto y a fondo.\n\nEl otro extremo también está medido, y apunta a lo mismo desde el lado contrario: el **97 %** de las tareas que sí se observan cae en categorías que se consideran teóricamente factibles. O sea que casi nada de lo que la gente hace con la herramienta la pilla fuera de su capacidad: lo que queda por recorrer está en el uso.\n\n### Por qué esa diferencia importa para ti\n\nOjo, que ese 94 y ese 33 son de informática, el oficio que más y antes ha usado estas herramientas. Es el caso extremo, y ahí la distancia es de sesenta y un puntos. La conversación pública habla siempre del número de la izquierda.\n\nCuando alguien dice «la IA ya escribe artículos», está describiendo la capacidad. Cuando tú abres el documento el lunes por la mañana, estás en el uso real: qué tareas concretas has pasado a la herramienta, cuáles has probado y has vuelto a hacer a mano, y cuáles ni se te ha ocurrido intentar.\n\nEl propio informe lo advierte: ese 33 % de uso observado está **contaminado por el criterio humano**. La gente elige qué tareas lleva a la herramienta, y si esperas que algo falle, ni lo intentas — así que esa tarea no aparece en ninguna estadística. Lo que se mide son las tareas que alguien pensó que iban a funcionar.\n\nDicho de otro modo: una parte de esa capacidad aparente es en realidad **buen ojo de quien la usa**. Y ese ojo es tuyo, no suyo.\n\n---\n\n## 2 · Escribir subió, y venía de estar bajando\n\nAquí es donde esto deja de ser una conversación general sobre tecnología y pasa a ser una conversación sobre lo que tú haces cada día.\n\nEntre agosto y noviembre de 2025, la proporción de uso dedicada a tareas de escritura **subió**, y el repunte se concentra en dos cosas muy concretas: **copyedición** —revisar y pulir un texto que ya existe— y la escritura y el refinado de textos de ficción.\n\nEse dato tiene dos lecturas y las dos importan.\n\nLa primera es la incómoda: **la fase de pulido es la que más se está delegando.** Si tu trabajo incluye recibir un borrador y dejarlo presentable, esa parte tiene competencia nueva.\n\nLa segunda apenas se cuenta: **subió después de haber estado bajando.** El informe lo dice expresamente — el repunte de escritura y diseño revirtió una caída sostenida en los informes anteriores. Venía cayendo, y este trimestre le tocó subir. Es un dato que se movió y que puede volver a moverse.\n\n### El uso se está ensanchando, no concentrando\n\nHay un dato intermedio que desmonta una intuición muy extendida.\n\nEl informe de marzo de 2026 mide un trimestre distinto y encuentra dos cosas. La primera es previsible: **el 36 % del uso es programación**, que sigue siendo con diferencia la actividad dominante. La segunda no lo es tanto. Las tareas educativas subieron del **9,3 % al 12,4 %** y las científicas del **6,3 % al 7,2 %**, y las diez tareas más frecuentes pasaron a ocupar **una porción menor** del total que tres meses antes.\n\nTraducido: la gente está llevando a estas herramientas **cosas más variadas**, no más de lo mismo. El uso se ensancha.\n\nEso importa para quien escribe por un motivo concreto. Cuando una herramienta se usa para pocas cosas, sus defectos son fáciles de acotar: sabes dónde falla porque solo hace tres tareas. Cuando se ensancha, sus defectos **se reparten por sitios donde nadie los está mirando**: un correo interno, un material de formación, la descripción de un producto que sale publicada sin que nadie la haya leído dos veces.\n\n### El dato más reciente, y por qué es el que hay que mirar\n\nEl informe de junio de 2026 —con datos de abril a junio— mide una cosa distinta y más útil para nosotros: **qué produce la herramienta**, no en qué ocupación se usa.\n\n| Lo que sale | Proporción de las conversaciones |\n|---|---|\n| explicaciones | **17 %** |\n| documentos e informes | **15 %** |\n\nUno de cada siete usos termina en un documento. Es la segunda categoría de todo lo que produce.\n\nEse mismo informe trae un segundo hallazgo que reaparece en todo el curso: **la salida está sistemáticamente por encima de la entrada en nivel de comprensión**. El informe lo mide en **años de educación**: es su forma de poner número a lo exigente que es algo — un texto, o una tarea —, contando la formación que hace falta para manejarlo. Cuanto más alto, más cuesta. Categoría tras categoría, lo que devuelve la herramienta pide **alrededor de un año más** que lo que escribió la persona al pedirlo. Donde más se separa es en lo visual: **2,6 años** en la creación de gráficos y **1,9** en diseño de juegos.\n\nLe pides algo con tus palabras y te devuelve algo escrito por encima del nivel con el que se lo pediste. La herramienta **sube el registro por defecto**.\n\nEse reflejo es el origen de media docena de los defectos que catalogaremos en los módulos 1 a 7. Cuando en el módulo 3 veamos el verbo enterrado —<!--m-->«realizar una configuración»<!--/m--> en lugar de «configurar»—, estaremos viendo este mismo reflejo con otra ropa.\n\n---\n\n## 3 · Delegar la tarea o trabajar con la herramienta\n\nCuando alguien usa una de estas herramientas, hace una de dos cosas.\n\nO **delega** —le encarga la tarea entera y se queda con lo que salga—, o **colabora**: va y viene, corrige, pide otra versión, aprende algo por el camino y decide al final. El informe llama a lo primero uso *automatizado* y a lo segundo uso *aumentado*, y los mide por separado.\n\nDurante 2025 la delegación fue ganando terreno. Las conversaciones donde alguien da una orden y recoge el resultado sin más pasaron del 27 % en enero al 39 % en agosto. La lectura de entonces era la que uno esperaría: si la gente confía cada vez más, delega cada vez más.\n\nY en noviembre de 2025 el dato se dio la vuelta. Aquí hacen falta dos números, y responden a preguntas distintas: uno es un reparto y el otro es una serie en el tiempo.\n\nUna reparte **todas** las conversaciones entre las dos formas de uso:\n\n| Cómo se usa | Sobre el total de conversaciones |\n|---|---|\n| colaborativo —lo que el informe llama uso *aumentado*— | **52 %** |\n| delegado —uso *automatizado*— | **45 %** |\n\nLa otra no reparte nada: sigue **un solo tipo de conversación a lo largo de los meses**, las órdenes directas de antes — encargo, resultado, y no se vuelve. Esa serie es la que subió del 27 % de enero al 39 % de agosto, y **en noviembre bajó al 32 %**.\n\nAsí que el 45 % dice **cuánto** hay de uso delegado en un momento dado, y el 32 % dice **hacia dónde va** una de sus formas. Al ser dos cortes del mismo material, no suman ni se restan.\n\n*(Datos de noviembre de 2025, publicados en el informe de enero de 2026. Los cito con su fecha porque son la foto de un momento, no el estado permanente de nada.)*\n\nLa colaboración volvió a ser más frecuente que la delegación. Y el informe apunta una explicación tentativa, en sus propias palabras cautelosas: los cambios de producto de ese periodo —la posibilidad de crear ficheros, la memoria entre conversaciones, las herramientas de personalización— **pudieron** haber llevado el uso hacia lo colaborativo.\n\n### Qué significa el vuelco para quien escribe\n\nQue la forma de uso que está creciendo es precisamente **la que te necesita delante**.\n\nDelegar es fácil de imaginar y fácil de temer: la herramienta hace, tú recoges. Colaborar pide más: saber qué pedir, reconocer cuándo lo que ha salido no sirve, y saber por qué no sirve. Lo último es lo que enseña este curso.\n\nEse vuelco es un dato de un trimestre concreto que puede volver a moverse, y que ya se movió una vez en la dirección contraria. Lo que sí deja en pie es una lección más estable: **la delegación y la colaboración no son grados de lo mismo. Son dos usos distintos, y solo uno de los dos te deja aprender algo.**\n\n---\n\n## 4 · Lo que queda cuando quitas lo que la máquina hace\n\nEste es el apartado que contesta la pregunta con la que llegabas. Y trae dos respuestas, opuestas entre sí.\n\nEl informe de enero de 2026 hace este ejercicio. Toma las tareas que la herramienta cubre hoy en cada ocupación, las quita, y mira **qué queda**.\n\nEl promedio dice algo incómodo. Las tareas que la herramienta cubre piden, de media, **14,4 años de educación**; las de la economía en su conjunto, **13,2**. La máquina se está llevando las tareas más exigentes. Así que el efecto de primer orden, en el grueso de las ocupaciones, es una **descualificación**: si le quitas a alguien las tareas que la herramienta hace, le queda lo menos exigente.\n\nPero el promedio esconde justo lo que hay que ver. Por eso el informe baja a dos oficios concretos.\n\n**Al agente de viajes** le quitas la planificación compleja de un itinerario. Le queda emitir billetes y cobrar. Sale perdiendo: se ha llevado lo difícil.\n\n**Al gestor de fincas** le quitas la contabilidad y el papeleo. Le quedan las negociaciones de contratos y el trato con propietarios e inquilinos. Sale ganando: se ha llevado lo tedioso.\n\nMismo movimiento, resultados opuestos. Y la diferencia no está en la ocupación: está en **dónde tenía cada uno su parte difícil**.\n\n### Cómo se aplica el reparto a tu caso\n\nLa pregunta útil no es «¿me va a sustituir?». Es esta:\n\n> **De lo que yo hago, ¿qué parte era genérica y qué parte solo la puedo poner yo?**\n\nSi en tu trabajo la parte difícil era producir el borrador —redactar un texto correcto sobre un tema conocido—, tienes competencia, y es barata.\n\nSi la parte difícil era otra cosa —saber qué del tema hay que contar y qué sobra, tener criterio sobre lo que has visto funcionar, ponerle a un tema una perspectiva que no tiene nadie más—, entonces lo que se ha abaratado es la parte que te estorbaba.\n\n**Para mucha gente la respuesta es «un poco de las dos».** Hay partes de tu trabajo que valían dinero y ya no lo valen, y hay otras que acaban de subir de precio, precisamente porque el resto se ha vuelto abundante.\n\n### El error que se comete al hacer este reparto\n\nCuando alguien se sienta a repartir su trabajo entre «genérico» y «solo mío», hay un error que yo veo repetirse en clase, y siempre en la misma dirección: **la gente mete en la columna de lo propio cosas que en realidad son genéricas, y las mete de buena fe.** No tengo un estudio que lo mida; lo tengo visto muchas veces.\n\nPasa así. Uno mira un párrafo suyo, reconoce su forma de escribir, y concluye que eso solo lo podía escribir él. Pero reconocer tu estilo y aportar algo son cosas distintas. Un párrafo puede sonar a ti de arriba abajo y no contener ni un dato, ni una decisión, ni una postura que no estuviera ya en la documentación del tema.\n\nLa prueba que separa una cosa de otra es incómoda y rápida: **quita tu nombre del texto y pregúntate si alguien podría notar que falta**. Si lo único que se pierde es el tono, era genérico con tu voz encima.\n\nY al revés, el error simétrico: hay quien mete en la columna de lo genérico cosas que solo tiene él, porque le parecen obvias. El dato de cuántas veces has visto fallar algo, el motivo por el que dejaste de hacer las cosas de cierta manera, lo que te contestó un cliente. **Lo obvio para ti no es obvio fuera de tu cabeza**, y esa es la materia prima que a un modelo le falta por definición.\n\nEl informe pone una condición delante de todo esto: describe qué pasaría **si** las tareas asistidas desaparecieran de las responsabilidades de alguien. No es una predicción de empleo. Lo traigo aquí porque ordena la pregunta, no porque adivine el futuro.\n\n---\n\n## 5 · Por qué la escasez sube el precio de tener voz\n\nLa tesis del curso sale de esos datos.\n\nCuando algo se vuelve abundante, deja de distinguir. Y lo que se ha vuelto abundante es **el texto correcto**: sin faltas, con las ideas donde tocan, con la estructura esperable. Eso ya no separa a nadie de nadie: cualquiera con una suscripción lo produce en segundos.\n\nLo que sigue siendo escaso es lo que no se puede producir así:\n\n**El criterio.** Saber por cuál de las cinco opciones empezar, y por qué. La lista de opciones está en la documentación; lo que no está es alguien que se moje.\n\n**La perspectiva.** Haber visto algo suficientes veces como para saber qué se repite, y contarlo desde ahí.\n\n**El detalle que solo tiene quien estuvo.** La cifra exacta, el día de la semana, lo que dijo el cliente. Un modelo puede escribir «una empresa mediana del sector industrial»; no puede escribir lo que te contestaron aquel martes.\n\n**La postura, con su matiz.** Decir «yo iría por aquí, aunque si tu caso es este otro, mejor lo contrario». Eso exige haber decidido antes y haberte equivocado alguna vez.\n\nLo que produce un modelo sale de un promedio de lo ya escrito, y las cuatro tienen algo en común: **ninguna se puede sacar de ahí**.\n\n### Correcto frente a bueno, con las dos columnas al lado\n\nLa distinción se ve mejor puesta en paralelo, porque quien dice «mi texto está bien» suele referirse a la columna izquierda.\n\n| Un texto correcto | Un texto que además vale |\n|---|---|\n| no tiene faltas | dice algo que quien lo lee no sabía |\n| tiene las ideas ordenadas | tiene una idea que su o rápido y sin culpa, porque para eso la herramienta es buena y pelear ahí es perder el tiempo. Otra: saber distinguir los documentos donde eso da igual de aquellos donde te juegas algo — una propuesta, un material que va a firmar tu nombre, una publicación que te va a representar. En esos, el texto genérico te cuesta dinero aunque nadie te lo diga.\n\n---\n\n## Lo que te llevas y lo que viene\n\n**Hoy, con un texto tuyo delante:** coge el último que hayas escrito con ayuda de una de estas herramientas y reparte sus párrafos en dos montones. En uno, lo que podría haber escrito cualquiera con acceso al mismo tema. En el otro, lo que solo podías escribir tú — porque lo viste, porque lo decidiste, o porque tienes una postura sobre ello.\n\nCuenta los dos montones, y **no te fíes del resultado** — que es justo el sentido del ejercicio. Ese error de meter lo genérico en la columna propia se repite mucho. Para el primer repaso ya tienes la prueba del nombre; para afinarla te faltan las señales del 0.2. Guarda los dos montones sin tocarlos: en 0.2 vas a tener con qué repasarlos, y esa proporción corregida es tu punto de partida real.\n\n**Y el límite de lo que acabas de aprender.** Sabes que el texto genérico se ha abaratado y que tu valor está en lo que no lo es. Lo que todavía no sabes es **reconocer lo genérico cuando lo tienes delante** — sobre todo si lo has escrito tú, o si lo has revisado y te ha parecido bien.\n\nY ahí hay una trampa. Se suele creer que un texto automático se reconoce por las palabras: por ciertos adjetivos, por ciertas muletillas, por un vocabulario que suena a folleto. La investigación dice que esa pista es la menos fiable de todas y que hay otra que funciona mucho mejor.\n\nLa pista que sí funciona está en cómo se sostiene el texto por dentro: el orden en que aparecen las ideas, y lo que el texto hace con el tiempo y con la duda. De eso va lo siguiente.", "detectores": [{"codigo": "D11", "nombre": "calibre", "ficha": "08-reglas-del-vault/D11-cal
